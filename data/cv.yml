name: Romain Giboreau
headline: Lead Geoscientist — Petroleum Systems and Applied AI
pdf: https://RomainGiboreau.github.io/My_Website/cv.pdf
summary: >-
  15 years across petroleum systems assessment and basin modeling — conventional, unconventional,
  biogenic and biodegraded resources — with a growing focus on applied AI/ML for geoscience
  workflows. Work spans 20+ basins on five continents.

