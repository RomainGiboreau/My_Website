experience:
  - title: Lead Geoscientist — Petroleum Systems and Applied AI
    org: Beicip-Franlab
    years: 2019 – present
    text:
      - >-
        Petroleum systems assessments across 20+ basins on five continents — source rock analysis,
        kinetic modeling, thermal and pressure modeling, burial history reconstruction, play fairway
        analysis, seismic interpretation, and petrophysical integration. Volumetric uncertainty
        (P10/P50/P90) and Probability of Success for prospect ranking. Construction of global basin
        opportunity databases.
    highlights:
      - name: JDA2 Basin AI — PETRONAS.
        text: >-
          Partnership between PETRONAS, Beicip-Franlab and AFED Digital integrating machine learning
          into forward stratigraphic modelling (FSM) as part of petroleum systems assessment. Project
          lead for Beicip-Franlab's side of the work — planning, client relations and deliverable
          validation on Beicip's scope.

  - title: R&D Geoscience Specialist — Machine Learning and Data Science
    org: IFPen
    years: "2024"
    note: 50/50 split with the Beicip-Franlab role above
    text:
      - >-
        Contributed to LLM, GraphRAG and agentic workflows built to extract geological insight from
        unstructured datasets — data collection, prompt design, testing and proposed improvements.
    highlights:
      - name: Datamix (IFPen Tellus programme).
        text: >-
          Built geospatial ML pipelines for CCS/CCUS subsurface property mapping and multi-criteria
          storage-site selection (scikit-learn, pandas, geopandas, numpy), as a public deliverable of
          the Datamix R&D project under IFPen's Tellus programme.

  - title: Exploration Software Manager
    org: Beicip-Franlab
    years: 2016 – 2018
    text:
      - >-
        Team lead for the exploration software development group — project planning, client
        communication, and software development validation. Drove internal promotion strategies for
        exploration software products.

  - title: Exploration Software Engineer
    org: Beicip-Franlab
    years: 2012 – 2016
    text:
      - >-
        Technical documentation for new and existing software features and workflows; client support
        for major IOCs and NOCs; user feedback collection feeding the development roadmap.
    list_title: "Major software contributions:"
    list:
      - Lithosphere module (2016)
      - Updated geochemistry library
      - KronosFlow — first official release (2018)
      - New DionisosFlow calculator (2018)
      - TemisFlow robustness and ergonomics policy (2017 – 2019)
      - Compositional framework for bulk kinetics (2025)

  - title: Geomodeling Specialist
    org: Paradigm France
    years: "2012"
    text:
      - >-
        Structural geology workflows for subsurface model building; seismic interpretation and fault
        modelling in complex structural settings.

  - title: Biomarker analysis — UMR Nancy
    years: "2011"
    text:
      - Biomarker analysis and stratigraphic correlation on Paris Basin wells.

  - title: Internship
    org: TotalEnergies
    years: "2011"
    text:
      - Validation testing of an internal geochemistry and PVT modeling software.

