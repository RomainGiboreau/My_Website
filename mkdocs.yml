site_name: Romain Giboreau
site_description: Notes on petroleum systems and basin modeling
site_url: https://RomainGiboreau.github.io/My_Website/

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - tables
  - footnotes
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - tags:
      tags_file: tags.md

nav:
  - Home: index.md
  - CV: cv.md
  - Notes:
      - notes/index.md
      - notes/pandas_polars.md
      - notes/mcda_promethee_ahp.md
  - Resources:
      - resources/index.md
      - resources/bibliography.md
  - Tools:
      - TR Cycles: https://RomainGiboreau.github.io/My_Website/tr-cycles/
      - Plot digitizer: https://RomainGiboreau.github.io/My_Website/digitizer/
      - Map digitizer: https://RomainGiboreau.github.io/My_Website/mapdigitizer/
      - Map interpolation: https://RomainGiboreau.github.io/My_Website/gridding/
      - Rock-Eval QC: https://RomainGiboreau.github.io/My_Website/rockeval/
      - Compaction fit: https://RomainGiboreau.github.io/My_Website/compaction/
      - Thermal maturity: https://RomainGiboreau.github.io/My_Website/maturity/
      - Biomarkers: https://RomainGiboreau.github.io/My_Website/biomarkers/
      - Chromatogram: https://RomainGiboreau.github.io/My_Website/chromatogram/
      - Clustering: https://RomainGiboreau.github.io/My_Website/clustering/
      - Convex & concave hulls: https://RomainGiboreau.github.io/My_Website/hull/
      - BHT correction: https://RomainGiboreau.github.io/My_Website/bht/
      - Source rock potential: https://RomainGiboreau.github.io/My_Website/source/
      - Ternary diagram: https://RomainGiboreau.github.io/My_Website/ternary/
      - Variogram: https://RomainGiboreau.github.io/My_Website/variogram/
      - MCDA (AHP & PROMETHEE): https://RomainGiboreau.github.io/My_Website/mcda/
  - Tags: tags.md
