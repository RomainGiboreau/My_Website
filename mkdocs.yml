site_name: Romain Giboreau
site_description: Notes on petroleum systems and basin modeling
site_url: https://RomainGiboreau.github.io/My_Website/

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - tables
  - footnotes
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css
  
plugins:
  - search
  - tags:
      tags_file: tags.md

nav:
  - Home: index.md
  - CV: cv.md
  - Notes:
      - notes/index.md
      - notes/pandas_polars.md
      - notes/mcda_promethee_ahp.md
  - Resources: 
      - resources/index.md
      - resources/bibliography.md
      - resources/company-announcements.md
  - Tags: tags.md


