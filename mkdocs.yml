site_name: Romain Giboreau
site_description: Notes on petroleum systems and basin modeling
site_url: https://RomainGiboreau.github.io/My_Website/

theme:
  name: material
  custom_dir: overrides
  favicon: assets/favicon.svg
  logo: assets/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - tables
  - footnotes
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/expertise.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js

extra_css:
  # ponytail: bump ?v= when the CSS changes so browsers drop their cached copy
  - stylesheets/extra.css?v=16

# ponytail: placeholder page kept in the repo but not published until it has real content
exclude_docs: |
  personal.md

# ponytail: printable CV, rendered to cv.pdf in CI; not linked from the nav
not_in_nav: |
  cv-print.md

hooks:
  - hooks/cv.py

plugins:
  - search
  - tags

nav:
  - Home: index.md
  - CV: cv.md
  - Talks & publications: talks.md
  - Notes:
      - notes/index.md
      - notes/pandas_polars.md
      - notes/mcda_promethee_ahp.md
  - Resources:
      - resources/index.md
      - resources/bibliography.md
  - Tools:
      - Data preparation:
          - LAS checker: las-checker/index.html
          - ZMAP checker: zmap-checker/index.html
          - Colour-blind check: cvd/index.html
      - Digitization:
          - Plot digitizer: digitizer/index.html
          - Continuous map digitizer: mapdigitizer/index.html
          - Discrete map digitizer: discretemap/index.html
          - Well-log digitizer: logdigitizer/index.html
      - Mapping and spatial statistics:
          - Map interpolation: gridding/index.html
          - Variogram: variogram/index.html
          - Convex & concave hulls: hull/index.html
          - Clustering: clustering/index.html
          - GDE map generator: gdemap/index.html
          - Grid attributes: gridattr/index.html
      - Organic geochemistry:
          - Rock-Eval QC: rockeval/index.html
          - Source rock potential: source/index.html
          - Thermal maturity: maturity/index.html
          - Biomarkers: biomarkers/index.html
          - Chromatogram: chromatogram/index.html
          - Ternary diagram: ternary/index.html
      - Basin modelling and petrophysics:
          - Compaction fit: compaction/index.html
          - BHT correction: bht/index.html
          - TR Cycles: tr-cycles/index.html
          - Petroleum system events: psec/index.html
          - Burial history (1D): burial/index.html
          - Log correlation (DTW): logcorr/index.html
      - Decision support:
          - MCDA (AHP & PROMETHEE): mcda/index.html
          - Prospect risking (gCOS, eCOS): risking/index.html
          - Portfolio consolidation: portfolio/index.html
          - Field development screening: fdp/index.html
          - Contact and well POS: wellpos/index.html
          - Distribution fitting: distfit/index.html
  - Chess: chess/index.html
  - Tags: tags.md
  - Contact: contact.md
