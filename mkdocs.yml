site_name: Romain Giboreau
site_description: Notes on petroleum systems and basin modeling
site_url: https://RomainGiboreau.github.io/My_Website/

theme:
  name: material
  favicon: assets/favicon.svg
  logo: assets/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - tables
  - footnotes
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

# ponytail: placeholder page kept in the repo but not published until it has real content
exclude_docs: |
  personal.md

plugins:
  - search
  - tags:
      tags_file: tags.md

nav:
  - Home: index.md
  - CV: cv.md
  - Talks & publications: talks.md
  - Notes:
      - notes/index.md
      - notes/pandas_polars.md
      - notes/mcda_promethee_ahp.md
  - Resources:
      - resources/index.md
      - resources/bibliography.md
  - Tools:
      - Digitization:
          - Plot digitizer: digitizer/index.html
          - Map digitizer: mapdigitizer/index.html
      - Mapping and spatial statistics:
          - Map interpolation: gridding/index.html
          - Variogram: variogram/index.html
          - Convex & concave hulls: hull/index.html
          - Clustering: clustering/index.html
      - Organic geochemistry:
          - Rock-Eval QC: rockeval/index.html
          - Source rock potential: source/index.html
          - Thermal maturity: maturity/index.html
          - Biomarkers: biomarkers/index.html
          - Chromatogram: chromatogram/index.html
          - Ternary diagram: ternary/index.html
      - Basin modelling and petrophysics:
          - Compaction fit: compaction/index.html
          - BHT correction: bht/index.html
          - TR Cycles: tr-cycles/index.html
      - Decision support:
          - MCDA (AHP & PROMETHEE): mcda/index.html
  - Chess: chess/index.html
  - Tags: tags.md
  - Contact: contact.md
