site_name: Romain Giboreau
site_description: Notes on petroleum systems and basin modeling
site_url: https://RomainGiboreau.github.io/My_Website/

theme:
  name: material
  features:
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.suggest
  palette:
    - scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Light mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - tables
  - footnotes
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css
  
plugins:
  - search
  - tags:
      tags_file: tags.md

nav:
  - Home: index.md
  - CV: cv.md
  - Resources: resources/index.md
  - Python: Pandas_Polars.md
  - Tags: tags.md

