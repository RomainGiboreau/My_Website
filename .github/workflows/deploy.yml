name: Deploy site

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Pinned to the versions tested locally; bump deliberately (MkDocs 2.0 is not compatible yet)
      - run: pip install mkdocs==1.6.1 mkdocs-material==9.7.6
      - run: mkdocs build
      - name: Render CV as PDF
        run: >
          google-chrome --headless=new --disable-gpu --no-pdf-header-footer
          --virtual-time-budget=5000 --print-to-pdf=site/cv.pdf
          "file://$PWD/site/cv/index.html"
      - run: test -s site/cv.pdf
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
