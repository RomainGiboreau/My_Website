<style>

body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 Inter,system-ui,sans-serif}

.banner.err{background:var(--acc2)}
.panel h2{cursor:pointer;user-select:none;margin-bottom:0}

.top .tt{background:transparent;border-color:rgba(245,243,237,.55);color:#f5f3ed}
.top .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top .bar button{padding:.2rem .5rem;font-size:.8rem}
.top .bar button.pri{background:#f5f3ed;color:var(--acc);border-color:#f5f3ed}
.top .bar label{display:flex;gap:4px;align-items:center;font-size:.8rem}
.top .bar .msg{color:#f5f3ed;opacity:.9;min-height:0;font-size:.78rem}
.top{align-items:center}
.side{position:sticky;top:8px;align-self:start;max-height:calc(100vh - 16px);overflow-y:auto;padding-right:2px}
textarea{width:100%;font:12px/1.35 ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:4px;padding:6px;resize:vertical;white-space:pre}

.g3{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:4px 8px;align-items:center;font-size:.82rem}.g3 input{width:100%}
canvas.v{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:4px;margin-top:6px}
table.cvt{width:100%;font-size:.76rem;margin-top:6px}table.cvt th,table.cvt td{padding:2px 5px;text-align:right}table.cvt th:first-child,table.cvt td:first-child{text-align:left}

@media (max-width:900px){.layout{grid-template-columns:1fr}.side{position:static;max-height:none}}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 8px 8px;position:relative;min-width:0}
.card h3{font:600 .86rem "Space Grotesk",Inter,sans-serif;margin:2px 4px 2px;display:flex;align-items:center;gap:6px}

.card.wide{grid-column:1/-1}.card.wide canvas{height:460px}
.legend{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:.8rem;margin:0 0 10px;color:var(--mut)}

.legend i.x{border:none;background:none;width:auto;height:auto;font-style:normal;color:#9a968a;font-weight:700;margin-right:3px}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--fg);color:#f5f3ed;border-radius:6px;padding:5px 9px;font-size:.76rem;line-height:1.35;display:none;max-width:300px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.chip{display:inline-block;padding:0 7px;border-radius:9px;font-size:.72rem;font-weight:600}
.chip.ok{background:rgba(74,90,78,.2);color:#3a4a3e}.chip.warn{background:rgba(168,98,58,.2);color:#8a4e2c}.chip.masked{background:#e3dfd2;color:#5c5a52}.chip.excluded{background:#d8c9c2;color:#7a3a2a}
.rules{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:start;font-size:.8rem}
.rules .r{display:contents}.rules input[type=number]{width:62px;padding:.1rem .3rem}.rules select{padding:.1rem .2rem;font-size:.76rem}
.rules .act{display:block;margin-top:2px}
.sum{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 10px}.sum div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:.8rem}.sum b{font:700 1.2rem "Space Grotesk",Inter,sans-serif;display:block}
.tw.tall{max-height:62vh}
td.l,th.l{text-align:left}
.pane{display:none}.pane.on{display:block}
.empty{padding:40px 16px;text-align:center;color:var(--mut)}
[hidden]{display:none!important}
/* three-column layout: second sidebar on the right so that the panels fit without scrolling */
.layout.l3{grid-template-columns:300px minmax(0,1fr) 300px}
.layout.l3 #method{min-width:0;max-width:100%}
.layout.l3 .side{position:sticky;top:8px;align-self:start;max-height:calc(100vh - 16px);overflow-y:auto;padding-right:2px}

</head><body>
<div class="top"><h1>Compaction curve fit</h1>
 <div class="bar"><span style="opacity:.85;font-size:.8rem">Export</span>
  <button class="pri" id="bPar" title="Fitted parameters, standard errors and statistics, one row per group and model">Parameters CSV</button>
  <button id="bCurve" title="Fitted porosity at regular depths for every group and model shown">Curves CSV</button>
  <button id="bPng">PNG</button><span class="msg" id="exportMsg"></span>
  <span class="tt" tabindex="0" data-tip="Everything runs locally in your browser: your data never leave it. Paste or open depth–porosity measurements (core, logs), choose models, get the fitted parameters with their standard errors, goodness of fit, AICc ranking, and the decompaction of a layer with the fitted curve.">?</span></div>
 <a href="https://romaingiboreau.github.io/My_Website/">← Back to site</a></div>
<div class="layout l3">
<aside class="side">
 <section class="panel"><h2><span class="n">1</span>Data<i class="chev"></i></h2>
  <div class="body"><textarea id="paste" rows="6" placeholder="Depth&#9;Porosity&#9;Lithology&#10;120&#9;0.52&#9;Shale&#10;…" spellcheck="false"></textarea>
  <input type="file" id="file" accept=".csv,.txt,.tsv,.dat,text/*" hidden>
  <div class="row"><button class="pri" id="bOpen">Open file…</button><button id="bExample">Example</button></div>
  <div class="pg"><span>Depth</span><select id="cz"></select><span>Porosity</span><select id="cp"></select><span>Group</span><select id="cg"></select></div>
  <div class="pg"><span>Depth unit</span><select id="zu"><option value="1">m</option><option value="1000">km</option><option value="0.3048">ft</option></select><span>Porosity unit</span><select id="pu"><option value="auto">auto (fraction or %)</option><option value="1">fraction</option><option value="100">percent</option></select></div>
  <div class="msg" id="dataMsg">No data yet.</div></div></section>
 <section class="panel"><h2><span class="n">2</span>Models<span class="tt" tabindex="0" data-tip="Athy (1930): φ = φ0·exp(−c·z). Same with a residual porosity: φ = φr + (φ0 − φr)·exp(−c·z). Hyperbolic: φ = φ0 / (1 + c·z). Linear: φ = φ0 − k·z. Mechanical: void ratio e = e1 − λ·ln(σ'/1 MPa), where the effective stress σ' is integrated from the weight of the solid skeleton under hydrostatic pore pressure (no overpressure): dσ'/dz = (ρs − ρw)·g·(1 − φ). The mechanical model is a soil-mechanics compression line, not the exact law of any particular basin simulator. The Sclater &amp; Christie (1980) curves are the Athy model with parameters per lithology.">?</span><i class="chev"></i></h2>
  <div class="body"><div id="mods"></div>
  <div class="pg"><span>Fit</span><select id="grpmode"><option value="each">one fit per group</option><option value="all">all data together</option></select>
  <span>Residuals in</span><select id="restype"><option value="phi">porosity</option><option value="ln">ln porosity (relative errors)</option></select>
  <span>Grain density ρs</span><input type="number" id="rhos" value="2650" step="10"><span>Water density ρw</span><input type="number" id="rhow" value="1000" step="10"></div></div></section>
</aside>
<main>
 <div class="legend" id="legend"></div>
 <div class="cards"><div class="card wide"><h3>Porosity vs depth<span class="sp"></span><button data-png="cv">PNG</button></h3><canvas id="cv" style="position:static;height:460px"></canvas></div></div>
 <div class="card" style="margin-top:12px"><h3>Fit results<span class="tt" tabindex="0" data-tip="Standard errors come from the Jacobian at the optimum (s²·(JᵀJ)⁻¹, s² = RSS/(n − k)); they assume independent, homoscedastic residuals, which depth series rarely satisfy, so read them as lower bounds. AICc = n·ln(RSS/n) + 2k + 2k(k+1)/(n − k − 1), ranked within each group (Δ = 0 is the best); it is not defined when n ≤ k + 1. AICc is computed on the residuals in the chosen space (porosity or ln porosity).">?</span></h3><div class="tw tall" style="max-height:340px"><table id="resT"></table></div></div>
 </main>
<aside class="side side2">
 <section class="panel"><h2><span class="n">3</span>Display<i class="chev"></i></h2>
  <div class="body"><div class="pg"><span>Curves down to</span><input type="text" id="zmax" placeholder="auto"></div>
  <label class="inl"><input type="checkbox" id="showRes" checked>Residuals panel</label>
  <label class="inl"><input type="checkbox" id="logP">Log porosity axis</label></div></section><div class="card" style="margin-top:0"><h3>Decompaction of a layer<span class="tt" tabindex="0" data-tip="The solid (grain) thickness ∫(1 − φ)dz of the layer is conserved. It is computed between the present top and base with the fitted curve, then the layer is moved so that its top is at the new depth, and the new base is found by root finding. Depths are in the data unit. Valid only if one curve describes the whole layer (same lithology, no overpressure, no cementation).">?</span></h3>
  <div class="pg" style="max-width:520px"><span>Curve</span><select id="dcm"></select><span>Present top</span><input type="text" id="dz1" value="1000"><span>Present base</span><input type="text" id="dz2" value="1500"><span>New top depth</span><input type="text" id="dz0" value="0"></div>
  <div class="row"><button class="pri" id="bDec">Decompact</button></div><div class="msg" id="decOut" style="font-size:.86rem;color:var(--fg)"></div></div>

</aside></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toN=s=>{if(typeof s==='number')return s;s=String(s==null?'':s).trim().replace(/\s/g,'');if(s===''||/^(nan|na|n\/a|nd|null|-+)$/i.test(s))return NaN;
  if(/^[-+]?\d{1,3}(\.\d{3})+,\d+$/.test(s))s=s.replace(/\./g,'').replace(',','.');else if(s.includes(',')&&!s.includes('.'))s=s.replace(',','.');
  return /^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(s)?+s:NaN};
const fmt=v=>!isFinite(v)?'–':(Math.abs(v)>=1e5||(Math.abs(v)<1e-3&&v!==0))?v.toExponential(2):String(+v.toPrecision(5));
const f3=v=>isFinite(v)?String(+v.toFixed(3)):'';
function rng(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
let banT=null;function banner(m,err){let b=$('banner');if(!b){b=document.createElement('div');b.id='banner';document.body.appendChild(b);b.style.cssText='position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:60;pointer-events:none;border-radius:6px;padding:7px 14px;font-size:.84rem;box-shadow:0 4px 14px rgba(0,0,0,.25);color:#f5f3ed;max-width:80%'}
  b.textContent=m;b.style.background=err?'#a8623a':'#232220';b.style.display='block';clearTimeout(banT);banT=setTimeout(()=>{b.style.display='none'},err?9000:3500)}
function download(name,text,mime){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime||'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function copyText(t,ok){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>banner(ok||'Copied.'),()=>fallbackCopy(t,ok));else fallbackCopy(t,ok)}
function fallbackCopy(t,ok){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');banner(ok||'Copied.')}catch(e){banner('Copy failed.',true)}a.remove()}
const csvCell=(v,sep)=>{v=v==null?'':String(v);return(v.includes(sep)||v.includes('"')||v.includes('\n'))?'"'+v.replace(/"/g,'""')+'"':v};
document.querySelectorAll('.panel>h2').forEach(h=>h.addEventListener('click',e=>{if(e.target.closest('.tt'))return;h.parentElement.classList.toggle('collapsed')}));
// ---- table parsing (tab, ;, , or whitespace separated; optional header and units row)
function parseTable(text,minCols){
  const lines=text.replace(/\r/g,'').split('\n').map(l=>l.replace(/\s+$/,'')).filter(l=>l.trim()&&!/^(#|\/\/)/.test(l.trim()));if(!lines.length)return{err:'Empty input.'};
  const has=c=>lines.some(l=>l.includes(c));let sep;
  if(has('\t'))sep='\t';else if(has(';'))sep=';';else if(lines.every(l=>l.split(',').length>=(minCols||2)))sep=',';else sep=/\s+/;
  const split=l=>{if(sep===','||sep===';'){const o=[];let c='',q=false;for(const ch of l){if(ch==='"')q=!q;else if(ch===sep&&!q){o.push(c);c=''}else c+=ch}o.push(c);return o.map(s=>s.trim())}return l.split(sep).map(s=>s.trim().replace(/^"|"$/g,''))};

function results(){const rows=D.fits.map(f=>{if(!f.r)return`<tr><td class="l">${esc(f.g)}</td><td class="l">${esc(f.M.name)}</td><td colspan="5" class="l err">${esc(f.err||'failed')}</td></tr>`;
  const r=f.r,ps=f.M.par.map((nm,i)=>`${esc(nm)} = ${fmt(r.p[i])}${r.se?` ± ${fmt(r.se[i])}`:''}`).join('<br>');
  return`<tr${r.d===0?' class="best"':''}><td class="l">${esc(f.g)}</td><td class="l">${esc(f.M.name)}</td><td class="l">${ps}${r.atBound?'<br><span class="err">parameter at a bound</span>':''}</td><td>${f.n}</td><td>${fmt(r.rmse)}</td><td>${fmt(r.r2)}</td><td>${isFinite(r.d)?fmt(r.d):'–'}</td></tr>`}).join('');
  $('resT').innerHTML=`<thead><tr><th class="l">Group</th><th class="l">Model</th><th class="l">Parameters ± SE</th><th>n</th><th>RMSE (φ)</th><th>R²</th><th>ΔAICc</th></tr></thead><tbody>${rows}</tbody>`;
  const style=document.createElement('style');if(!$('stbest')){style.id='stbest';style.textContent='#resT tr.best td{background:rgba(74,90,78,.16)}#resT .err{color:#a8623a}';document.head.appendChild(style)}}
// ---- plot
function curveZ(){const zm=toN($('zmax').value),zk=ZU(),mx=Math.max(...D.pts.map(q=>q.zk)),top=isFinite(zm)&&zm>0?zm*zk:mx*1.1,n=120,z=[];for(let i=0;i<=n;i++)z.push(top*i/n);return z}
function gColor(g){return PAL[Math.max(0,D.groups.indexOf(g))%PAL.length]}
function draw(){const cv=$('cv');
  if(D.pts.length<3){const x=cv.getContext('2d');cv.width=cv.clientWidth;cv.height=cv.clientHeight;x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.fillStyle='#5c5a52';x.font='13px Inter,sans-serif';x.fillText('Load depth–porosity data (section 1) or click Example.',20,30);$('legend').innerHTML='';return}
  const zk=ZU(),u=$('zu').selectedOptions[0].textContent,zs=curveZ(),pan=[{xlab:'Porosity (fraction)',xlog:$('logP').checked,pts:[],lines:[]}],res=[{xlab:'Residual (fit − data)',pts:[],lines:[{x:[0,0],y:[0,1e9],c:'#8a8678',w:1}]}];
  for(const q of D.pts)pan[0].pts.push({x:q.phi,y:q.z,c:gColor(q.g),info:`<b>${esc(q.g)}</b><br>depth ${fmt(q.z)} ${u}<br>porosity ${fmt(q.phi)}`});
  for(const f of D.fits){if(!f.r)continue;const g=f.g==='all data'?null:f.g,col=g?gColor(g):'#232220',ph=modelPhi(f.M,f.r.p,zs);
    pan[0].lines.push({x:ph,y:zs.map(z=>z/zk),c:col,w:2,dash:f.M.dash});
    const pts=D.pts.filter(q=>!g||q.g===g),m=modelPhi(f.M,f.r.p,pts.map(q=>q.zk));pts.forEach((q,i)=>res[0].pts.push({x:m[i]-q.phi,y:q.z,c:col,r:3,info:`<b>${esc(q.g)}</b> · ${esc(f.M.name)}<br>depth ${fmt(q.z)} ${u}<br>residual ${fmt(m[i]-q.phi)}`}))}
  const panels=[pan[0]];if($('showRes').checked){res[0].lines=[{x:[0,0],y:[-1e9,1e9],c:'#8a8678',w:1}];panels.push(res[0])}
  drawChart(cv,{ylab:`Depth (${u})`,yrev:true,ylim:[0,Math.max(...zs)/zk],panels});
  $('legend').innerHTML=(D.groups.length>1?D.groups.map(g=>`<span><i style="background:${gColor(g)}"></i>${esc(g)}</span>`).join(''):'')+selMods().map(m=>`<span><svg width="30" height="8"><line x1="0" y1="4" x2="30" y2="4" stroke="#232220" stroke-width="2" stroke-dasharray="${m.dash.join(' ')}"/></svg> ${esc(m.name)}</span>`).join('')}
window.addEventListener('resize',()=>{clearTimeout(D.rt);D.rt=setTimeout(draw,150)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-png]');if(b)pngOf($(b.dataset.png),'compaction.png')});$('bPng').onclick=()=>pngOf($('cv'),'compaction.png');
// ---- decompaction
function decSelect(){const cur=$('dcm').value;$('dcm').innerHTML=D.fits.map((f,i)=>f.r?`<option value="${i}">${esc(f.g)} — ${esc(f.M.name)}</option>`:'').join('');if(cur&&$('dcm').querySelector(`option[value="${cur}"]`))$('dcm').value=cur}
function solidFn(f,zmaxKm){const n=Math.max(400,Math.ceil(zmaxKm*1000/2)),z=Array.from({length:n+1},(_,i)=>zmaxKm*i/n),ph=modelPhi(f.M,f.r.p,z).map(v=>Math.min(0.99,Math.max(0,v))),S=new Float64Array(n+1);
  for(let i=0;i<n;i++)S[i+1]=S[i]+(z[i+1]-z[i])*((1-ph[i])+(1-ph[i+1]))/2;       // S(z) = ∫ (1 − φ) dz, trapezoid
  const at=zz=>{const x=zz/zmaxKm*n,i=Math.max(0,Math.min(n-1,Math.floor(x))),t=x-i;return S[i]*(1-t)+S[i+1]*t},phiAt=zz=>{const x=zz/zmaxKm*n,i=Math.max(0,Math.min(n-1,Math.floor(x))),t=x-i;return ph[i]*(1-t)+ph[i+1]*t};return{S:at,phi:phiAt,tot:S[n]}}
$('bDec').onclick=()=>{const f=D.fits[+$('dcm').value],o=$('decOut');if(!f||!f.r){o.textContent='Fit a model first.';return}
  const zk=ZU(),u=$('zu').selectedOptions[0].textContent,z1=toN($('dz1').value)*zk,z2=toN($('dz2').value)*zk,z0=toN($('dz0').value)*zk;

  if(F.S(hi)-F.S(z0)<sol){o.textContent='Cannot find a base for this layer: increase the range.';return}
  for(let i=0;i<80;i++){const mid=(lo+hi)/2;if(F.S(mid)-F.S(z0)<sol)lo=mid;else hi=mid}const z2n=(lo+hi)/2,th=(z2-z1)/zk,thn=(z2n-z0)/zk;
  o.innerHTML=`Solid thickness ${fmt(sol/zk)} ${u}<br>Present: ${fmt(th)} ${u} (porosity ${fmt(F.phi(z1))} at top, ${fmt(F.phi(z2))} at base)<br>Decompacted with top at ${fmt(z0/zk)} ${u}: base at ${fmt(z2n/zk)} ${u}, thickness <b>${fmt(thn)} ${u}</b> (×${fmt(thn/th)}), porosity ${fmt(F.phi(z0))} at top, ${fmt(F.phi(z2n))} at base`+(z2n>Math.max(...D.pts.map(q=>q.zk))*1.2?'<br><span style="color:var(--acc2)">The layer is moved outside the depth range of the data: extrapolated curve.</span>':'')};
// ---- export
$('bPar').onclick=()=>{if(!D.fits.length)return banner('Nothing to export.',true);const L=['group,model,n,rmse_phi,r2,delta_AICc,parameters'];for(const f of D.fits){if(!f.r)continue;L.push([csvCell(f.g,','),csvCell(f.M.name,','),f.n,f.r.rmse,f.r.r2,f.r.d,csvCell(f.M.par.map((nm,i)=>`${nm}=${f.r.p[i]}${f.r.se?`±${f.r.se[i]}`:''}`).join('; '),',')].join(','))}download('compaction_fits.csv',L.join('\n')+'\n')};
$('bCurve').onclick=()=>{if(!D.fits.length)return banner('Nothing to export.',true);const zk=ZU(),zs=curveZ(),u=$('zu').selectedOptions[0].textContent,L=[`depth_${u},`+D.fits.filter(f=>f.r).map(f=>csvCell(f.g+' | '+f.M.name,',')).join(',')],cols=D.fits.filter(f=>f.r).map(f=>modelPhi(f.M,f.r.p,zs));
  zs.forEach((z,i)=>L.push([+(z/zk).toPrecision(8)].concat(cols.map(c=>+c[i].toPrecision(6))).join(',')));download('compaction_curves.csv',L.join('\n')+'\n')};
// ---- example (synthetic): two lithologies drawn from exponential laws with multiplicative noise
function example(){const r=rng(5),L=['Depth (m)\tPorosity (%)\tLithology'],g=()=>{let s=0;for(let i=0;i<6;i++)s+=r();return(s-3)/Math.sqrt(0.5)};
  for(let i=0;i<40;i++){const z=60+r()*3200;L.push(`${z.toFixed(0)}\t${(100*0.62*Math.exp(-0.50*z/1000)*Math.exp(0.07*g())+1.2).toFixed(1)}\tShale`)}
  for(let i=0;i<30;i++){const z=60+r()*3800;L.push(`${z.toFixed(0)}\t${(100*0.46*Math.exp(-0.27*z/1000)*Math.exp(0.06*g())).toFixed(1)}\tSandstone`)}
  $('paste').value=L.join('\n');loadText($('paste').value)}
$('bExample').onclick=example;
