<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Map digitizer</title>
<meta name="description" content="Extract a regular XY grid of values from a map image with a continuous property (e.g. a depth map) using its colour legend. Runs entirely in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eeece6;--card:#f5f3ed;--alt:#e2ded3;--fg:#232220;--mut:#5c5a52;--line:#c9c4b6;--acc:#4a5a4e;--acc2:#a8623a}
html{color-scheme:light only}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 Inter,system-ui,sans-serif}
h1,h2{font-family:"Space Grotesk",Inter,sans-serif;margin:0}
.top{background:var(--acc);color:#f5f3ed;display:flex;gap:6px 24px;flex-wrap:wrap;align-items:baseline;justify-content:space-between;padding:12px 18px}
.top h1{font-size:1.15rem;font-weight:700}
.top a{color:#f5f3ed;opacity:.88;font-size:.85rem;text-decoration:none;border-bottom:1px solid rgba(245,243,237,.45)}
.layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;padding:14px 16px 32px}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.panel h2{font-size:.95rem;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.panel h2 .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--acc);color:#f5f3ed;font-size:.72rem}
.hint{color:var(--mut);font-size:.78rem;margin:2px 0 8px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
button,select,input[type=text],input[type=number]{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:4px;padding:.3rem .55rem}
button{cursor:pointer;background:var(--card)}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#f5f3ed}
button.on{background:var(--alt);border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
button:disabled{opacity:.5;cursor:default}
.grid2{display:grid;grid-template-columns:auto 1fr 90px;gap:4px 8px;align-items:center;font-size:.82rem}
.grid2 input{width:100%}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line)}
.dot.ok{background:var(--acc)}
.stage{position:relative;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;height:max(430px,64vh);touch-action:none}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.tools{position:absolute;left:8px;top:8px;display:flex;gap:6px;z-index:2}
.tools button{background:rgba(245,243,237,.94)}
#loupe{position:absolute;right:8px;top:8px;width:150px;height:150px;border:2px solid var(--acc);border-radius:6px;background:#fff;z-index:2;display:none;image-rendering:pixelated}
.ro{position:absolute;left:8px;bottom:8px;background:rgba(245,243,237,.94);border:1px solid var(--line);border-radius:4px;padding:2px 8px;font-size:.78rem;color:var(--mut);z-index:2;font-variant-numeric:tabular-nums}
.drop{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--mut);pointer-events:none;padding:24px}
.drop b{font-family:"Space Grotesk",Inter,sans-serif;font-size:1.1rem;color:var(--fg)}
.msg{font-size:.8rem;color:var(--mut);min-height:1.2em}
.msg.err{color:var(--acc2)}
.dpanel{margin-top:12px}
.side{position:sticky;top:8px;align-self:start;max-height:calc(100vh - 16px);overflow-y:auto;padding-right:2px}
.banner{pointer-events:none;position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:80%;z-index:3;background:var(--fg);color:#f5f3ed;border-radius:6px;padding:7px 14px;font-size:.84rem;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.banner.err{background:var(--acc2)}
.tw{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:6px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.8rem;font-variant-numeric:tabular-nums}
th,td{padding:3px 8px;text-align:right;border-bottom:1px solid var(--line)}
th{position:sticky;top:0;background:#d6d1c2;font-family:"Space Grotesk",Inter,sans-serif;font-weight:600}
tbody tr{cursor:pointer}tbody tr.sel{background:rgba(74,90,78,.16)}
input[type=range]{width:100%;accent-color:var(--acc)}
.sw{display:inline-block;width:22px;height:22px;border-radius:4px;border:1px solid var(--line);vertical-align:middle;background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/8px 8px}
label.inl{display:flex;gap:6px;align-items:center;font-size:.82rem}
.note{color:var(--mut);font-size:.74rem;line-height:1.4;margin-top:10px}
.panel h2{cursor:pointer;user-select:none;margin-bottom:0}
.panel h2 .tt{margin-left:auto}
.panel h2 .chev{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--mut);transition:transform .15s}
.panel.collapsed h2 .chev{transform:rotate(-90deg)}
.panel .body{margin-top:6px}
.panel.collapsed .body{display:none}
.tt{position:relative;display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--mut);font:600 .68rem Inter,sans-serif;cursor:help;flex:none}
.tt:hover,.tt:focus{border-color:var(--acc);color:var(--acc);outline:none}
.tt::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);right:-6px;width:260px;padding:8px 10px;background:var(--fg);color:#f5f3ed;border-radius:6px;font:400 .76rem/1.4 Inter,sans-serif;text-align:left;white-space:normal;box-shadow:0 4px 14px rgba(0,0,0,.22);z-index:20;opacity:0;visibility:hidden;transition:opacity .12s;pointer-events:none}
.tt:hover::after,.tt:focus::after{opacity:1;visibility:visible}
.top .tt{background:transparent;border-color:rgba(245,243,237,.55);color:#f5f3ed}
.top .tt:hover,.top .tt:focus{border-color:#fff;color:#fff}
.top .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top .bar select,.top .bar button{padding:.2rem .5rem;font-size:.8rem}
.top .bar button.pri{background:#f5f3ed;color:var(--acc);border-color:#f5f3ed}
.top .bar label{display:flex;gap:4px;align-items:center;font-size:.8rem}
.top .bar .msg{color:#f5f3ed;opacity:.9;min-height:0;font-size:.78rem}
.top{align-items:center}
@media (max-width:900px){.layout{grid-template-columns:1fr}}

.lut{display:block;width:100%;height:14px;border:1px solid var(--line);border-radius:3px;margin:4px 0 2px;background:var(--alt)}
.crow{display:grid;grid-template-columns:30px 1fr 1fr 22px;gap:4px;align-items:center;font-size:.8rem;margin:3px 0}.crow input{width:100%}.crow button{padding:0 4px}
.tick{display:grid;grid-template-columns:34px 1fr 90px 22px;gap:4px;align-items:center;font-size:.8rem;margin:3px 0}
.tick input{width:100%}.tick .sw{width:22px;height:22px}.tick button{padding:0 4px;line-height:1.2}
.grid3{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:4px 8px;align-items:center;font-size:.82rem}
.grid3 input{width:100%}
.tools .sep{width:1px;background:var(--line);margin:0 2px}
.dpanel{margin-top:12px}
.stage{position:sticky;top:8px}
</style></head><body>
<div class="top"><h1>Map digitizer</h1>
 <div class="bar"><span style="opacity:.85;font-size:.8rem">Export</span>
  <label><input type="checkbox" id="skipNaN" checked>Skip empty nodes</label>
  <button class="pri" id="bCopy" title="Copy x, y, value as tab-separated text, ready to paste into Excel">Copy XYZ</button>
  <button id="bCsv">XYZ CSV</button>
  <button id="bMat" title="Matrix CSV: one row per y (top = ymax), one column per x">Matrix CSV</button>
  <button id="bGrd" title="Surfer ASCII grid (DSAA), empty nodes = 1.70141e38">Surfer .grd</button>
  <span class="msg" id="exportMsg"></span>
  <span class="tt" tabindex="0" data-tip="Everything runs locally in your browser: the images are never uploaded. The value of each grid node is read from its colour by matching it to the colour legend (CIE Lab distance), then the median over a small pixel window is kept. Colours that do not match the legend (text, white background, contour lines) give empty nodes.">?</span>
 </div>
 <a href="https://romaingiboreau.github.io/My_Website/">← Back to site</a></div>
<div class="layout">
<aside class="side">
 <section class="panel"><h2><span class="n">1</span>Map image<span class="tt" tabindex="0" data-tip="Open a file, drop it on the canvas, or paste a screenshot with Ctrl+V. The map should be a flat colour-filled map (no perspective). The image never leaves your browser.">?</span><i class="chev"></i></h2>
  <div class="body"><div class="row"><button class="pri" id="bOpen">Open map…</button><button id="bExample">Try an example</button></div>
  <input type="file" id="file" accept="image/*" hidden><input type="file" id="fileLeg" accept="image/*" hidden>
  </div>
 </section>
 <section class="panel"><h2><span class="n">2</span>Legend<span class="tt" tabindex="0" data-tip="Only the two ends of the colour bar are needed: click its minimum end, type its value, then click its maximum end and type its value. The colours in between are read from the bar pixels along the line joining the two ends, and the values in between are interpolated (linear or log). Add an intermediate tick only if the bar is not linear. The legend can be inside the map image or in a separate image.">?</span><i class="chev"></i></h2>
  <div class="body"><div class="row"><label class="inl">Legend in <select id="legSrc"><option value="same">the map image</option><option value="sep">a separate image</option></select></label><button id="bOpenLeg" hidden>Open legend…</button></div>
  <div class="row"><label class="inl">Value scale <select id="vs"><option value="lin">linear</option><option value="log">log</option></select></label></div>
  <div class="tick"><span>Min</span><button id="bMin">Click end</button><input type="text" id="vMin" placeholder="value" aria-label="Minimum value"><span class="sw" id="swMin"></span></div>
  <div class="tick"><span>Max</span><button id="bMax">Click end</button><input type="text" id="vMax" placeholder="value" aria-label="Maximum value"><span class="sw" id="swMax"></span></div>
  <div id="tickList"></div>
  <div class="row"><button id="bMid">+ intermediate tick</button><button id="bTickClear">Reset legend</button></div>
  <canvas class="lut" id="lutC" width="300" height="14"></canvas>
  <div class="msg" id="lutMsg"></div>
  </div>
 </section>
 <section class="panel"><h2><span class="n">3</span>Map coordinates<span class="tt" tabindex="0" data-tip="Add control points: click a spot of the map whose coordinates you know (a corner, a graticule crossing, a labelled tick), then type its X and Y in the two boxes. 2 points are enough if the map is not rotated (they must differ in both X and Y); 3 or more points fit a full affine transform by least squares and handle rotation. Without any control point, the grid is defined in image pixels (y downward).">?</span><i class="chev"></i></h2>
  <div class="body"><div class="row"><button id="bCal">+ Add control point</button><button id="bCalReset">Reset</button></div>
  <div id="calList"></div>
  <div class="msg" id="calMsg"></div></div>
 </section>
 <section class="panel"><h2><span class="n">4</span>Grid<span class="tt" tabindex="0" data-tip="Regular grid in map coordinates. Draw a region on the map to set the bounds, or use the calibration extent. Nodes are xmin, xmin+dx, … up to xmax (same for y).">?</span><i class="chev"></i></h2>
  <div class="body"><div class="row"><button id="tRegion">Draw region</button><button id="bExtent">Calibration extent</button></div>
  <div class="grid3"><span>xmin</span><input type="text" id="gx0"><span>xmax</span><input type="text" id="gx1">
   <span>ymin</span><input type="text" id="gy0"><span>ymax</span><input type="text" id="gy1">
   <span>dx</span><input type="text" id="gdx"><span>dy</span><input type="text" id="gdy"></div>
  <div class="msg" id="gMsg"></div></div>
 </section>
 <section class="panel"><h2><span class="n">5</span>Extract<span class="tt" tabindex="0" data-tip="Colour tolerance: maximum CIE Lab distance between a pixel and its closest legend colour (about 2 is barely visible, 10 is clearly different). Window: half-size in pixels of the square around each node whose matching pixels are median-filtered; it removes isolines and labels. Min. matching: share of window pixels that must match the legend, otherwise the node stays empty. “Unmatched pixels” tints in red every pixel of the map whose colour is not in the legend at the current tolerance.">?</span><i class="chev"></i></h2>
  <div class="body"><label class="inl">Colour tolerance <input type="range" id="tol" min="2" max="40" value="12"><span id="tolV" style="width:28px;text-align:right">12</span></label>
  <div class="row"><label class="inl">Window ± <input type="number" id="win" min="0" max="15" value="2" style="width:52px">px</label>
   <label class="inl">Min. matching <input type="number" id="minf" min="1" max="100" value="30" style="width:56px">%</label></div>
  <div class="row"><button class="pri" id="bExtract">Extract grid</button></div>
  <div class="row"><label class="inl"><input type="checkbox" id="showR" checked>Raster</label><label class="inl"><input type="checkbox" id="showN">Nodes</label><label class="inl"><input type="checkbox" id="showU">Unmatched pixels</label></div>
  <div class="msg" id="exMsg"></div></div>
 </section>
</aside>
<main>
 <div class="stage" id="stage">
  <div class="drop" id="drop"><div><b>Drop a map image here</b><br>or use “Open map…”, paste with Ctrl+V, or try the example</div></div>
  <canvas id="cv"></canvas>
  <div class="tools"><button id="zIn" title="Zoom in">+</button><button id="zOut" title="Zoom out">−</button><button id="zFit" title="Fit to window">Fit</button><button id="z11" title="Actual size">1:1</button>
   <span class="sep" id="vsep" hidden></span><button id="vMap" class="on" hidden>Map</button><button id="vLeg" hidden>Legend</button></div>
  <div class="banner" id="banner" hidden></div>
  <canvas id="loupe" width="150" height="150"></canvas>
  <div class="ro" id="ro">—</div>
 </div>
 <div class="dpanel"><div class="tw"><table><thead><tr><th>#</th><th id="thX">X</th><th id="thY">Y</th><th>Value</th></tr></thead><tbody id="tb"></tbody></table></div></div>
</main>
</div>
<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),loupe=$('loupe'),lg=loupe.getContext('2d');
const newDoc=()=>({img:null,imgC:null,imgData:null,w:0,h:0,s:1,tx:0,ty:0});
const S={map:newDoc(),leg:newDoc(),sep:false,view:'map',tool:null,space:false,
  cal:{pts:[]},T:{min:{p:null,v:''},max:{p:null,v:''},mid:[]},R:null,tickTarget:null};
const LD=()=>S.sep?S.leg:S.map;           // document holding the legend
const CUR=()=>(S.view==='leg'&&S.sep)?S.leg:S.map;
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');
document.querySelectorAll('.panel h2').forEach(h=>h.addEventListener('click',e=>{if(e.target.closest('.tt'))return;h.parentElement.classList.toggle('collapsed')}));
let toastT=null;function toast(m){const e=$('exportMsg');e.textContent=m;clearTimeout(toastT);toastT=setTimeout(()=>{e.textContent=''},2500)}
let banT=null;function banner(m,err){const b=$('banner');b.textContent=m;b.className='banner'+(err?' err':'');b.hidden=false;clearTimeout(banT);banT=setTimeout(()=>{b.hidden=true},err?9000:6000)}
function fmt(v){if(!isFinite(v))return'—';const a=Math.abs(v);return(a!==0&&(a<1e-3||a>=1e7))?v.toExponential(5):String(+v.toPrecision(7))}
const num=t=>parseFloat(String(t).replace(',','.'));

// ---------- colour ----------
function rgb2lab(r,g,b){const f=c=>{c/=255;return c<=.04045?c/12.92:Math.pow((c+.055)/1.055,2.4)};
  const R=f(r),G=f(g),B=f(b);
  let X=(R*.4124564+G*.3575761+B*.1804375)/.95047,Y=(R*.2126729+G*.7151522+B*.072175),Z=(R*.0193339+G*.119192+B*.9503041)/1.08883;
  const h=t=>t>.008856?Math.cbrt(t):7.787*t+16/116;X=h(X);Y=h(Y);Z=h(Z);return[116*Y-16,500*(X-Y),200*(Y-Z)]}

// ---------- map calibration: control points -> affine ----------
function solve3(A,b){ // Gauss elimination on a 3x3 system
  const M=A.map((r,i)=>[...r,b[i]]);
  for(let c=0;c<3;c++){let p=c;for(let r=c+1;r<3;r++)if(Math.abs(M[r][c])>Math.abs(M[p][c]))p=r;
    if(Math.abs(M[p][c])<1e-12)return null;[M[c],M[p]]=[M[p],M[c]];
    for(let r=0;r<3;r++)if(r!==c){const f=M[r][c]/M[c][c];for(let k=c;k<4;k++)M[r][k]-=f*M[c][k]}}
  return M.map((r,i)=>r[3]/r[i])}
function buildCal(){
  const P=S.cal.pts;if(!P.length)return null;
  const Q=P.filter(q=>q.p&&isFinite(num(q.X))&&isFinite(num(q.Y)));
  if(Q.length<P.length||P.length<2)return{err:P.length<2?'Add at least 2 control points.':'Type X and Y for every control point (a point still needs both values).',partial:true};
  const px=Q.map(q=>q.p[0]),py=Q.map(q=>q.p[1]),X=Q.map(q=>num(q.X)),Y=Q.map(q=>num(q.Y)),n=Q.length;
  let f,inv;
  if(n===2){
    if(px[0]===px[1]||X[0]===X[1])return{err:'With 2 points, X and the pixel column must differ between them (or add a 3rd point).'};
    if(py[0]===py[1]||Y[0]===Y[1])return{err:'With 2 points, Y and the pixel row must differ between them (or add a 3rd point).'};
    const a=(X[1]-X[0])/(px[1]-px[0]),b=X[0]-a*px[0],c=(Y[1]-Y[0])/(py[1]-py[0]),d=Y[0]-c*py[0];
    f=p=>[a*p[0]+b,c*p[1]+d];inv=(x,y)=>[(x-b)/a,(y-d)/c]}
  else{
    const A=[[0,0,0],[0,0,0],[0,0,0]],bx=[0,0,0],by=[0,0,0];
    for(let i=0;i<n;i++){const r=[px[i],py[i],1];for(let u=0;u<3;u++){for(let v=0;v<3;v++)A[u][v]+=r[u]*r[v];bx[u]+=r[u]*X[i];by[u]+=r[u]*Y[i]}}
    const sx=solve3(A,bx),sy=solve3(A,by);if(!sx||!sy)return{err:'The control points are aligned: place them so they are not on one line.'};
    const det=sx[0]*sy[1]-sx[1]*sy[0];if(Math.abs(det)<1e-14)return{err:'Degenerate control points.'};
    f=p=>[sx[0]*p[0]+sx[1]*p[1]+sx[2],sy[0]*p[0]+sy[1]*p[1]+sy[2]];
    inv=(x,y)=>{const u=x-sx[2],v=y-sy[2];return[(sy[1]*u-sx[1]*v)/det,(-sy[0]*u+sx[0]*v)/det]}}
  let rms=0;for(let i=0;i<n;i++){const q=inv(X[i],Y[i]);rms+=(q[0]-px[i])**2+(q[1]-py[i])**2}rms=Math.sqrt(rms/n);
  return{f,inv,rms,n,ext:{x0:Math.min(...X),x1:Math.max(...X),y0:Math.min(...Y),y1:Math.max(...Y)}}}
const PXCAL={f:p=>[p[0],p[1]],inv:(X,Y)=>[X,Y],px:true};
let CAL=null;
const GEO=()=>(CAL&&!CAL.err)?CAL:PXCAL;
function renderCal(){$('calList').innerHTML=S.cal.pts.map((q,i)=>`<div class="crow"><span>P${i+1}</span><input type="text" data-c="${i}" data-a="X" value="${esc(q.X)}" placeholder="X" aria-label="P${i+1} X"><input type="text" data-c="${i}" data-a="Y" value="${esc(q.Y)}" placeholder="Y" aria-label="P${i+1} Y"><button data-d="${i}" title="Remove">×</button></div>`).join('')}
function recal(){CAL=buildCal();const ok=CAL&&!CAL.err,m=$('calMsg');
  m.textContent=!S.cal.pts.length?'No control point: the grid will be in image pixels.':CAL&&CAL.err?CAL.err:`Calibrated ✓ (${CAL.n} points, residual ${CAL.rms.toFixed(2)} px)`;
  m.className='msg'+(CAL&&CAL.err&&S.cal.pts.length>=2&&!CAL.partial?' err':'');
  $('thX').textContent=ok?'X':'X (px)';$('thY').textContent=ok?'Y':'Y (px)';draw()}
$('calList').addEventListener('change',e=>{const i=e.target.dataset.c;if(i==null)return;const q=S.cal.pts[+i];let v=e.target.value;
  if(e.target.dataset.a==='X'&&q.Y===''){const m=v.match(/^\s*([-+]?[\d.]+(?:[eE][-+]?\d+)?)\s*(?:;|\s|,(?=.*\.))\s*([-+]?[\d.]+(?:[eE][-+]?\d+)?)\s*$/);if(m){q.X=m[1];q.Y=m[2];renderCal();recal();return}}
  q[e.target.dataset.a]=v;recal()});
$('calList').addEventListener('input',e=>{const i=e.target.dataset.c;if(i==null)return;S.cal.pts[+i][e.target.dataset.a]=e.target.value;CAL=buildCal();recal()});
$('calList').addEventListener('click',e=>{const d=e.target.dataset.d;if(d==null)return;S.cal.pts.splice(+d,1);renderCal();recal()});
$('bCal').onclick=()=>{if(!S.map.img)return;if(S.cal.pts.length>=8)return;setView('map');setTool('cal')};
$('bCalReset').onclick=()=>{S.cal.pts=[];renderCal();if(S.tool==='cal')setTool(null);recal()};

// ---------- images ----------
function setImage(doc,img){
  const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;
  const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(img,0,0);
  doc.img=img;doc.imgC=c;doc.w=c.width;doc.h=c.height;doc.imgData=g.getImageData(0,0,doc.w,doc.h);
}
function afterLoad(doc){
  if(doc===S.map){S.R=null;S.region=null;$('drop').style.display='none'}
  if(doc===LD())resetTicks();
  fit();recal();buildLUT();renderTable();$('exMsg').textContent=''}

  const c=hitCal(sx,sy);if(c>=0){drag={k:'cal',i:c};return}
  const t=hitTick(sx,sy);if(t){drag={k:'tick',t};return}
  drag={k:'pan',sx,sy,tx:D.tx,ty:D.ty};cv.style.cursor='grabbing'});
cv.addEventListener('pointermove',e=>{
  const D=CUR();if(!D.img)return;const [sx,sy]=evPos(e),[ix,iy]=toImg(sx,sy);
  if(drag){
    if(drag.k==='pan'){D.tx=drag.tx+sx-drag.sx;D.ty=drag.ty+sy-drag.sy}
    else if(drag.k==='region')S.region={x0:Math.min(drag.x,ix),y0:Math.min(drag.y,iy),x1:Math.max(drag.x,ix),y1:Math.max(drag.y,iy)};
    else if(drag.k==='cal'){S.cal.pts[drag.i].p=[ix,iy];CAL=buildCal()}
    else if(drag.k==='tick'){drag.t.p=[ix,iy]}
    draw()}
  readout(ix,iy);drawLoupe(ix,iy)});
cv.addEventListener('pointerup',()=>{
  if(drag&&drag.k==='region'){const r=S.region;if(r&&(r.x1-r.x0<3||r.y1-r.y0<3))S.region=null;else regionToBounds();setTool(null)}
  if(drag&&drag.k==='cal')recal();
  if(drag&&drag.k==='tick'){renderTicks();buildLUT()}
  drag=null;cv.style.cursor=S.tool?'crosshair':'grab';draw()});
cv.addEventListener('pointerleave',()=>{if(!drag)loupe.style.display='none'});
cv.addEventListener('wheel',e=>{if(!CUR().img)return;e.preventDefault();const [sx,sy]=evPos(e);zoomAt(e.deltaY<0?1.2:1/1.2,sx,sy)},{passive:false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{const tag=document.activeElement.tagName;if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA')return;
  if(e.code==='Space'){S.space=true;cv.style.cursor='grab';e.preventDefault()}if(e.key==='Escape')setTool(null)});
document.addEventListener('keyup',e=>{if(e.code==='Space')S.space=false});
function readout(ix,iy){const D=CUR();let t=`px ${ix.toFixed(1)}, ${iy.toFixed(1)}`;
  if(D===S.map&&CAL&&!CAL.err){const [x,y]=CAL.f([ix,iy]);t+=`  →  x ${fmt(x)}, y ${fmt(y)}`}
  if(D===S.map&&LUT&&ix>=0&&iy>=0&&ix<D.w&&iy<D.h){const o=(Math.floor(iy)*D.w+Math.floor(ix))*4,id=match(D.imgData.data[o],D.imgData.data[o+1],D.imgData.data[o+2],(+$('tol').value)**2);if(id>=0)t+=`  ·  value ≈ ${fmt(LUT.val[id])}`}
  $('ro').textContent=t}

// ---------- grid bounds ----------
function setBounds(x0,x1,y0,y1){const f=v=>String(+v.toPrecision(8));$('gx0').value=f(x0);$('gx1').value=f(x1);$('gy0').value=f(y0);$('gy1').value=f(y1);
  const nice=r=>{const t=r/50,p=Math.pow(10,Math.floor(Math.log10(t))),m=t/p;return(m<1.5?1:m<3.5?2:m<7.5?5:10)*p};
  $('gdx').value=f(nice(x1-x0));$('gdy').value=f(nice(y1-y0));gUpd()}
function regionToBounds(){const r=S.region;if(!r)return;const G=GEO(),c=[[r.x0,r.y0],[r.x1,r.y0],[r.x0,r.y1],[r.x1,r.y1]].map(p=>G.f(p));
  const xs=c.map(p=>p[0]),ys=c.map(p=>p[1]);setBounds(Math.min(...xs),Math.max(...xs),Math.min(...ys),Math.max(...ys))}
$('bExtent').onclick=()=>{if(!CAL||CAL.err){$('gMsg').textContent='Calibrate the map first.';$('gMsg').className='msg err';return}setBounds(CAL.ext.x0,CAL.ext.x1,CAL.ext.y0,CAL.ext.y1)};
function autoGrid(){const D=S.map;
  if(S.region){regionToBounds();return}
  if(CAL&&!CAL.err){setBounds(CAL.ext.x0,CAL.ext.x1,CAL.ext.y0,CAL.ext.y1);return}
  setBounds(0,D.w,0,D.h)}
function gUpd(){const g=gridSpec(),m=$('gMsg');m.className='msg'+(g.err?' err':'');m.textContent=g.err||`${g.nx} × ${g.ny} = ${g.nx*g.ny} nodes`;return g}
['gx0','gx1','gy0','gy1','gdx','gdy'].forEach(i=>$(i).addEventListener('input',gUpd));
$('tol').oninput=e=>{$('tolV').textContent=e.target.value;updU()};

// ---------- extraction ----------
$('bExtract').onclick=()=>{
  const m=$('exMsg');m.className='msg';
  if(!S.map.img){m.textContent='Open a map first.';m.className='msg err';banner('Open a map first.',true);return}
  if(!LUT){m.textContent='Read the colour legend first (section 2).';m.className='msg err';banner('Define the colour legend first (section 2): click the min and max ends of the colour bar and type their values.',true);return}
  if(S.cal.pts.length&&(!CAL||CAL.err)){const e='Calibration incomplete: '+(CAL&&CAL.err?CAL.err:'fix the control points')+' Fix it, or press Reset to work in image pixels.';m.textContent=e;m.className='msg err';banner(e,true);return}
  if(['gx0','gx1','gy0','gy1','gdx','gdy'].some(i=>$(i).value.trim()===''))autoGrid();
  const g=gridSpec();if(g.err){m.textContent=g.err;m.className='msg err';$('gMsg').textContent=g.err;banner(g.err,true);return}
  const D=S.map,d=D.imgData.data,G=GEO(),tol2=(+$('tol').value)**2,w=Math.max(0,Math.min(15,Math.round(+$('win').value||0))),minN=Math.max(1,Math.ceil((+$('minf').value||30)/100*(2*w+1)**2));
  const idx=new Int16Array(g.nx*g.ny).fill(-1),buf=new Int16Array((2*w+1)**2);let ok=0,vmin=Infinity,vmax=-Infinity,sum=0;
  for(let j=0;j<g.ny;j++)for(let i=0;i<g.nx;i++){
    const p=G.inv(g.x0+i*g.dx,g.y0+j*g.dy),cx=Math.round(p[0]-.5),cy=Math.round(p[1]-.5);let n=0;
    for(let v=-w;v<=w;v++){const y=cy+v;if(y<0||y>=D.h)continue;for(let u=-w;u<=w;u++){const x=cx+u;if(x<0||x>=D.w)continue;const o=(y*D.w+x)*4;if(d[o+3]<200)continue;
      const id=match(d[o],d[o+1],d[o+2],tol2);if(id>=0)buf[n++]=id}}
    if(n>=minN){const id=median(buf,n);idx[j*g.nx+i]=id;const z=LUT.val[id];ok++;sum+=z;if(z<vmin)vmin=z;if(z>vmax)vmax=z}}
  const rc=document.createElement('canvas');rc.width=g.nx;rc.height=g.ny;const rx=rc.getContext('2d'),im=rx.createImageData(g.nx,g.ny);
  for(let k=0;k<idx.length;k++){const id=idx[k];if(id>=0){im.data[4*k]=LUT.rgb[3*id];im.data[4*k+1]=LUT.rgb[3*id+1];im.data[4*k+2]=LUT.rgb[3*id+2];im.data[4*k+3]=255}}
  rx.putImageData(im,0,0);
  S.R={...g,idx,lut:LUT,canvas:rc,ok,vmin,vmax,px:!!G.px};
  m.textContent=ok?`${ok} / ${idx.length} nodes valid · min ${fmt(vmin)} · max ${fmt(vmax)} · mean ${fmt(sum/ok)}`:'No node matched the legend: increase the tolerance or check the ticks.';
  const share=ok/idx.length;
  if(!ok){m.className='msg err';banner('No node matched the colour legend. Raise the colour tolerance, or check that the min/max ends were clicked on the colour bar.',true)}
  else if(share<.5){m.className='msg err';banner(`Only ${Math.round(share*100)} % of the nodes matched the legend. Raise the colour tolerance, tick “Unmatched pixels” to see what is rejected, or keep the grid inside the coloured area.`,true)}
  else banner(`${ok} of ${idx.length} nodes extracted (${fmt(vmin)} → ${fmt(vmax)}). Check the Raster / Nodes overlays, then export from the top bar.`);
  renderTable();draw()};
function zOf(k){const R=S.R,id=R.idx[k];return id<0?NaN:R.lut.val[id]}
function renderTable(){const R=S.R;$('thX').textContent=R&&R.px?'X (px)':'X';$('thY').textContent=R&&R.px?'Y (px)':'Y';
  if(!R){$('tb').innerHTML='';return}
  let h='',n=0;for(let j=0;j<R.ny&&n<400;j++)for(let i=0;i<R.nx&&n<400;i++,n++){const k=j*R.nx+i;h+=`<tr><td>${k+1}</td><td>${fmt(R.x0+i*R.dx)}</td><td>${fmt(R.y0+j*R.dy)}</td><td>${fmt(zOf(k))}</td></tr>`}
  if(R.nx*R.ny>n)h+=`<tr><td colspan="4">… ${R.nx*R.ny-n} more nodes (all are exported)</td></tr>`;$('tb').innerHTML=h}

// ---------- export ----------
function xyz(sep){const R=S.R,skip=$('skipNaN').checked,L=[['x','y','value'].join(sep)];
  for(let j=0;j<R.ny;j++)for(let i=0;i<R.nx;i++){const z=zOf(j*R.nx+i);if(skip&&!isFinite(z))continue;L.push([+(R.x0+i*R.dx).toPrecision(10),+(R.y0+j*R.dy).toPrecision(10),isFinite(z)?+z.toPrecision(8):''].join(sep))}
  return L.join('\n')}
function matrix(){const R=S.R,L=['y\\x,'+Array.from({length:R.nx},(_,i)=>+(R.x0+i*R.dx).toPrecision(10)).join(',')];
  for(let j=R.ny-1;j>=0;j--){const r=[+(R.y0+j*R.dy).toPrecision(10)];for(let i=0;i<R.nx;i++){const z=zOf(j*R.nx+i);r.push(isFinite(z)?+z.toPrecision(8):'')}L.push(r.join(','))}return L.join('\n')}
function grd(){const R=S.R,L=['DSAA',`${R.nx} ${R.ny}`,`${+R.x0.toPrecision(10)} ${+(R.x0+(R.nx-1)*R.dx).toPrecision(10)}`,`${+R.y0.toPrecision(10)} ${+(R.y0+(R.ny-1)*R.dy).toPrecision(10)}`,`${R.vmin} ${R.vmax}`];
  for(let j=0;j<R.ny;j++){const r=[];for(let i=0;i<R.nx;i++){const z=zOf(j*R.nx+i);r.push(isFinite(z)?+z.toPrecision(8):'1.70141e+38')}L.push(r.join(' '))}return L.join('\n')}
function dl(text,name,type){const b=new Blob([text],{type}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast(name+' downloaded.')}
const need=()=>{if(!S.R||!S.R.ok){toast('Nothing to export: extract the grid first.');return false}return true};
$('bCopy').onclick=async()=>{if(!need())return;const t=xyz('\t');try{await navigator.clipboard.writeText(t);}catch(_){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}toast('Copied — paste into Excel.')};
$('bCsv').onclick=()=>{if(need())dl(xyz(','),'map_xyz.csv','text/csv')};
$('bMat').onclick=()=>{if(need())dl(matrix(),'map_matrix.csv','text/csv')};
$('bGrd').onclick=()=>{if(need())dl(grd(),'map_grid.grd','text/plain')};
$('showR').onchange=$('showN').onchange=draw;$('showU').onchange=computeU;
window.DG={S,buildCal,get LUT(){return LUT},get CAL(){return CAL},imgToScreen:(x,y)=>{const D=CUR(),r=cv.getBoundingClientRect();return[r.left+x*D.s+D.tx,r.top+y*D.s+D.ty]}};
recal();size();draw();
</script></body></html>
