<script id="zmap-core">
/* ZMAP checker core: parse / check / write ZMAP+ grids. No DOM access; exposed as window.ZMAP.
   Format notes and sources: specs/2026-11-24-zmap-research.md */
(function(W){
const F=(sev,rule,line,msg,fix)=>({sev,rule,line:line==null?null:line,msg,fix:fix||null});
const NUM=/^[-+]?(\d+\.?\d*|\.\d+)([eEdD][-+]?\d+)?$/;
const toNum=x=>+String(x).replace(/[dD]/,'e');   // Fortran writers use 1.0D+03
// values used as "no data" by various packages, besides the one declared in the header
const NULL_LIKE=[1e30,-1e30,-99999,-9999,-999.25,-999,9999999,-9999999,99999,1e20,-1e20,3.4028235e38,-3.4028235e38];
const up=s=>String(s||'').toUpperCase();
const lineList=a=>a.slice(0,5).join(', ')+(a.length>5?` … (${a.length} in all)`:'');
const fmtN=v=>String(+(+v).toPrecision(10));
// spacing "round" = multiple of 0.01 (node spacings are usually 12.5, 25, 50, 100…)
const isRound=v=>{const k=v*100;return isFinite(v)&&v!==0&&Math.abs(k-Math.round(k))<=1e-6*Math.max(1,Math.abs(k))};

function parse(text,name){
  const z={name:name||'grid.zmap',findings:[],tok:[],tokLine:[],dataLines:[],inner:[],extra:[],at:[]};
  z.bom=text.charCodeAt(0)===0xFEFF;if(z.bom)text=text.slice(1);
  z.crOnly=/\r(?!\n)/.test(text)&&!/\n/.test(text);
  const lines=text.split(/\r\n|\n|\r/);if(lines.length&&lines[lines.length-1]==='')lines.pop();
  z.lines=lines;
  lines.forEach((l,i)=>{if(l.trim()[0]==='@')z.at.push(i)});
  if(!z.at.length)return z;
  const i0=z.at[0];z.i0=i0;
  z.comments=lines.slice(0,i0).filter(l=>l.trim()[0]==='!').map(l=>l.trim().slice(1).trim());
  // line 1: @label, TYPE, nodes_per_line (fallback on whitespace when the commas are missing)
  // a trailing comma leaves an empty last field: GDAL drops it, so do we (reported as a warning)
  z.trail=[];const csv=(str,line)=>{const t=str.split(',').map(s=>s.trim());if(t.length>1&&t[t.length-1]===''){t.pop();z.trail.push(line)}return t};
  const l1=lines[i0].trim().slice(1);let t1=csv(l1,i0+1);
  z.hdr={l1:{line:i0+1,tok:t1}};
  if(t1.length!==3){const w=l1.trim().split(/[\s,]+/);if(w.length>=3){t1=[w.slice(0,-2).join(' '),w[w.length-2],w[w.length-1]]}}
  z.label=t1[0]||'';z.type=t1[1]||'';z.npl=+t1[2];
  // header body: up to the lone "@"; without it, the following comma lines
  let iEnd=-1;for(let i=i0+1;i<lines.length;i++)if(lines[i].trim()==='@'){iEnd=i;break}
  z.iEnd=iEnd;const hb=[];
  if(iEnd>=0){for(let i=i0+1;i<iEnd;i++){const t=lines[i].trim();if(!t||t[0]==='!'){z.inner.push(i+1);continue}hb.push(i)}}
  else{for(let i=i0+1;i<lines.length&&hb.length<4;i++){const t=lines[i].trim();if(!t)continue;if(!t.includes(','))break;hb.push(i)}}
  const sp=i=>({line:i+1,raw:lines[i],tok:csv(lines[i],i+1)});
  if(hb[0]!=null)z.hdr.l2=sp(hb[0]);if(hb[1]!=null)z.hdr.l3=sp(hb[1]);if(hb[2]!=null)z.hdr.l4=sp(hb[2]);
  for(const i of hb.slice(3))z.extra.push(i+1);
  if(z.hdr.l2){const t=z.hdr.l2.tok;z.width=+t[0];z.nullTok=t[1]||'';z.nullStr=t[2]||'';z.dec=t[3];z.startCol=t[4]}
  z.nullText=z.nullTok||z.nullStr||'';z.nullVal=NUM.test(z.nullText)?toNum(z.nullText):NaN;
  if(z.hdr.l3){const t=z.hdr.l3.tok.map(Number);[z.nrows,z.ncols,z.xmin,z.xmax,z.ymin,z.ymax]=t;
    z.l3ok=z.hdr.l3.tok.length===6&&t.every(isFinite);
    if(z.l3ok){z.dx=(z.xmax-z.xmin)/(z.ncols-1);z.dy=(z.ymax-z.ymin)/(z.nrows-1)}}
  // data
  z.dataStart=iEnd>=0?iEnd+1:(hb.length?hb[hb.length-1]+1:i0+1);
  const W0=Number.isInteger(z.width)&&z.width>0?z.width:0,skip=[];z.dataInner=[];z.touching=0;
  for(let i=z.dataStart;i<lines.length;i++){const l=lines[i],t=l.trim();if(!t||t[0]==='!'){skip.push(i+1);continue}
    let tk=t.split(/\s+/);
    // Roxar RMS: one "+…" text line right after the header
    if(!z.dataLines.length&&t[0]==='+'&&!NUM.test(tk[0])){z.rms=i+1;continue}
    if(skip.length){z.dataInner.push(...skip);skip.length=0}
    // values that fill the whole field touch each other ("-13344.0000000-13345.0000000"): cut by width
    if(W0&&l.length%W0===0&&tk.some(x=>!NUM.test(x)||x.length>W0)){const c=[];for(let a=0;a<l.length;a+=W0)c.push(l.slice(a,a+W0).trim());if(c.every(x=>NUM.test(x)||!x)){tk=c.filter(Boolean);z.touching++}}
    z.dataLines.push({i,line:i+1,n:tk.length,len:l.length});
    for(const x of tk){z.tok.push(x);z.tokLine.push(i+1)}}
  const v=new Float64Array(z.tok.length);for(let k=0;k<v.length;k++){const x=z.tok[k];v[k]=NUM.test(x)?toNum(x):NaN}
  z.values=v;
  return z;
}
const isNull=(z,v)=>!isFinite(v)||v===z.nullVal;
const value=(z,r,c)=>z.values[c*z.nrows+r];   // row 0 = top (ymax), column 0 = left (xmin)

function check(z){
  const out=[...z.findings],P=(...a)=>out.push(F(...a));
  if(!z.at.length){const csv=z.lines.slice(0,5).some(l=>(l.match(/,/g)||[]).length>=2);
    P('E','file.notzmap',null,'No “@” header line: this is not a ZMAP+ file'+(csv?' (looks like a CSV or XYZ file)':'')+'.');return out}
  if(z.bom)P('W','file.bom',1,'UTF-8 byte-order mark at the start of the file; some readers fail on it.','bom');
  if(z.crOnly)P('W','file.eol',null,'Old Mac line endings (CR only); most readers see a single line.','eol');
  const tabs=[],nona=[];z.lines.forEach((l,i)=>{if(l.includes('\t'))tabs.push(i+1);if(/[^\x00-\x7F]/.test(l))nona.push(i+1)});
  if(tabs.length)P('W','file.tabs',tabs[0],`Tab characters on lines ${lineList(tabs)}; ZMAP+ fields are fixed-width, padded with spaces.`,'tabs');
  if(nona.length)P('W','file.nonascii',nona[0],`Non-ASCII characters on lines ${lineList(nona)}.`);
  const L1=z.hdr.l1.line;
  if(up(z.type)!=='GRID'){P('E','file.nongrid',L1,`ZMAP+ ${z.type?`“${z.type}”`:'non-grid'} file (points, lines, faults or contours): only grids are checked here.`);return out}
  if(z.type!=='GRID')P('W','hdr.gridcase',L1,`Type “${z.type}” should be upper-case GRID (some readers are case-sensitive).`,'header');
  if(z.at.length!==2)P('E','hdr.at',z.at[Math.min(1,z.at.length-1)]+1,`${z.at.length} line(s) start with “@”; a ZMAP+ grid has exactly two (header start and header end).`,z.at.length===1&&z.iEnd<0?'header':null);
  if(z.trail.length)P('W','hdr.trailcomma',z.trail[0],`Trailing comma on header line(s) ${lineList(z.trail)}: some readers count an extra empty field.`,'header');
  if(z.hdr.l1.tok.length!==3)P('E','hdr.l1',L1,'First header line should be “@name, GRID, nodes per line” (3 fields separated by commas).');
  if(!(Number.isInteger(z.npl)&&z.npl>0))P('E','hdr.l1',L1,`Nodes per line “${z.hdr.l1.tok[2]||''}” is not a positive integer.`);
  const l2=z.hdr.l2;
  if(!l2)P('E','hdr.l2',null,'Second header line (field width, null value, …) missing.');
  else{
    if(l2.tok.length!==5)P('E','hdr.l2',l2.line,`Second header line has ${l2.tok.length} fields; expected 5: field width, null value, null text, decimals, start column.`);
    if(/,,/.test(l2.raw))P('W','hdr.emptyfield',l2.line,'Empty field written “,,”: some readers (GDAL) drop it and misread the line; write “, ,”.','header');
    if(!z.nullTok&&z.nullStr)P('W','hdr.nullblank',l2.line,`Null value given only as text (“${z.nullStr}”); several readers need it in the second field.`,'header');
    if(!z.nullText)P('E','hdr.l2',l2.line,'No null value declared.');
    if(!(Number.isInteger(z.width)&&z.width>0&&z.width<40))P('E','hdr.width',l2.line,`Field width “${l2.tok[0]}” must be an integer between 1 and 39.`);
    else if(+z.dec>=z.width)P('W','hdr.decimals',l2.line,`Decimals (${z.dec}) not smaller than the field width (${z.width}).`);
    if(z.startCol!==undefined&&+z.startCol!==1)P('W','hdr.startcol',l2.line,`Start column is ${z.startCol}; almost every file uses 1.`)}
  const l3=z.hdr.l3;
  if(!l3||!z.l3ok)P('E','hdr.l3',l3?l3.line:null,'Third header line should be 6 numbers: rows, columns, xmin, xmax, ymin, ymax.');
  else{
    if(!(Number.isInteger(z.nrows)&&Number.isInteger(z.ncols)&&z.nrows>=2&&z.ncols>=2))P('E','hdr.size',l3.line,`Grid size ${z.nrows} rows × ${z.ncols} columns: both must be integers ≥ 2.`);
    if(!(z.xmax>z.xmin)||!(z.ymax>z.ymin))P('E','hdr.extent',l3.line,`Extent inverted or empty: x ${fmtN(z.xmin)} → ${fmtN(z.xmax)}, y ${fmtN(z.ymin)} → ${fmtN(z.ymax)}.`)}
  const l4=z.hdr.l4;
  if(!l4&&l3)P('W','hdr.l4',l3.line+1,'Fourth header line (0.0, 0.0, 0.0) missing.','header');
  else if(l4){const t=l4.tok.map(Number);if(l4.tok.length!==3||!t.every(isFinite))P('W','hdr.l4',l4.line,'Fourth header line should be three numbers (usually 0.0, 0.0, 0.0).','header');
    else if(t.some(x=>x!==0))P('I','hdr.l4values',l4.line,`Fourth header line is ${l4.tok.join(', ')}; usually zeros (meaning undocumented, ignored by most readers).`)}

  if(z.rms)P('I','hdr.rms',z.rms,'Roxar RMS “+” line after the header: skipped by most readers.');
  // ---- data

  const com=[],nn=[];for(let k=0;k<n;k++){const x=z.tok[k];if(NUM.test(x))continue;if(/^[-+]?\d+,\d+$/.test(x))com.push(z.tokLine[k]);else nn.push(k)}

  if(nn.length)P('E','data.nonnumeric',z.tokLine[nn[0]],`Non-numeric value(s) “${[...new Set(nn.slice(0,50).map(k=>z.tok[k]))].slice(0,4).join('”, “')}” on lines ${lineList([...new Set(nn.map(k=>z.tokLine[k]))])}.`);

  if(z.dataInner.length)P('W','data.inner',z.dataInner[0],`Blank or comment line(s) between data lines (${lineList(z.dataInner)}): readers that cut fields by width or count lines misread them.`,'layout');
  if(z.touching)P('W','data.touching',null,`${z.touching} data line(s) where values fill the whole field and touch each other: readers that split on spaces misread them.`,'layout');
  if(npl>0&&over.length)P('E','data.perline',over[0].line,`${over.length} line(s) hold more than ${npl} values (nodes per line in the header).`,'layout');
  // does the line pattern follow columns of nr values? returns the first line that breaks it, 0 if it fits
  const breaksAt=(nr,nc)=>{let k=0;for(let c=0;c<nc;c++)for(let r=0;r<nr;r+=npl){const e=Math.min(npl,nr-r),d=z.dataLines[k++];if(!d||d.n!==e)return d?d.line:-1}return k===z.dataLines.length?0:-1};
  if(npl>0&&countOk&&!over.length){const bad=breaksAt(z.nrows,z.ncols);
    // continuous wrapping (every line full) can fit the swapped size by chance: it is not evidence
    const continuous=z.dataLines.every((d,i)=>i===z.dataLines.length-1||d.n===npl);
    if(bad&&z.nrows!==z.ncols&&!continuous&&!breaksAt(z.ncols,z.nrows)){swapByBreaks=true;
      P('W','geo.swapped',l3.line,`The data lines follow columns of ${z.ncols} values, not ${z.nrows}: the header probably gives rows and columns the wrong way round (rows come first). The data are not rewritten until the header is fixed.`)}
    else if(bad)P('W','data.breaks',bad>0?bad:null,`Line breaks do not follow the columns: each column of ${z.nrows} values should start on a new line, ${npl} values per line.`,'layout')}

  let nod=0,nodL=0,ntx=0,ntxL=0;const nl=new Map();
  for(let k=0;k<n;k++){const x=z.tok[k],v=z.values[k];if(!isFinite(v))continue;
    if(v===z.nullVal){if(x!==z.nullText){ntx++;ntxL=ntxL||z.tokLine[k]}continue}
    if(!/[.eEdD]/.test(x)){nod++;nodL=nodL||z.tokLine[k]}
    if(NULL_LIKE.includes(v))nl.set(x,(nl.get(x)||0)+1)}
  if(nod)P('W','data.nodecimal',nodL,`${nod} value(s) written without a decimal point: readers then apply the “implied decimals” of the header (${z.dec}), inconsistently.`);
  if(ntx)P('I','data.nulltext',ntxL,`${ntx} null node(s) written differently from the header text “${z.nullText}” (same number).`);
  if(nl.size)P('W','data.nulls',null,`Values that look like another null marker: ${[...nl].map(([k,c])=>`${k} (${c}×)`).join(', ')}; the header null is ${z.nullText}.`,'nulls');
  // ---- geometry
  if(z.l3ok&&z.nrows>=2&&z.ncols>=2&&z.xmax>z.xmin&&z.ymax>z.ymin){
    const ex=z.xmax-z.xmin,ey=z.ymax-z.ymin;
    if(!(isRound(z.dx)&&isRound(z.dy))){const c=[];
      const ha=[ex/z.ncols,ey/z.nrows],sw=[ex/(z.nrows-1),ey/(z.ncols-1)];
      if(isRound(ha[0])&&isRound(ha[1]))c.push(['geo.halfcell',Math.abs(ha[0]-ha[1]),`Node spacing ${fmtN(z.dx)} × ${fmtN(z.dy)} is not round, but the extent divided by the number of cells gives ${fmtN(ha[0])} × ${fmtN(ha[1])}: the extent is probably given at the cell edges (GDAL default). Node-based readers place the grid half a cell off.`]);
      if(z.nrows!==z.ncols&&isRound(sw[0])&&isRound(sw[1]))c.push(['geo.swapped',Math.abs(sw[0]-sw[1]),`Spacing ${fmtN(z.dx)} × ${fmtN(z.dy)} is not round, but swapping rows and columns gives ${fmtN(sw[0])} × ${fmtN(sw[1])}: rows and columns are probably swapped in the header (rows come first).`]);
      c.sort((a,b)=>a[1]-b[1]);if(c.length&&!(swapByBreaks&&c[0][0]==='geo.swapped'))P('W',c[0][0],l3.line,c[0][2])}
    if(Math.abs(z.dx-z.dy)>1e-6*Math.max(Math.abs(z.dx),Math.abs(z.dy)))P('I','geo.aniso',l3.line,`Cells are not square: dx = ${fmtN(z.dx)}, dy = ${fmtN(z.dy)}.`)}

    if(!nv)P('E','data.allnull',null,'Every node is null: the grid is empty.');
    else{if(nv<n/2)P('I','data.nullshare',null,`${Math.round(100*(1-nv/n))} % of the nodes are null.`);
      if(mn===mx)P('I','data.constant',null,`Constant grid (every value is ${fmtN(mn)}).`);
      if(mn>0&&/DEPTH|TVD|DPTH/i.test(z.label+' '+(z.comments||[]).join(' ')))P('I','plaus.zsign',L1,`The name says depth and all values are positive (${fmtN(mn)} to ${fmtN(mx)}); Petrel counts Z positive upwards, so check the sign convention.`)}}

}
const verdict=f=>f.some(x=>x.sev==='E')?'fail':f.some(x=>x.sev==='W')?'warn':'pass';

function checkBatch(zs){
  const out=[],P=(sev,rule,file,msg)=>out.push({...F(sev,rule,null,msg),file});
  const g=zs.filter(z=>z.at.length&&up(z.type)==='GRID');
  const byName=new Map();for(const z of g){const k=up(z.label.trim());if(!byName.has(k))byName.set(k,[]);byName.get(k).push(z.name)}
  for(const [k,v] of byName)if(v.length>1)P('I','batch.name',v.join(', '),`Grid name “${k}” used by ${v.length} files: ${v.join(', ')}.`);
  const geo=new Map();for(const z of g){if(!z.l3ok)continue;const k=`${z.nrows} × ${z.ncols}, x ${fmtN(z.xmin)}–${fmtN(z.xmax)}, y ${fmtN(z.ymin)}–${fmtN(z.ymax)}`;if(!geo.has(k))geo.set(k,[]);geo.get(k).push(z.name)}
  if(geo.size>1)P('I','batch.geometry',g.map(z=>z.name).join(', '),`The grids do not share the same geometry: ${[...geo].map(([k,v])=>`${v.join(', ')} → ${k}`).join('; ')}.`);
  return out;
}

const FIXES=[
  {id:'bom',label:'Remove the byte-order mark',defaultOn:true},
  {id:'eol',label:'Normalise line endings (CRLF)',defaultOn:true},
  {id:'tabs',label:'Replace tabs by spaces',defaultOn:true},
  {id:'header',label:'Rewrite the header in the standard form',defaultOn:true},
  {id:'layout',label:'Rewrite the data: one column per block, fixed width, nodes per line',defaultOn:true},
  {id:'nulls',label:'Replace other null markers by the header null (changes values)',defaultOn:false}];

function write(z,fixIds,findings){
  const on=new Set(fixIds),log=[],lines=z.lines.slice();
  const fin=out=>{const nl=z.crOnly&&!on.has('eol')?'\r':'\r\n';let text=out.join(nl)+nl;if(z.bom&&!on.has('bom'))text='﻿'+text;return {text,log}};
  if(!z.at.length||up(z.type)!=='GRID')return fin(lines);
  if(z.bom&&on.has('bom'))log.push('Removed the byte-order mark.');
  if(z.crOnly&&on.has('eol'))log.push('Converted CR line endings to CRLF.');
  const f=findings||check(z),has=r=>f.some(x=>x.rule===r);
  // ---- values (text kept as is)
  let tok=z.tok,tokChanged=false;
  if(on.has('nulls')&&z.nullText){let c=0;tok=tok.map(x=>{const v=toNum(x);if(NUM.test(x)&&v!==z.nullVal&&NULL_LIKE.includes(v)){c++;return z.nullText}return x});
    if(c){tokChanged=true;log.push(`Replaced ${c} other null marker(s) by ${z.nullText}.`)}}
  const want=z.l3ok?z.nrows*z.ncols:NaN,countOk=tok.length===want&&z.npl>0;
  const tabsInData=z.dataLines.some(d=>z.lines[d.i].includes('\t'));
  const swapped=has('geo.swapped');
  if(swapped&&on.has('layout')&&(has('data.perline')||has('data.width')))log.push('Data not rewritten: rows and columns look swapped in the header; fix the header first.');
  const relayout=countOk&&!swapped&&((on.has('layout')&&(has('data.perline')||has('data.breaks')||has('data.width')||has('data.inner')||has('data.touching')))||tokChanged||(tabsInData&&on.has('tabs')));
  let width=z.width;
  if(relayout){let mx=0;for(const x of tok)if(x.length>mx)mx=x.length;
    if(!(Number.isInteger(width)&&width>0&&width<40)||mx+1>width){const w2=Math.min(39,Math.max(mx+1,Number.isInteger(width)?width:15));if(w2!==width)log.push(`Field width ${z.width} → ${w2} so that every value fits.`);width=w2}
    if(on.has('layout')&&(has('data.perline')||has('data.breaks')||has('data.width')||has('data.inner')||has('data.touching')))log.push(`Rewrote the data: ${z.ncols} columns of ${z.nrows} values, ${z.npl} per line, ${width} characters per value.`)}

  const hEnd=z.iEnd>=0?z.iEnd:z.dataStart-1;

    if(has('hdr.gridcase'))log.push('Header: type written GRID.');
    if(has('hdr.emptyfield')||has('hdr.nullblank'))log.push(`Header: second line written “${l2line()}”.`);
    if(has('hdr.l4'))log.push('Header: fourth line written 0.0, 0.0, 0.0.');
    if(has('hdr.inner'))log.push('Header: removed blank, comment or extra lines.');

    for(let i=z.i0;i<=hEnd;i++)out.push(lines[i]);

}

.log{font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 10px;max-height:360px;overflow:auto;margin:0}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,li:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (max-width:900px){.layout{grid-template-columns:1fr}.verdict{grid-template-columns:auto 1fr}.verdict .act{grid-row:auto;grid-column:1/-1;align-items:flex-start}.pb{grid-template-columns:1fr}.pb .fixit{grid-column:1;grid-row:auto}}
</style>

<style>
.sev{display:inline-block;width:18px;text-align:center;border-radius:3px;font-weight:700;font-size:.72rem;color:#f5f3ed;background:#8c8a80}.sev.E{background:#a8623a}.sev.W{background:#c2924a}
.mapw{background:#fff;border:1px solid var(--line);border-radius:6px;position:relative}
.mapw canvas{display:block;width:100%;height:520px}
#mapRo{font-size:.78rem;color:var(--mut);min-height:1.3em;margin:4px 2px 0;font-variant-numeric:tabular-nums}
#tH td,#tH th{text-align:left}
</style>
<div class="top"><h1>ZMAP checker</h1>
 <div class="bar"><span style="opacity:.85;font-size:.8rem">Export</span>
  <button id="bAll" disabled title="One corrected file per loaded file, with the corrections ticked">All corrected files</button>
  <button id="bCsv" disabled title="Every problem of every file, one line each">Report (CSV)</button><span class="msg" id="exportMsg"></span>
  <span class="tt" tabindex="0" data-tip="Everything runs in your browser: the files are read in memory and never uploaded. Each ZMAP+ grid is checked against the format as written by the common packages (header, column-major data, fixed-width fields, value count) and for geometry slips (half-cell extent, rows and columns swapped). Mechanical problems can be fixed in a downloaded copy; grid values are never changed unless you tick the null-marker correction.">?</span></div>
 <a href="https://romaingiboreau.github.io/My_Website/">← Back to site</a></div>
<div class="layout">
<aside class="side">
 <section class="panel"><h2>Files<i class="chev"></i></h2>
  <div class="body"><div class="drop">Drop ZMAP+ files here or anywhere on the page</div>
  <input type="file" id="file" accept=".zmap,.zmp,.dat,.grd,.txt,.asc,text/*" multiple hidden>
  <div class="row"><button class="pri" id="bOpen">Add files…</button><button id="bExample">Example</button><button id="bClear" title="Remove every file">Clear</button></div>
  <ul class="flist" id="flist"></ul></div></section>
 <section class="panel collapsed"><h2>Corrections<span class="tt" tabindex="0" data-tip="What the corrected file changes. They apply to the downloaded copy only; the loaded file is untouched. You can also tick or untick a correction directly on a problem. The number is how many problems of the selected file each correction solves.">?</span><i class="chev"></i></h2>
  <div class="body"><div id="fixes"></div>
  <div class="note">Geometry (half-cell extent, swapped rows and columns) and the Z sign are reported, never changed.</div></div></section>
</aside>
<main id="main"></main></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let banT=null;function banner(m,err){let b=$('banner');if(!b){b=document.createElement('div');b.id='banner';b.setAttribute('role','status');document.body.appendChild(b);b.style.cssText='position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:60;pointer-events:none;border-radius:6px;padding:7px 14px;font-size:.84rem;box-shadow:0 4px 14px rgba(0,0,0,.25);color:#f5f3ed;max-width:80%'}
  b.textContent=m;b.style.background=err?'#a8623a':'#232220';b.style.display='block';clearTimeout(banT);banT=setTimeout(()=>{b.style.display='none'},err?9000:3500)}
const CP1252=(()=>{const d=new TextDecoder('windows-1252'),m=new Map();for(let b=0;b<256;b++)m.set(d.decode(new Uint8Array([b])),b);return m})();
function encode(text,enc){if(enc!=='windows-1252')return new TextEncoder().encode(text);const o=new Uint8Array(text.length);for(let i=0;i<text.length;i++){const b=CP1252.get(text[i]);o[i]=b==null?63:b}return o}
function download(name,data,mime){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:mime||'text/plain'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

const T={'file.read':'The file could not be read','file.notzmap':'This is not a ZMAP+ file','file.nongrid':'ZMAP+ file, but not a grid','file.bom':'Invisible byte-order mark at the start','file.eol':'Old Mac line endings','file.tabs':'Tab characters','file.nonascii':'Special characters (°, µ, accents…)','file.utf16':'File encoded in UTF-16',
 'hdr.gridcase':'Grid keyword in lower case','hdr.at':'Header markers “@” missing or extra','hdr.l1':'First header line malformed','hdr.l2':'Second header line malformed','hdr.emptyfield':'Empty header field written “,,”','hdr.nullblank':'Null value given only as text','hdr.width':'Invalid field width','hdr.decimals':'Decimals not smaller than the field width','hdr.startcol':'Unusual start column','hdr.l3':'Grid size and extent line malformed','hdr.size':'Invalid number of rows or columns','hdr.extent':'Extent inverted or empty','hdr.l4':'Fourth header line missing or malformed','hdr.l4values':'Fourth header line not zero','hdr.inner':'Blank or extra lines inside the header','hdr.rms':'Roxar RMS line after the header',
 'data.count':'Number of values does not match the grid size','data.comma':'Comma used as decimal separator','data.nonnumeric':'Text in the data','data.perline':'Too many values on a line','data.breaks':'Line breaks do not follow the columns','data.width':'Fixed-width layout broken','data.nodecimal':'Values without a decimal point','data.nulltext':'Null nodes written differently','data.nulls':'Other null markers than the declared one','data.allnull':'Empty grid','data.inner':'Blank or comment lines inside the data','data.touching':'Values touching each other','hdr.trailcomma':'Trailing comma in the header','data.nullshare':'Mostly null grid','data.constant':'Constant grid',
 'geo.halfcell':'Extent probably given at the cell edges','geo.swapped':'Rows and columns probably swapped','geo.aniso':'Cells are not square','plaus.zsign':'Check the Z sign',
 'batch.name':'Same grid name in several files','batch.geometry':'Grids with different geometry'};
const GRP={E:'Blocking',W:'To review',I:'For information'};

const S={files:[],sel:-1,tab:'map',fixes:new Set(ZMAP.FIXES.filter(f=>f.defaultOn).map(f=>f.id)),batch:[],target:null};
const cur=()=>S.files[S.sel];
function written(x){const k=[...S.fixes].sort().join();if(x._wk!==k){x._w=ZMAP.write(x.z,[...S.fixes],x.f);x._wk=k}return x._w}
function addText(name,text,enc,extra){
  let z,f;try{z=ZMAP.parse(text,name);f=ZMAP.check(z)}catch(e){z={name,at:[],lines:[],tok:[],values:new Float64Array(0)};f=[{sev:'E',rule:'file.read',line:null,msg:e.message,fix:null}]}
  if(extra)f.unshift(extra);
  S.files.push({name,z,f,enc,v:ZMAP.verdict(f)})}
async function readFiles(list){
  const fs=[...list];if(!fs.length)return;const n0=S.files.length;
  for(const file of fs){try{const buf=new Uint8Array(await file.arrayBuffer());let text,enc='utf-8',extra=null;
      if((buf[0]===0xFF&&buf[1]===0xFE)||(buf[0]===0xFE&&buf[1]===0xFF)){text=new TextDecoder(buf[0]===0xFF?'utf-16le':'utf-16be').decode(buf);
        extra={sev:'W',rule:'file.utf16',line:null,msg:'The file is UTF-16 (two bytes per character); readers expect ASCII. The corrected file is written as UTF-8.',fix:null}}
      else try{text=new TextDecoder('utf-8',{fatal:true,ignoreBOM:true}).decode(buf)}catch(e){text=new TextDecoder('windows-1252').decode(buf);enc='windows-1252'}
      addText(file.name,text,enc,extra)}catch(e){banner(`${file.name}: ${e.message}`,true)}}
  S.sel=n0<S.files.length?n0:S.sel;refresh()}
$('bOpen').onclick=()=>$('file').click();$('file').onchange=e=>{readFiles(e.target.files);e.target.value=''};
$('bClear').onclick=()=>{S.files=[];S.sel=-1;refresh()};
addEventListener('dragover',e=>{e.preventDefault();document.body.classList.add('dragging')});
addEventListener('dragleave',e=>{if(!e.relatedTarget)document.body.classList.remove('dragging')});
addEventListener('drop',e=>{e.preventDefault();document.body.classList.remove('dragging');readFiles(e.dataTransfer.files)});

function refresh(){
  S.batch=S.files.length>1?ZMAP.checkBatch(S.files.map(x=>x.z)):[];
  ['bAll','bCsv'].forEach(id=>$(id).disabled=!S.files.length);
  if(S.sel>=S.files.length)S.sel=S.files.length-1;
  drawList();drawFixes();drawMain()}
function drawList(){
  $('flist').innerHTML=S.files.map((x,i)=>{const n=x.f.filter(f=>f.sev!=='I').length;
    return `<li tabindex="0" data-i="${i}" class="${i===S.sel?'sel':''}" title="${esc(x.name)}"><span class="st ${x.v}"></span><span class="nm">${esc(x.name)}</span><small>${x.v==='pass'?'ready':n+' to fix'}</small><button data-rm="${i}" aria-label="Remove ${esc(x.name)}">✕</button></li>`}).join('');
  $('flist').querySelectorAll('li').forEach(li=>{const go=()=>{S.sel=+li.dataset.i;S.target=null;drawList();drawFixes();drawMain()};li.onclick=e=>{if(e.target.dataset.rm!=null){S.files.splice(+e.target.dataset.rm,1);if(S.sel>=+e.target.dataset.rm)S.sel--;if(S.sel<0&&S.files.length)S.sel=0;refresh();return}go()};li.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}})}
function drawFixes(){const fl=cur()?cur().f:[];
  $('fixes').innerHTML=ZMAP.FIXES.map(x=>{const n=fl.filter(f=>f.fix===x.id).length;
    return `<label class="fx"><input type="checkbox" data-id="${x.id}" ${S.fixes.has(x.id)?'checked':''}><span>${esc(x.label)}</span><small>${n||''}</small></label>`}).join('');
  $('fixes').querySelectorAll('input').forEach(i=>i.onchange=()=>setFix(i.dataset.id,i.checked))}
function setFix(id,on){on?S.fixes.add(id):S.fixes.delete(id);drawFixes();drawMain(true)}

const ICON={pass:'<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="3"/><path d="M12 20.5l5.5 5.5L29 14" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
 warn:'<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 4L37 34H3z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M20 15v9" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/><circle cx="20" cy="29" r="2" fill="currentColor"/></svg>',
 fail:'<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="3"/><path d="M13.5 13.5l13 13M26.5 13.5l-13 13" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/></svg>'};
const N=ZMAP.fmtN;
function drawMain(keep){
  const x=cur();
  if(!x){$('main').innerHTML=`<section class="intro"><h2>Is this ZMAP grid ready to load?</h2>
    <p>Drop the ZMAP+ grids you received. Each one is checked against the format, gets a clear verdict and the list of problems with their line, and a corrected copy when the problems are mechanical.</p>
    <div class="dz"><b>Drop ZMAP+ files here</b><br><span style="color:var(--mut);font-size:.84rem">several at once is fine — nothing is uploaded</span>
    <div class="row"><button class="pri" id="bOpen2">Choose files…</button><button id="bEx2">Try the example</button></div></div>
    <dl><div><dt>Header</dt><dd>The two “@” markers, grid keyword, nodes per line, field width, null value, rows, columns and extent.</dd></div>
    <div><dt>Data</dt><dd>Value count, column-by-column line breaks, fixed-width fields, text or commas in numbers, other null markers.</dd></div>
    <div><dt>Geometry</dt><dd>Extent given at the cell edges (half-cell shift), rows and columns swapped, non-square cells.</dd></div>
    <div><dt>Across files</dt><dd>Same grid name twice, grids that do not share the same geometry.</dd></div></dl></section>`;
    $('bOpen2').onclick=()=>$('file').click();$('bEx2').onclick=example;return}
  const f=x.f,z=x.z,cnt=s=>f.filter(y=>y.sev===s).length,E=cnt('E'),Wn=cnt('W');
  const fixable=f.filter(y=>y.fix&&S.fixes.has(y.fix)).length,log=z.at.length?written(x).log:[];
  const title={pass:'Ready to load',warn:`Loads, with ${Wn} point${Wn>1?'s':''} to review`,fail:`Will not load cleanly: ${E} blocking problem${E>1?'s':''}`}[x.v];
  const sub=x.v==='pass'?'No problem found by the checks.':(fixable?`${fixable} problem${fixable>1?'s are':' is'} fixed automatically in the corrected file.`:'Nothing here can be fixed automatically: see the details below.');
  let nn=0;for(let k=0;k<z.tok.length;k++)if(ZMAP.isNull(z,z.values[k]))nn++;
  const facts=[['Grid',z.label||'—'],['Rows × columns',z.l3ok?`${z.nrows} × ${z.ncols}`:'—'],['Spacing',z.l3ok?`${N(z.dx)} × ${N(z.dy)}`:'—'],['X',z.l3ok?`${N(z.xmin)} – ${N(z.xmax)}`:'—'],['Y',z.l3ok?`${N(z.ymin)} – ${N(z.ymax)}`:'—'],['Null',z.nullText||'—'],['Null nodes',z.tok.length?Math.round(100*nn/z.tok.length)+' %':'—']];
  let h=`<section class="verdict ${x.v}" aria-live="polite">${ICON[x.v]}<h2>${esc(title)}</h2><div class="sub">${esc(x.name)} — ${esc(sub)}</div>
    <div class="act"><button class="pri" id="bOne" ${z.at.length?'':'disabled'}>Download corrected file</button><a id="aChanges" tabindex="0">${log.length?log.length+' change'+(log.length>1?'s':'')+' — see them':'no change needed'}</a></div>
    <dl class="facts">${facts.map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl></section>`;
  const bt=S.batch.filter(b=>b.file.split(', ').includes(x.name));
  if(bt.length)h+=`<section class="across"><h3>Across the loaded files</h3>${bt.map(b=>`<p><span class="sev ${b.sev}">${b.sev}</span> <b>${esc(T[b.rule]||b.rule)}</b> — ${esc(b.msg)}</p>`).join('')}</section>`;
  for(const s of ['E','W','I']){const it=f.filter(y=>y.sev===s).sort((a,b)=>(a.line||0)-(b.line||0));if(!it.length)continue;
    h+=`<section class="grp"><h3>${GRP[s]}<span class="c">${it.length}</span></h3>`+it.map(y=>`<div class="pb ${s}"><b>${esc(T[y.rule]||y.rule)}</b><p>${esc(y.msg)}</p>
      <div class="meta">${y.line?`<a data-line="${y.line}" tabindex="0">line ${y.line}</a>`:''}<span>${esc(y.rule)}</span></div>
      ${y.fix?`<label class="fixit ${S.fixes.has(y.fix)?'':'off'}"><input type="checkbox" data-fix="${y.fix}" ${S.fixes.has(y.fix)?'checked':''}>Fix in the corrected file</label>`:''}</div>`).join('')+'</section>'}
  if(!f.length)h+='<div class="allgood">Every check passed. You can load this grid as it is.</div>';
  h+=`<section class="det" id="det"><div class="tabs" role="tablist">${[['map','Map'],['header','Header'],['text','File text'],['changes','Changes']].map(([k,n])=>`<button role="tab" data-tab="${k}" class="${S.tab===k?'on':''}">${n}</button>`).join('')}</div>
    <div class="pane" data-p="map"><div class="mapw"><canvas id="cvM"></canvas></div><div id="mapRo">Move over the map to read the values.</div></div>
    <div class="pane" data-p="header"><div class="tw" id="tH" style="max-height:440px"></div></div>
    <div class="pane" data-p="text"><div class="srcbar">Go to line <input type="number" id="goLine" min="1"> <span style="color:var(--mut)">Lines with a problem are shaded.</span></div><pre class="src" id="src"></pre></div>
    <div class="pane" data-p="changes"><pre class="log" id="log"></pre></div></section>`;
  const y0=keep?scrollY:null;$('main').innerHTML=h;if(y0!=null)scrollTo(0,y0);
  $('bOne').onclick=()=>{if(exportOne(x))$('exportMsg').textContent='Saved '+fixedName(x.name)};
  $('aChanges').onclick=()=>openTab('changes');$('aChanges').onkeydown=e=>{if(e.key==='Enter')openTab('changes')};
  $('main').querySelectorAll('[data-fix]').forEach(c=>c.onchange=()=>setFix(c.dataset.fix,c.checked));
  $('main').querySelectorAll('[data-line]').forEach(a=>{const go=()=>{S.target=+a.dataset.line;openTab('text')};a.onclick=go;a.onkeydown=e=>{if(e.key==='Enter')go()}});
  $('det').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>openTab(b.dataset.tab,true));
  $('goLine').onchange=e=>{S.target=+e.target.value;drawSource()};
  openTab(S.tab,false,true)}
function openTab(t,noScroll,silent){S.tab=t;const d=$('det');if(!d)return;
  d.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('on',b.dataset.tab===t);b.setAttribute('aria-selected',b.dataset.tab===t)});
  d.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.dataset.p===t));
  if(t==='map')drawMap();if(t==='header')drawHeader();if(t==='text')drawSource();if(t==='changes')drawLog();
  if(!silent&&!noScroll)d.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})}
function drawHeader(){const x=cur();if(!x||!$('tH'))return;const z=x.z;if(!z.at.length){$('tH').innerHTML='<div class="empty">No ZMAP+ header.</div>';return}
  const t2=z.hdr.l2?z.hdr.l2.tok:[],rows=[['Grid name',z.label,z.hdr.l1.line],['Type',z.type,z.hdr.l1.line],['Nodes per line',z.hdr.l1.tok[2],z.hdr.l1.line],
    ['Field width',t2[0],z.hdr.l2&&z.hdr.l2.line],['Null value',t2[1],z.hdr.l2&&z.hdr.l2.line],['Null text',t2[2],z.hdr.l2&&z.hdr.l2.line],['Decimals',t2[3],z.hdr.l2&&z.hdr.l2.line],['Start column',t2[4],z.hdr.l2&&z.hdr.l2.line],
    ['Rows',z.nrows,z.hdr.l3&&z.hdr.l3.line],['Columns',z.ncols,z.hdr.l3&&z.hdr.l3.line],['X min',z.xmin,z.hdr.l3&&z.hdr.l3.line],['X max',z.xmax,z.hdr.l3&&z.hdr.l3.line],['Y min',z.ymin,z.hdr.l3&&z.hdr.l3.line],['Y max',z.ymax,z.hdr.l3&&z.hdr.l3.line],
    ['Fourth line',z.hdr.l4?z.hdr.l4.tok.join(', '):'missing',z.hdr.l4&&z.hdr.l4.line],['Node spacing (dx, dy)',z.l3ok?`${N(z.dx)}, ${N(z.dy)}`:'—',null],['Comments',(z.comments||[]).filter(Boolean).join(' | ')||'—',null]];
  $('tH').innerHTML='<table><thead><tr><th>Field</th><th>Value</th><th>Line</th></tr></thead><tbody>'+rows.map(r=>`<tr><td>${r[0]}</td><td>${esc(r[1]==null||r[1]===''?'—':r[1])}</td><td>${r[2]||''}</td></tr>`).join('')+'</tbody></table>'}
function drawLog(){const x=cur();if(!x||!$('log'))return;if(!x.z.at.length){$('log').textContent='Not a ZMAP+ file: nothing to write.';return}
  const {log}=written(x);$('log').textContent=log.length?log.join('\n'):'No change: the corrected file is the same as the original (apart from Windows line endings).'}
function drawSource(){const x=cur(),el=$('src');if(!x||!el)return;const L=x.z.lines||[];
  const mark=new Map();for(const f of x.f)if(f.line&&!mark.has(f.line))mark.set(f.line,f.sev);
  const tgt=S.target||1,a=Math.max(0,tgt-60),b=Math.min(L.length,a+400);
  el.innerHTML=(a>0?`<span class="ln"><i>…</i>${a} line(s) above</span>`:'')+L.slice(a,b).map((t,k)=>{const n=a+k+1;return `<span class="ln ${mark.get(n)||''} ${n===S.target?'tgt':''}" id="L${n}"><i>${n}</i>${esc(t)||' '}</span>`}).join('')+(b<L.length?`<span class="ln"><i>…</i>${L.length-b} more line(s)</span>`:'');
  const t=$('L'+tgt);if(t&&S.target)el.scrollTop=t.offsetTop-el.clientHeight/3}

// ---- map: one pixel per node (nearest-neighbour scaled), sequential colour ramp, nulls transparent
const RAMP=[[34,57,82],[46,103,122],[73,146,134],[139,178,120],[214,196,112],[196,121,72],[140,58,46]];
function ramp(t){t=Math.max(0,Math.min(1,t))*(RAMP.length-1);const i=Math.min(RAMP.length-2,Math.floor(t)),f=t-i,a=RAMP[i],b=RAMP[i+1];return [a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f,a[2]+(b[2]-a[2])*f]}
function drawMap(){const x=cur(),cv=$('cvM');if(!x||!cv)return;const z=x.z,r=cv.getBoundingClientRect(),dpr=devicePixelRatio||1;
  cv.width=r.width*dpr;cv.height=r.height*dpr;const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.fillStyle='#fff';g.fillRect(0,0,r.width,r.height);
  g.font='12px Inter,system-ui,sans-serif';g.fillStyle='#5c5a52';
  const nr=z.nrows,nc=z.ncols;
  if(!z.l3ok||!(nr>=2&&nc>=2)||!(z.xmax>z.xmin&&z.ymax>z.ymin)||z.tok.length<nr*nc){g.fillText(z.at.length?'The grid cannot be drawn: size or value count is wrong (see the problems).':'Not a ZMAP+ grid.',16,26);cv.onmousemove=null;return}
  let mn=Infinity,mx=-Infinity;for(let k=0;k<nr*nc;k++){const v=z.values[k];if(ZMAP.isNull(z,v))continue;if(v<mn)mn=v;if(v>mx)mx=v}
  if(!isFinite(mn)){g.fillText('Every node is null.',16,26);return}if(mn===mx){mn-=1;mx+=1}
  const img=new ImageData(nc,nr);for(let c=0;c<nc;c++)for(let rr=0;rr<nr;rr++){const v=z.values[c*nr+rr],o=(rr*nc+c)*4;if(ZMAP.isNull(z,v))continue;const col=ramp((v-mn)/(mx-mn));img.data[o]=col[0];img.data[o+1]=col[1];img.data[o+2]=col[2];img.data[o+3]=255}
  const off=document.createElement('canvas');off.width=nc;off.height=nr;off.getContext('2d').putImageData(img,0,0);
  // keep the map aspect: x and y in the same units
  const L=70,R=90,T=16,B=40,aw=r.width-L-R,ah=r.height-T-B,ex=z.xmax-z.xmin,ey=z.ymax-z.ymin,s=Math.min(aw/ex,ah/ey),w=ex*s,hh=ey*s,x0=L+(aw-w)/2,y0=T+(ah-hh)/2;
  g.imageSmoothingEnabled=false;
  // nodes sit on the cell centres: the image spans half a cell beyond the extent
  const hx=w/(nc-1)/2,hy=hh/(nr-1)/2;g.save();g.beginPath();g.rect(x0-hx,y0-hy,w+2*hx,hh+2*hy);g.clip();g.drawImage(off,x0-hx,y0-hy,w+2*hx,hh+2*hy);g.restore();
  g.strokeStyle='#5c5a52';g.strokeRect(x0-hx+.5,y0-hy+.5,w+2*hx,hh+2*hy);
  g.fillStyle='#5c5a52';g.textAlign='center';for(let k=0;k<=4;k++){const xv=z.xmin+ex*k/4;g.fillText(N(+xv.toPrecision(7)),x0+w*k/4,y0+hh+hy+16)}
  g.textAlign='right';for(let k=0;k<=4;k++){const yv=z.ymax-ey*k/4;g.fillText(N(+yv.toPrecision(7)),x0-hx-6,y0+hh*k/4+4)}
  // colour bar
  const bx=r.width-R+28,by=T+10,bh=Math.min(260,ah-20);for(let i=0;i<bh;i++){const c=ramp(1-i/bh);g.fillStyle=`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;g.fillRect(bx,by+i,14,1)}
  g.strokeStyle='#c9c4b6';g.strokeRect(bx+.5,by+.5,14,bh);g.fillStyle='#5c5a52';g.textAlign='left';g.fillText(N(+mx.toPrecision(5)),bx+18,by+8);g.fillText(N(+mn.toPrecision(5)),bx+18,by+bh);
  cv.onmousemove=e=>{const q=cv.getBoundingClientRect(),px=e.clientX-q.left,py=e.clientY-q.top,c=Math.round((px-x0)/w*(nc-1)),rr=Math.round((py-y0)/hh*(nr-1));
    if(c<0||c>=nc||rr<0||rr>=nr){$('mapRo').textContent='Move over the map to read the values.';return}
    const v=z.values[c*nr+rr];$('mapRo').textContent=`x ${N(z.xmin+c*z.dx)}   y ${N(z.ymax-rr*z.dy)}   row ${rr+1}, column ${c+1}   z ${ZMAP.isNull(z,v)?'null':N(+v.toPrecision(7))}`};
  cv.onmouseleave=()=>{$('mapRo').textContent='Move over the map to read the values.'}}
addEventListener('resize',()=>{if(S.tab==='map')drawMap()});

const fixedName=n=>n.replace(/(\.\w+)?$/,'_checked.zmap');
function exportOne(x){if(!x.z.at.length){banner(`${x.name}: not a ZMAP+ file, nothing to write.`,true);return false}
  download(fixedName(x.name),encode(written(x).text,x.enc),'text/plain');return true}
$('bAll').onclick=async()=>{let n=0;for(const x of S.files){if(exportOne(x))n++;await new Promise(r=>setTimeout(r,350))}$('exportMsg').textContent=`Saved ${n} file(s)`};
$('bCsv').onclick=()=>{// cells starting with = + - @ are prefixed so a spreadsheet does not run them as formulas
  const q=s=>{s=String(s==null?'':s);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const L=['file,severity,line,rule,problem,details,correction,corrected_in_download'];
  for(const x of S.files)for(const f of x.f)L.push([x.name,GRP[f.sev],f.line||'',f.rule,T[f.rule]||'',f.msg,f.fix||'',f.fix&&S.fixes.has(f.fix)?'yes':''].map(q).join(','));
  for(const b of S.batch)L.push([b.file,GRP[b.sev],'',b.rule,T[b.rule]||'',b.msg,'',''].map(q).join(','));
  download('zmap_check_report.csv','﻿'+L.join('\r\n'),'text/csv;charset=utf-8');$('exportMsg').textContent='Saved zmap_check_report.csv'};

// ---- example: a clean time grid and a depth grid with defects (rows/columns swapped, ",,", other null marker)
function zfile(o){const nr=o.nr,nc=o.nc,L=[];
  for(let c=0;c<nc;c++){const col=[];for(let r=0;r<nr;r++){const xx=c/(nc-1),yy=1-r/(nr-1);let v=o.f(xx,yy);if(o.hole&&Math.hypot(xx-.75,yy-.3)<.12)v=null;col.push(v==null?o.nullTok:v.toFixed(7))}
    for(let i=0;i<nr;i+=o.npl)L.push(col.slice(i,i+o.npl).map(s=>s.padStart(15)).join(''))}
  return `!\n! ${o.name} - synthetic example\n!\n@${o.name}, GRID, ${o.npl}\n${o.l2}\n${o.hdrRows}, ${o.hdrCols}, ${o.x0}, ${o.x1}, ${o.y0}, ${o.y1}\n0.0, 0.0, 0.0\n@\n${L.join('\n')}\n`}
function example(){
  const dome=(a,b)=>(x,y)=>a-b*Math.exp(-((x-.45)**2+(y-.55)**2)/.08)-120*x+(Math.sin(9*x)+Math.cos(7*y))*6;
  const t1=zfile({name:'TOP_RESERVOIR_TWT',nr:41,nc:61,npl:5,nullTok:'1.0000000E+30',l2:'15, 1.0000000E+30, , 7, 1',hdrRows:41,hdrCols:61,x0:'450000.0',x1:'456000.0',y0:'6780000.0',y1:'6784000.0',f:dome(2350,180),hole:true});
  let t2=zfile({name:'TOP_RESERVOIR_DEPTH',nr:41,nc:61,npl:5,nullTok:'1.0000000E+30',l2:'15,1.0000000E+30,,7,1',hdrRows:61,hdrCols:41,x0:'450000.0',x1:'456000.0',y0:'6780000.0',y1:'6784000.0',f:dome(2480,210),hole:true});
  t2=t2.replace(/(\n\s+\d+\.\d+)(\s+\d+\.\d+)/,'$1       -99999.0');   // a node written with another null marker
  S.files=[];S.sel=0;addText('top_reservoir_twt.zmap',t1,'utf-8');addText('top_reservoir_depth.zmap',t2,'utf-8');refresh();
  banner('Example: two synthetic grids; the depth grid has deliberate defects.')}
$('bExample').onclick=example;

document.querySelectorAll('.panel h2').forEach(h=>h.addEventListener('click',e=>{if(e.target.closest('.tt'))return;h.parentElement.classList.toggle('collapsed')}));
refresh();
if(location.hash==='#example')example();  // shareable link to the example
window.DG={S,refresh,addText};
</script>

<script id="rgm-js">

#rgm .rgchip.warn{background:rgba(168,98,58,.2);color:#8a4e2c}
#rgm .rgleg{color:var(--mut,#5c5a52);font-size:.78rem;max-width:90ch}
@media(max-width:700px){#rgm table{display:block;overflow-x:auto}}`;

  if(D.method&&D.method.length)h+='<h2>Method</h2><ul>'+D.method.map(x=>`<li>${x}</li>`).join('')+'</ul>';
  if(D.sources&&D.sources.length){h+='<h2>Sources and status</h2><table><thead><tr><th>Item</th><th>Source</th><th>Status</th></tr></thead><tbody>'+D.sources.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td class="rgst">${chip(r[2])}</td></tr>`).join('')+'</tbody></table>';
    h+='<p class="rgleg">Status tags: <b>published</b> the source was read; <b>published (second hand)</b> as reported by a secondary page; <b>figure</b> values read off a published figure, not from a table; <b>supplied</b> numbers supplied by the site author, not checked against the paper; <b>derived</b> own derivation from a mass balance or first principles; <b>memory</b> written from memory, not checked; <b>existence confirmed</b> the reference exists (title, year), its content was not read; <b>classical</b> standard method, reference still to add; <b>on the page</b> the rule or default is shown and editable in the tool itself. A reference is listed only when its existence was confirmed; when only the record is known, the details are left out rather than guessed.</p>'}
  if(D.validation&&D.validation.length)h+='<h2>Validation</h2><ul>'+D.validation.map(x=>`<li>${x}</li>`).join('')+'</ul>';
  if(D.limits&&D.limits.length)h+='<h2>Limits and not implemented</h2><ul>'+D.limits.map(x=>`<li>${x}</li>`).join('')+'</ul>';
  h+=`<p class="rgleg">Last updated ${D.date||'12 October 2026'}.</p></div>`;
  const box=document.createElement('div');box.id='rgm';box.innerHTML=h;document.body.appendChild(box);
  const top=document.querySelector('.top'),btn=document.createElement('button');btn.type='button';btn.className='rgm-btn';btn.textContent='Method & sources';

  function set(on){box.classList.toggle('on',on);btn.classList.toggle('on',on);btn.textContent=on?'← Back to the tool':'Method & sources';

  // ---- Tools menu: switch between the tool pages without going back to the site
  (function(){
    const CAT=[['Data preparation',[['LAS checker','las-checker'],['ZMAP checker','zmap-checker']]],['Digitization',[['Plot digitizer','digitizer'],['Continuous map digitizer','mapdigitizer'],['Discrete map digitizer','discretemap']]],
      ['Mapping and spatial statistics',[['Map interpolation','gridding'],['Variogram','variogram'],['Convex & concave hulls','hull'],['Clustering','clustering'],['GDE map generator','gdemap']]],

    const st=document.createElement('style');st.textContent=`

    b.onclick=e=>{e.stopPropagation();set(!w.classList.contains('on'))};

({"what": "Runs entirely in your browser: the files are read in memory and never uploaded. Quality control of transmitted ZMAP+ grid files before loading them in an interpretation package: a file that follows the format passes with nothing to do; otherwise every problem is listed with its line, and the mechanical ones can be fixed in a downloaded copy.", "method": ["Format as read here: “!” comment lines, then a header between two “@” markers — “@name, GRID, nodes per line”; “field width, null value, null text, decimals, start column”; “rows, columns, xmin, xmax, ymin, ymax” (rows first); “0.0, 0.0, 0.0”; “@”. Data column by column from the upper-left node (ymax) downwards, columns left to right, each column starting on a new line, at most “nodes per line” values per line, fixed-width fields.", "Node spacing: dx = (xmax − xmin)/(columns − 1), dy = (ymax − ymin)/(rows − 1). When this spacing is not round (a multiple of 0.01) but the extent divided by the number of cells is, the extent is probably given at the cell edges (GDAL default, “pixel is area”) and node-based readers shift the grid by half a cell; when swapping rows and columns gives a round spacing, the two numbers are probably swapped. Both are reported, never changed.", "Checks, by severity: E = import fails or data is wrong (not ZMAP+, non-grid ZMAP+ file, missing or extra “@”, malformed header lines, invalid size or extent, wrong value count, text or comma decimals, too many values on a line, empty grid); W = non-conforming, imports with risk (BOM, tabs, lower-case GRID, “,,”, null only as text, missing fourth line, blank lines in the header, line breaks not following the columns, fixed width broken, values without decimal point, other null markers, half-cell or swapped geometry); I = worth a look (fourth line not zero, null written differently, non-square cells, mostly null or constant grid, depth grid with positive values).", "Fixes, applied to the downloaded copy only: byte-order mark, line endings, tabs, header rewritten in the standard form, data rewritten column by column at the declared nodes per line with right-justified fixed-width fields (values copied as text, field widened when a value does not fit). Replacing other null markers by the header null changes values and is off by default."], "sources": [["Header layout, column-major order from the upper-left node, column line breaks, implied decimals", "D. Baker, description of the ZMAP+ grid format, gdal-dev mailing list, June 2011 (cited by the GDAL ZMap driver as its informal specification)", "published"], ["Reader constraints: 3/5/6 header tokens, “,,” dropped, width < 40, start column 1, fixed-width slicing, pixel-is-area default", "GDAL ZMap driver documentation and source (zmapdataset.cpp)", "published"], ["Rows first on the third line (checked on two real files where only rows-first gives a round spacing); node registration", "zmapio, xtgeo, resqpy readers and writers; real headers posted online", "published"], ["Half-cell shift of GDAL-written grids in node-based readers", "zmapio issue #6; GDAL ZMAP_PIXEL_IS_POINT option", "published"], ["Non-grid ZMAP+ types (CNTR, DATA, FALT, VERT, TEXT)", "Safe Software FME ZMAP reader documentation; Migris MigriX user guide", "published"], ["Petrel counts Z positive upwards", "AASPI surface import documentation (University of Oklahoma)", "published (second hand)"], ["Petrel's exact export header and its import error messages", "No public Schlumberger documentation found", "not retrieved"], ["Meaning of the fourth header line", "Undocumented in every public source; real files have non-zero first values", "not retrieved"]], "validation": ["Self-check script (scripts/zmap_check_test.mjs): a clean grid with one line per column and one with wrapped columns pass with no error or warning; one broken variant per rule; round trips of the writer (each fix resolves its problems, values identical, no fix = identical file, the loaded file is never modified); a 1000 × 1000 grid."], "limits": ["Grids only: ZMAP+ point, line, fault and contour files are recognised but not checked.", "Rotated grids do not exist in ZMAP+; a rotated surface must be resampled before export.", "The coordinate system is not stored in ZMAP+ and cannot be checked.", "“Round spacing” means a multiple of 0.01: grids in degrees with odd spacings may miss the half-cell and swapped-axis hints."], "date": "24 November 2026"});
