<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Chess</title>
<style>
:root{--bg:#f5f3ed;--fg:#232220;--mut:#5c5a52;--acc:#4a5a4e;--line:#c9c4b6}
@media(prefers-color-scheme:dark){:root{--bg:#1d1e1c;--fg:#e8e5dc;--mut:#a9a699;--acc:#9bb5a0;--line:#3a3b37}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Inter,system-ui,sans-serif;padding:24px 16px}
.box{max-width:440px;margin:12vh auto 0}
h1{font-size:1.4rem;margin:0 0 8px}
p{color:var(--mut);margin:0 0 16px}
button{background:var(--acc);color:var(--bg);border:0;border-radius:6px;padding:10px 18px;font:inherit;cursor:pointer}
input{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--fg);width:100%;margin-bottom:10px}
a.back{color:var(--mut);font-size:.9rem;display:inline-block;margin-top:20px}
[hidden]{display:none!important}
.err{color:#b3402f}
</style></head><body>
<div class="box" id="s1">
<h1>Chess</h1>
<p>Step 1 of 2. Sign in with your Lichess account. The login happens on lichess.org; this site never sees your password.</p>
<button id="go" type="button">Sign in with Lichess</button>
<p class="err" id="e1" role="alert" hidden></p>
<br><a class="back" href="../">← Back to the site</a>
</div>
<div class="box" id="s2" hidden>
<h1>Chess</h1>
<p>Step 2 of 2. Signed in as <strong id="who"></strong>. Enter the passphrase to open the page.</p>
<form id="f"><input id="pw" type="password" autocomplete="off" placeholder="Passphrase"><button id="ok" type="submit">Open</button></form>
<p class="err" id="e2" role="alert" hidden></p>
<button id="out" type="button" style="background:none;color:var(--mut);padding:0;margin-top:14px">Sign out</button>
</div>
<div id="dash" hidden></div>

const $=id=>document.getElementById(id);
const ss={get:k=>{try{return sessionStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){}},del:k=>{try{sessionStorage.removeItem(k)}catch(e){}}};
const b64u=a=>btoa(String.fromCharCode(...new Uint8Array(a))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const rnd=n=>b64u(crypto.getRandomValues(new Uint8Array(n)));
function step(n,err){$('s1').hidden=n!==1;$('s2').hidden=n!==2;$('dash').hidden=n!==3;if(err){const e=$(n===1?'e1':'e2');e.textContent=err;e.hidden=false}}
async function login(){
  const v=rnd(48),st=rnd(16);ss.set('li_v',v);ss.set('li_s',st);
  const ch=b64u(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
  location.href=LI+'/oauth?'+new URLSearchParams({response_type:'code',client_id:CLIENT_ID,redirect_uri:REDIRECT,code_challenge_method:'S256',code_challenge:ch,state:st});
}
function admit(name){
  if(ALLOWED.includes(name.toLowerCase())){ss.set('li_u',name);$('who').textContent=name;step(2);tryStored()}
  else step(1,'The Lichess account "'+name+'" is not on the list.');
}
async function decrypt(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64(P.s),iterations:P.i,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(P.n)},key,unb64(P.c));   // throws on a wrong passphrase
  const txt=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  return JSON.parse(txt);
}
async function open_(pw){
  const d=await decrypt(pw);
  window.LI_USER=ss.get('li_u');
  $('dash').innerHTML=d.html;step(3);
  const s=document.createElement('script');s.textContent=d.js;document.body.appendChild(s);
}
async function tryStored(){const pw=ss.get('li_pw');if(pw){try{await open_(pw)}catch(e){ss.del('li_pw')}}}
(async()=>{
  $('go').onclick=login;
  $('out').onclick=()=>{['li_u','li_v','li_s','li_pw'].forEach(ss.del);location.href=REDIRECT};
  $('f').onsubmit=async ev=>{ev.preventDefault();const pw=$('pw').value;$('e2').hidden=true;
    if(!pw)return step(2,'Enter the passphrase.');
    try{await open_(pw);ss.set('li_pw',pw)}catch(e){step(2,'Wrong passphrase.')}};
  const q=new URLSearchParams(location.search);
  if(q.get('error')){history.replaceState(null,'',REDIRECT);return step(1,'Lichess sign-in cancelled or refused.')}
  if(q.get('code')){
    const v=ss.get('li_v'),st=ss.get('li_s');history.replaceState(null,'',REDIRECT);
    if(!v||q.get('state')!==st)return step(1,'Sign-in state mismatch, please try again.');
    try{
      const r=await fetch(LI+'/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
        body:new URLSearchParams({grant_type:'authorization_code',code:q.get('code'),code_verifier:v,redirect_uri:REDIRECT,client_id:CLIENT_ID})});
      if(!r.ok)throw new Error('token '+r.status);
      const t=(await r.json()).access_token;
      const a=await fetch(LI+'/api/account',{headers:{Authorization:'Bearer '+t}});
      if(!a.ok)throw new Error('account '+a.status);
      const name=(await a.json()).username;
      fetch(LI+'/api/token',{method:'DELETE',headers:{Authorization:'Bearer '+t}}).catch(()=>{});   // token only served to read the username
      ss.del('li_v');ss.del('li_s');admit(name);
    }catch(e){step(1,'Sign-in failed ('+e.message+').')}
    return;
  }
  const u=ss.get('li_u');if(u)admit(u);
})();
