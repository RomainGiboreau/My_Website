<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chess</title>
<style>
:root{--bg:#f5f3ed;--fg:#232220;--mut:#5c5a52;--acc:#4a5a4e;--line:#c9c4b6}
@media(prefers-color-scheme:dark){:root{--bg:#1d1e1c;--fg:#e8e5dc;--mut:#a9a699;--acc:#9bb5a0;--line:#3a3b37}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Inter,system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:16px;box-sizing:border-box}
main{max-width:460px;width:100%}
h1{font-size:1.4rem;margin:0 0 8px}
p{color:var(--mut);margin:0 0 16px}
button,a.btn{display:inline-block;background:var(--acc);color:var(--bg);border:0;border-radius:6px;padding:10px 18px;font:inherit;cursor:pointer;text-decoration:none}
a.back{color:var(--mut);font-size:.9rem;display:inline-block;margin-top:20px}
[hidden]{display:none!important}
#err{color:#b3402f}
</style></head><body><main>
<section id="gate">
<h1>Chess</h1>
<p>Sign in with your Lichess account. The login happens on lichess.org; this site never sees your password.</p>
<button id="go" type="button">Sign in with Lichess</button>
<p id="err" role="alert" hidden></p>
<a class="back" href="../">← Back to the site</a>
</section>
<section id="app" hidden>
<h1>Chess</h1>
<p>Signed in as <strong id="who"></strong>.</p>
<p>Nothing here yet.</p>
<button id="out" type="button">Sign out</button>
<br><a class="back" href="../">← Back to the site</a>
</section>
</main>
<script>
// Gate only: the allow-list is client-side, so it keeps casual visitors out but is NOT access control.
const ALLOWED=['rom9228'];            // Lichess usernames, compared lowercase; empty/placeholder = nobody gets in
const CLIENT_ID='romaingiboreau-chess';            // public PKCE client: any identifying string, no secret, no registration on Lichess
const LI='https://lichess.org';
const REDIRECT=location.origin+location.pathname;  // must be identical at /oauth and /api/token
const $=id=>document.getElementById(id);
const ss={get:k=>{try{return sessionStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){}},del:k=>{try{sessionStorage.removeItem(k)}catch(e){}}};
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const rnd=n=>b64(crypto.getRandomValues(new Uint8Array(n)));
function fail(m){$('err').textContent=m;$('err').hidden=false;$('gate').hidden=false;$('app').hidden=true}
function show(name){$('who').textContent=name;$('gate').hidden=true;$('app').hidden=false}
async function login(){
  const v=rnd(48),st=rnd(16);ss.set('li_v',v);ss.set('li_s',st);
  const ch=b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
  location.href=LI+'/oauth?'+new URLSearchParams({response_type:'code',client_id:CLIENT_ID,redirect_uri:REDIRECT,code_challenge_method:'S256',code_challenge:ch,state:st});
}
async function who(tok){
  const r=await fetch(LI+'/api/account',{headers:{Authorization:'Bearer '+tok}});
  if(!r.ok)throw new Error('account '+r.status);
  return (await r.json()).username;
}
function admit(name){
  if(ALLOWED.map(s=>s.toLowerCase()).includes(name.toLowerCase())){ss.set('li_u',name);show(name)}
  else fail('The Lichess account "'+name+'" is not on the list.');
}
(async()=>{
  $('go').onclick=login;
  $('out').onclick=()=>{['li_u','li_v','li_s'].forEach(ss.del);location.href=REDIRECT};
  const q=new URLSearchParams(location.search);
  if(q.get('error')){history.replaceState(null,'',REDIRECT);return fail('Lichess sign-in cancelled or refused.')}
  if(q.get('code')){
    const v=ss.get('li_v'),st=ss.get('li_s');history.replaceState(null,'',REDIRECT);
    if(!v||q.get('state')!==st)return fail('Sign-in state mismatch, please try again.');
    try{
      const r=await fetch(LI+'/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
        body:new URLSearchParams({grant_type:'authorization_code',code:q.get('code'),code_verifier:v,redirect_uri:REDIRECT,client_id:CLIENT_ID})});
      if(!r.ok)throw new Error('token '+r.status);
      const t=(await r.json()).access_token;
      const name=await who(t);
      // The token is only needed to read the username: drop it, and revoke it on Lichess.
      fetch(LI+'/api/token',{method:'DELETE',headers:{Authorization:'Bearer '+t}}).catch(()=>{});
      ss.del('li_v');ss.del('li_s');admit(name);
    }catch(e){fail('Sign-in failed ('+e.message+').')}
    return;
  }
  const u=ss.get('li_u');if(u)admit(u);
})();
</script></body></html>
