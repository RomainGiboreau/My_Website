const $=id=>document.getElementById(id);
const ss={get:k=>{try{return sessionStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){}},del:k=>{try{sessionStorage.removeItem(k)}catch(e){}}};
const b64u=a=>btoa(String.fromCharCode(...new Uint8Array(a))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const rnd=n=>b64u(crypto.getRandomValues(new Uint8Array(n)));
function step(n,err){$('s1').hidden=n!==1;$('dash').hidden=n!==3;$('out').hidden=n!==3;if(err){const e=$('e1');e.textContent=err;e.hidden=false}}
async function login(){
  const v=rnd(48),st=rnd(16);ss.set('li_v',v);ss.set('li_s',st);
  const ch=b64u(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
  location.href=LI+'/oauth?'+new URLSearchParams({response_type:'code',client_id:CLIENT_ID,redirect_uri:REDIRECT,code_challenge_method:'S256',code_challenge:ch,state:st,scope:'study:read puzzle:read'});   // read-only: your studies (private included) and puzzle batches
}
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const okName=n=>/^[A-Za-z0-9_-]{2,30}$/.test(n);
function admit(name){      // after a Lichess sign-in: the account Lichess reports is the active one
  ss.set('li_u',name);ls.set('rg_acct',name);$('acct').value=name;step(1);tryStored()
}
async function decrypt(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64(P.s),iterations:P.i,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(P.n)},key,unb64(P.c));   // throws on a wrong passphrase
  const txt=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  return JSON.parse(txt);
}
// ---- helpers used by the dashboard: sealed backups (the passphrase never leaves the browser)
const b64=a=>{let s='';for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s)};
const zip=async(u8,dir)=>new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(dir==='z'?new CompressionStream('gzip'):new DecompressionStream('gzip'))).arrayBuffer());
const kdf=async(pw,salt,it,use)=>{const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,use)};
const seal=async(pw,u8)=>{const s=crypto.getRandomValues(new Uint8Array(16)),n=crypto.getRandomValues(new Uint8Array(12)),it=600000,k=await kdf(pw,s,it,['encrypt']);
  const c=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:n},k,await zip(u8,'z')));return {s:b64(s),n:b64(n),c:b64(c),i:it}};
window.RG_SEAL=async obj=>{const pw=ss.get('li_pw');if(!pw)throw new Error('no passphrase in this session');
  return JSON.stringify({v:1,...await seal(pw,new TextEncoder().encode(JSON.stringify(obj)))})};
window.RG_OPEN=async txt=>{const o=JSON.parse(txt),pw=ss.get('li_pw');if(!pw)throw new Error('no passphrase in this session');
  const k=await kdf(pw,unb64(o.s),o.i,['decrypt']);return JSON.parse(new TextDecoder().decode(await zip(new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.n)},k,unb64(o.c))),'u')))};
async function open_(pw){
  const d=await decrypt(pw);
  window.LI_USER=ss.get('li_u')||$('acct').value.trim();window.LI_TOKEN=ss.get('li_t');window.RG_LOGIN=login;
  $('dash').innerHTML=d.html;step(3);
  const s=document.createElement('script');s.textContent=d.js;document.body.appendChild(s);
}
async function tryStored(){const pw=ss.get('li_pw');if(pw&&ss.get('li_u')){try{await open_(pw)}catch(e){ss.del('li_pw')}}}
(async()=>{
  $('acct').value=ss.get('li_u')||ls.get('rg_acct')||'';      // remembered in this browser only
  $('out').onclick=()=>{const t=ss.get('li_t');if(t)fetch(LI+'/api/token',{method:'DELETE',headers:{Authorization:'Bearer '+t},keepalive:true}).catch(()=>{});
    ['li_u','li_v','li_s','li_pw','li_t'].forEach(ss.del);location.href=REDIRECT};   // Lock: passphrase and token forgotten, the page reloads on the passphrase step
  $('f').onsubmit=async ev=>{ev.preventDefault();const pw=$('pw').value;$('e1').hidden=true;
    const u=$('acct').value.trim();
    if(!okName(u))return step(1,'Enter your Lichess username.');
    if(!pw)return step(1,'Enter the passphrase.');
    ss.set('li_u',u);ls.set('rg_acct',u);
    try{await open_(pw);ss.set('li_pw',pw)}catch(e){step(1,'Wrong passphrase.')}};
  const q=new URLSearchParams(location.search);
  if(q.get('error')){history.replaceState(null,'',REDIRECT);return tryStored().then(()=>{if($('dash').hidden)step(1,'Lichess sign-in cancelled or refused.')})}
  if(q.get('code')){
    const v=ss.get('li_v'),st=ss.get('li_s');history.replaceState(null,'',REDIRECT);
    if(!v||q.get('state')!==st)return step(1,'Sign-in state mismatch, please try again.');
    try{
      const r=await fetch(LI+'/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
        body:new URLSearchParams({grant_type:'authorization_code',code:q.get('code'),code_verifier:v,redirect_uri:REDIRECT,client_id:CLIENT_ID})});
      if(!r.ok)throw new Error('token '+r.status);
      const t=(await r.json()).access_token;
      const a=await fetch(LI+'/api/account',{headers:{Authorization:'Bearer '+t}});
      if(!a.ok)throw new Error('account '+a.status);
      const name=(await a.json()).username;
      ss.set('li_t',t);                       // kept for this tab only (sessionStorage), revoked at sign-out; scope = study:read
      ss.del('li_v');ss.del('li_s');admit(name);
    }catch(e){step(1,'Sign-in failed ('+e.message+').')}
    return;
  }
  tryStored();
})();
