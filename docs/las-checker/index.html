<script id="las-core">
/* LAS checker core: parse / check / write. No DOM access; exposed as window.LAS. */
(function(W){
const F=(sev,rule,line,msg,fix)=>({sev,rule,line:line==null?null:line,msg,fix:fix||null});
const NUM=/^[-+]?(\d+\.?\d*|\.\d+)([eE][-+]?\d+)?$/;
const TEXT_NULL=/^(na|n\/a|#n\/a|nan|null|\(null\)|inf|-inf|\+inf|-1\.#ind|-1\.#inf|-1\.#io|1\.#inf|-+)$/i;
const NUM_NULL=[-999.25,-999,-9999,-99999,9999.25,999.25,-999.99,9999,32767,-32767,2147483647,-2147483648];
const INDEX=/^(DEPT|DEPTH|DEP|MD|TDEP|TVD|TVDSS|TVDKB|TVDSD|TIME|ETIM|INDEX)$/i;
const up=s=>String(s||'').toUpperCase();

// Split "MNEM.UNIT  VALUE : DESCRIPTION". Mnemonic ends at the first dot, unit at the first
// whitespace after it; the description starts at the first colon preceded by whitespace (so colons
// inside units/values such as hh:mm or 23:15 survive), else at the last colon.
// LAS 1.2 ~W labels written in the value slot ("WELL.  WELL : ACME-1")
const LABEL=/^(COMPANY|WELL( NAME)?|FIELD( NAME)?|LOCATION|PROVINCE|COUNTY|STATE|COUNTRY|(SERVICE|LOGGING) COMPANY|LOG DATE|DATE( LOGGED)?|UNIQUE WELL ID|UWI|API( NUMBER| NO\.?)?|LICEN[CS]E( NUMBER)?)$/i;
function splitHeader(s){
  const t=s.replace(/^\s+/,'');
  const d=t.indexOf('.'),c0=t.indexOf(':');
  if(d<0||(c0>=0&&c0<d)){ // no dot before the description
    if(c0<0)return null;
    return {mnem:t.slice(0,c0).trim(),unit:'',value:'',desc:t.slice(c0+1).trim(),nodot:true};
  }
  const mnem=t.slice(0,d).trim();let rest=t.slice(d+1),unit='';
  const sp=rest.search(/\s/);
  if(sp<0){unit=rest;rest=''}else{unit=rest.slice(0,sp);rest=rest.slice(sp)}
  // no ' :' → a 1.2 label glued to its colon ("LOG DATE:  13-DEC-86 10:30") splits at the first colon, else the last
  let ci=rest.search(/\s:/);if(ci>=0)ci++;else{const k=rest.indexOf(':');ci=k>=0&&LABEL.test(rest.slice(0,k).trim())?k:rest.lastIndexOf(':')}
  // unit with a colon swallowed the delimiter ("UNIT:desc"): only when nothing follows
  if(ci<0&&unit.includes(':')&&!rest.trim()){const k=unit.indexOf(':');rest=' '+unit.slice(k);unit=unit.slice(0,k);ci=1}
  if(unit==='1000'&&/^\s+LBF\b/i.test(rest)){unit='1000 LBF';rest=rest.replace(/^\s+LBF/i,'');ci=rest.search(/\s:/);ci=ci>=0?ci+1:rest.lastIndexOf(':')}
  const value=(ci<0?rest:rest.slice(0,ci)).trim(),desc=ci<0?'':rest.slice(ci+1).trim();
  return {mnem,unit,value,desc,nocolon:ci<0};
}

function parse(text,name){
  const las={name:name||'file.las',findings:[],sections:[],ver:{},well:[],curves:[],params:[],other:[],rows:[],data:[],nVersion:0};
  const P=(...a)=>las.findings.push(F(...a));
  las.bom=text.charCodeAt(0)===0xFEFF;if(las.bom)text=text.slice(1);
  las.crOnly=/\r(?!\n)/.test(text)&&!/\n/.test(text);
  const lines=text.split(/\r\n|\n|\r/);if(lines.length&&lines[lines.length-1]==='')lines.pop();
  las.lines=lines;
  // sections
  let cur=null;
  lines.forEach((l,i)=>{const t=l.trim();if(t[0]==='~'){
    if(cur)cur.end=i;cur={tag:up(t[1]||''),title:t.slice(1).trim(),start:i,end:lines.length};las.sections.push(cur)}});
  if(!las.sections.length)return las;
  las.nVersion=las.sections.filter(s=>s.tag==='V').length;
  const first=t=>las.sections.find(s=>s.tag===t);
  const items=(sec,into)=>{if(!sec)return;for(let i=sec.start+1;i<sec.end;i++){const l=lines[i],t=l.trim();
    if(!t||t[0]==='#')continue;const h=splitHeader(l);
    if(!h||!h.mnem){las.findings.push(F('E','hdr.parse',i+1,`Line cannot be read as MNEM.UNIT VALUE : DESCRIPTION: “${t.slice(0,60)}”`));continue}
    h.line=i+1;h.raw=l;into.push(h)}};
  const V=[];items(first('V'),V);las.vItems=V;
  for(const h of V)las.ver[up(h.mnem)]=h.value;
  items(first('W'),las.well);items(first('C'),las.curves);items(first('P'),las.params);
  const ver=parseFloat(las.ver.VERS);
  // LAS 1.2 ~W layout: value in the description for the text items
  const txt=['COMP','WELL','FLD','LOC','SRVC','DATE','PROV','CNTY','STAT','CTRY','UWI','API'];
  // an item is in 1.2 layout when its value slot is empty or holds a label ("WELL.  WELL : ACME-1")
  // an empty value counts only when the description is data, not a label (2.0 files often leave LOC/PROV… empty)
  const is12=h=>txt.includes(up(h.mnem))&&h.desc&&(LABEL.test(h.value)||(!h.value&&!LABEL.test(h.desc)));
  const w12=las.well.filter(is12).length;
  las.layout12=w12>=3||(ver===1.2&&w12>=1);
  if(las.layout12)for(const h of las.well)if(is12(h)){const lab=h.value;h.value=h.desc;h.desc=lab;h.from12=true}
  // ~A
  const A=first('A');if(!A)return las;
  las.wrapped=up(las.ver.WRAP)==='YES';
  const nc=las.curves.length,nullTok=(las.well.find(h=>up(h.mnem)==='NULL')||{}).value;
  las.nullStr=nullTok;las.nullVal=NUM.test(nullTok||'')?+nullTok:NaN;
  const tok=s=>s.trim().split(/[\s,]+/).filter(Boolean);
  const mkRow=(line,tokens,lineCount)=>{const vals=tokens.map(x=>NUM.test(x)?+x:NaN);
    const ok=tokens.length===nc&&tokens.every(x=>NUM.test(x)||TEXT_NULL.test(x));
    las.rows.push({line,tokens,vals,ok,lineCount:lineCount||1})};
  las.aComments=[];
  if(!las.wrapped){
    for(let i=A.start+1;i<A.end;i++){const t=lines[i].trim();if(!t)continue;if(t[0]==='#'){las.aComments.push(i+1);continue}mkRow(i+1,tok(t))}
  }else{
    let buf=null,start=0,cnt=0,prev=NaN,dz=NaN;las.wrapIssues=[];
    const stp=parseFloat((las.well.find(h=>up(h.mnem)==='STEP')||{}).value);
    const flush=()=>{mkRow(start,buf,cnt);const z=+buf[0];if(isFinite(prev)&&isFinite(z))dz=z-prev;prev=z;buf=null};
    for(let i=A.start+1;i<A.end;i++){const t=lines[i].trim();if(!t)continue;if(t[0]==='#'){las.aComments.push(i+1);continue}
      if(lines[i].length>80)las.wrapIssues.push([i+1,'line longer than 80 characters']);
      const tk=tok(t);
      // a short record followed by a lone value at the expected next depth: the record lost a line, start a new one
      if(buf&&buf.length<nc&&tk.length===1&&NUM.test(tk[0])&&isFinite(prev)){const st=stp&&isFinite(stp)?stp:dz;
        if(isFinite(st)&&st&&Math.abs(+tk[0]-(+buf[0]+st))<=Math.abs(st)*0.5){las.wrapIssues.push([start,'record without all its values']);flush()}}
      if(!buf){buf=tk.slice();start=i+1;cnt=1;if(tk.length!==1)las.wrapIssues.push([i+1,'index value is not alone on its line'])}
      else{buf.push(...tk);cnt++}
      if(nc&&buf.length>=nc)flush()}
    if(buf)flush();
  }
  las.data=las.rows.filter(r=>r.ok).map(r=>r.vals);
  return las;
}

const isNull=(las,v)=>!isFinite(v)||v===las.nullVal;
// no Math.min(...a): it overflows the stack on long logs
const amin=a=>a.reduce((m,x)=>x<m?x:m,Infinity),amax=a=>a.reduce((m,x)=>x>m?x:m,-Infinity);
const median=a=>{if(!a.length)return NaN;const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const fmtN=v=>String(+(+v).toPrecision(10));

// index statistics shared by check() and write()
function indexInfo(las){
  // every row whose index token is a number, even if the rest of the row is bad: a truncated row must not leave a gap
  const src=las.rows?las.rows.filter(r=>NUM.test(r.tokens[0])).map(r=>r.tokens[0]):las.data.map(r=>String(r[0]));
  const idx=src.map(Number).filter(v=>!isNull(las,v));
  // printed precision: depths rounded to 2 decimals make a 0.1524 step look irregular
  let dec=0;for(const t of src){const m=/\.(\d+)/.exec(t);if(m&&m[1].length>dec)dec=m[1].length}
  const rtol=Math.pow(10,-dec)*1.0001;
  const d=[];for(let i=1;i<idx.length;i++)d.push(idx[i]-idx[i-1]);
  const md=median(d),tol=Math.max(Math.abs(md)*1e-3,rtol)||1e-6;
  const regular=d.length>0&&d.every(x=>Math.abs(x-md)<=tol);
  const jitter=d.length?amax(d.map(x=>Math.abs(x-md))):0;
  const n=idx.length,est=regular&&n>1?(idx[n-1]-idx[0])/(n-1):md;
  let mono=true;for(let i=1;i<d.length;i++)if(Math.sign(d[i])!==Math.sign(d[0])||!d[i]){mono=false;break}
  return {idx,d,step:est,regular,jitter,dec,rtol,mono,stepTol:Math.max(Math.abs(est)*1e-3,2*rtol/Math.max(1,n-1)),endTol:Math.max(Math.abs(est)*0.01,rtol),first:idx[0],last:idx[n-1]};
}

const lineList=a=>a.slice(0,5).join(', ')+(a.length>5?` … (${a.length} in all)`:'');

  for(const [wn,g] of by('well')){const u=[...new Set(g.map(i=>i.uwi).filter(Boolean))];if(u.length>1)P('W','batch.uwi',g.map(i=>i.l.name).join(', '),`Well ${wn} has different UWI/API: ${u.join(', ')}.`)}

const FIXES=[

  {id:'eol',label:'Normalise line endings (CRLF)',defaultOn:true},
  {id:'tabs',label:'Replace tabs by spaces',defaultOn:true},
  {id:'syntax',label:'Rewrite malformed header lines as MNEM.UNIT VALUE : DESC',defaultOn:true},
  {id:'wrap',label:'Unwrap data (WRAP NO, one line per depth)',defaultOn:true},
  {id:'vers',label:'Write as LAS 2.0 (VERS 2.0, 2.0 ~W layout)',defaultOn:true},
  {id:'strtstop',label:'Set STRT / STOP to the first / last index',defaultOn:true},
  {id:'step',label:'Set STEP to the data step (0 if irregular)',defaultOn:true},
  {id:'nulls',label:'Replace other null markers by the declared NULL (changes values)',defaultOn:false},
  {id:'emptyrows',label:'Drop all-NULL rows at the top and bottom of the data',defaultOn:true}];

  $('fixes').querySelectorAll('input').forEach(i=>i.onchange=()=>setFix(i.dataset.id,i.checked))}

// ---- main column
const ICON={pass:'<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="3"/><path d="M12 20.5l5.5 5.5L29 14" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
 warn:'<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 4L37 34H3z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M20 15v9" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/><circle cx="20" cy="29" r="2" fill="currentColor"/></svg>',
 fail:'<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="3"/><path d="M13.5 13.5l13 13M26.5 13.5l-13 13" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/></svg>'};
function drawMain(keepDetails){

    <div class="dz"><b>Drop LAS files here</b><br><span style="color:var(--mut);font-size:.84rem">several at once is fine — nothing is uploaded</span>

    $('bOpen2').onclick=()=>$('file').click();$('bEx2').onclick=example;return}
  const f=x.f,cnt=s=>f.filter(y=>y.sev===s).length,E=cnt('E'),Wn=cnt('W');
  const l=x.las,g=k=>{const h=(l.well||[]).find(h=>h.mnem.toUpperCase()===k);return h?h.value:''},ix=l.ix||{},iu=l.curves&&l.curves[0]?l.curves[0].unit:'';
  const fixable=f.filter(y=>y.fix&&S.fixes.has(y.fix)).length,log=l.sections.length?written(x).log:[];
  const title={pass:'Ready to load',warn:`Loads, with ${Wn} point${Wn>1?'s':''} to review`,fail:`Will not load cleanly: ${E} blocking problem${E>1?'s':''}`}[x.v];
  const sub=x.v==='pass'?'No problem found by the checks.':(fixable?`${fixable} problem${fixable>1?'s are':' is'} fixed automatically in the corrected file.`:'Nothing here can be fixed automatically: see the details below.');
  const facts=[['Well',g('WELL')||'—'],['UWI',g('UWI')||g('API')||'—'],['Curves',Math.max(0,(l.curves||[]).length-1)],['Depth',isFinite(ix.first)?`${LAS.fmtN(ix.first)} – ${LAS.fmtN(ix.last)} ${iu}`:'—'],['Step',g('STEP')||'—'],['Null',g('NULL')||'—'],['Version',(l.ver&&l.ver.VERS)||'—']];
  let h=`<section class="verdict ${x.v}" aria-live="polite">${ICON[x.v]}<h2>${esc(title)}</h2><div class="sub">${esc(x.name)} — ${esc(sub)}</div>
    <div class="act"><button class="pri" id="bLas" ${l.sections.length?'':'disabled'}>Download corrected file</button><a id="aChanges" tabindex="0">${log.length?log.length+' change'+(log.length>1?'s':'')+' — see them':'no change needed'}</a></div>
    <dl class="facts">${facts.map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl></section>`;
  const bt=S.batch.filter(b=>b.file.includes(x.name));
  if(bt.length)h+=`<section class="across"><h3>Across the loaded files</h3>${bt.map(b=>`<p><span class="sev ${b.sev}">${b.sev}</span> <b>${esc(T[b.rule]||b.rule)}</b> — ${esc(b.msg)}</p>`).join('')}</section>`;
  for(const s of ['E','W','I']){const it=f.filter(y=>y.sev===s).sort((a,b)=>(a.line||0)-(b.line||0));if(!it.length)continue;
    h+=`<section class="grp"><h3>${GRP[s]}<span class="c">${it.length}</span></h3>`+it.map((y,k)=>`<div class="pb ${s}"><b>${esc(T[y.rule]||y.rule)}</b><p>${esc(y.msg)}</p>
      <div class="meta">${y.line?`<a data-line="${y.line}" tabindex="0">line ${y.line}</a>`:''}<span>${esc(y.rule)}</span></div>
      ${y.fix?`<label class="fixit ${S.fixes.has(y.fix)?'':'off'}"><input type="checkbox" data-fix="${y.fix}" ${S.fixes.has(y.fix)?'checked':''}>Fix in the corrected file</label>`:''}</div>`).join('')+'</section>'}
  if(!f.length)h+='<div class="allgood">Every check passed. You can load this file as it is.</div>';
  h+=`<section class="det" id="det"><div class="tabs" role="tablist">${[['curves','Curves'],['header','Header'],['text','File text'],['changes','Changes']].map(([k,n])=>`<button role="tab" data-tab="${k}" class="${S.tab===k?'on':''}">${n}</button>`).join('')}</div>
    <div class="pane" data-p="curves"><div class="trk" id="trk"><canvas id="cvT"></canvas></div><div id="trkRo">Move over the tracks to read the values.</div></div>
    <div class="pane" data-p="header"><div class="htabs" id="hT">${['W','C','P','V'].map(t=>`<button data-t="${t}" class="${S.hdr===t?'on':''}">~${t}</button>`).join('')}</div><div class="tw" id="tH" style="max-height:440px"></div></div>
    <div class="pane" data-p="text"><div class="srcbar">Go to line <input type="number" id="goLine" min="1"> <span style="color:var(--mut)">Lines with a problem are shaded.</span></div><pre class="src" id="src"></pre></div>
    <div class="pane" data-p="changes"><pre class="log" id="log"></pre></div></section>`;
  const y0=keepDetails?scrollY:null;$('main').innerHTML=h;if(y0!=null)scrollTo(0,y0);
  $('bLas').onclick=()=>{if(exportOne(x))$('exportMsg').textContent='Saved '+fixedName(x.name)};
  $('aChanges').onclick=()=>openTab('changes');$('aChanges').onkeydown=e=>{if(e.key==='Enter')openTab('changes')};
  $('main').querySelectorAll('[data-fix]').forEach(c=>c.onchange=()=>setFix(c.dataset.fix,c.checked));
  $('main').querySelectorAll('[data-line]').forEach(a=>{const go=()=>{S.target=+a.dataset.line;openTab('text')};a.onclick=go;a.onkeydown=e=>{if(e.key==='Enter')go()}});
  $('det').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>openTab(b.dataset.tab,true));
  $('hT').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.hdr=b.dataset.t;$('hT').querySelectorAll('button').forEach(z=>z.classList.toggle('on',z===b));drawHeader()});

function openTab(t,noScroll,silent){S.tab=t;const d=$('det');if(!d)return;

  if(!silent&&!noScroll)d.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})}
function drawHeader(){const x=cur();if(!x||!$('tH'))return;const l=x.las;
  const list={W:l.well,C:l.curves,P:l.params,V:l.vItems}[S.hdr]||[];
  $('tH').innerHTML=list.length?'<table><thead><tr><th>Line</th><th>Name</th><th>Unit</th><th>Value</th><th>Description</th></tr></thead><tbody>'+list.map(h=>`<tr><td>${h.line}</td><td>${esc(h.mnem)}</td><td>${esc(h.unit)}</td><td>${esc(h.value)}</td><td>${esc(h.desc)}</td></tr>`).join('')+'</tbody></table>':'<div class="empty">This section is empty or missing.</div>'}
function drawLog(){const x=cur();if(!x||!$('log'))return;if(!x.las.sections.length){$('log').textContent='Not a LAS file: nothing to write.';return}
  const {log}=written(x);$('log').textContent=log.length?log.join('\n'):'No change: the corrected file is the same as the original (apart from Windows line endings).'}
// File text: a window of lines around the target, shaded where a problem points
function drawSource(){const x=cur(),el=$('src');if(!x||!el)return;const L=x.las.lines||[];
  const mark=new Map();for(const f of x.f)if(f.line&&!mark.has(f.line))mark.set(f.line,f.sev);
  const tgt=S.target||1,a=Math.max(0,tgt-60),b=Math.min(L.length,a+400);
  el.innerHTML=(a>0?`<span class="ln"><i>…</i>${a} line(s) above</span>`:'')+L.slice(a,b).map((t,k)=>{const n=a+k+1;return `<span class="ln ${mark.get(n)||''} ${n===S.target?'tgt':''}" id="L${n}"><i>${n}</i>${esc(t)||' '}</span>`}).join('')+(b<L.length?`<span class="ln"><i>…</i>${L.length-b} more line(s)</span>`:'');
  const t=$('L'+tgt);if(t&&S.target)el.scrollTop=t.offsetTop-el.clientHeight/3}

// ---- log tracks: one track per curve, shared depth axis, min/max per pixel row
const RES=/^(RT|RD|ILD|ILM|LLD|LLS|MSFL|SFLU|SFL|RILD|RILM|AT\d0|RXO|RS|RM|RES.*)$/i;
function drawTracks(){const x=cur(),wrap=$('trk'),cv=$('cvT');if(!x||!cv)return;const l=x.las,nc=l.curves.length;
  const g0=cv.getContext('2d');
  if(nc<2||!l.data.length){cv.width=wrap.clientWidth;cv.height=60;g0.font='13px Inter,sans-serif';g0.fillStyle='#5c5a52';g0.fillText('No curve to show.',14,32);return}
  const tw=130,axis=62,head=44,Wd=Math.max(wrap.clientWidth,axis+(nc-1)*tw),H=520,dpr=devicePixelRatio||1;
  cv.style.width=Wd+'px';cv.width=Wd*dpr;cv.height=H*dpr;const g=g0;g.setTransform(dpr,0,0,dpr,0,0);g.fillStyle='#fff';g.fillRect(0,0,Wd,H);

  for(let k=0;k<=8;k++){const z=z0+(z1-z0)*k/8,y=Y(z);g.beginPath();g.moveTo(axis,y);g.lineTo(Wd,y);g.stroke();g.fillText(LAS.fmtN(+z.toPrecision(6)),axis-6,y+4)}

    g.strokeStyle='#c9c4b6';g.strokeRect(x0+.5,head+.5,tw2-1,H-head-B);
    g.fillStyle='#232220';g.textAlign='center';g.font='600 12px Inter,system-ui,sans-serif';g.fillText(c.mnem,x0+tw2/2,15);
    g.font='11px Inter,system-ui,sans-serif';g.fillStyle='#5c5a52';
    if(!v.length){g.fillText('all null',x0+tw2/2,30);sc.push(null);continue}
    const lg=RES.test(c.mnem)&&LAS.amin(v)>0,tx=lg?Math.log10:(y=>y);let lo=LAS.amin(v.map(tx)),hi=LAS.amax(v.map(tx));if(lo===hi){lo-=1;hi+=1}
    const fx=y=>x0+3+(tx(y)-lo)/(hi-lo)*(tw2-6);sc.push({lg,lo,hi});
    const lab=u=>lg?LAS.fmtN(+Math.pow(10,u).toPrecision(2)):LAS.fmtN(+u.toPrecision(3));
    g.textAlign='left';g.fillText(lab(lo),x0+3,30);g.textAlign='right';g.fillText(lab(hi),x0+tw2-3,30);g.textAlign='center';g.fillText((c.unit||'')+(lg?' log':''),x0+tw2/2,41);
    g.strokeStyle='#4a5a4e';g.lineWidth=1.1;g.beginPath();let pen=false;
    for(let i=0;i<rows.length;i+=px){let mn=Infinity,mx=-Infinity,ok=false;for(let k=i;k<Math.min(i+px,rows.length);k++){const y=rows[k][j];if(nul(y)||(lg&&y<=0))continue;ok=true;if(y<mn)mn=y;if(y>mx)mx=y}
      if(!ok){pen=false;continue}const yy=Y(rows[i][0]);if(!pen){g.moveTo(fx(mn),yy);pen=true}else g.lineTo(fx(mn),yy);if(mx!==mn)g.lineTo(fx(mx),yy)}

  // read-out under the pointer
  cv.onmousemove=e=>{const r=cv.getBoundingClientRect(),y=e.clientY-r.top;if(y<head){$('trkRo').textContent='Move over the tracks to read the values.';return}
    const z=z0+(y-head)/(H-head-B)*(z1-z0);let bi=0,bd=Infinity;for(let i=0;i<rows.length;i+=Math.max(1,px>>2)){const d=Math.abs(rows[i][0]-z);if(d<bd){bd=d;bi=i}}
    const rw=rows[bi];$('trkRo').textContent=`${l.curves[0].mnem} ${LAS.fmtN(rw[0])}  `+l.curves.slice(1).map((c,k)=>`${c.mnem} ${nul(rw[k+1])?'null':LAS.fmtN(+rw[k+1].toPrecision(5))}`).join('   ')};
  cv.onmouseleave=()=>{$('trkRo').textContent='Move over the tracks to read the values.'}}
addEventListener('resize',()=>{if(S.tab==='curves')drawTracks()});

// ---- exports
const fixedName=n=>n.replace(/(\.\w+)?$/,'_checked.las');
function exportOne(x){if(!x.las.sections.length){banner(`${x.name}: not a LAS file, nothing to write.`,true);return false}
  download(fixedName(x.name),encode(written(x).text,x.enc),'text/plain');return true}
$('bAll').onclick=async()=>{let n=0;for(const x of S.files){if(exportOne(x))n++;await new Promise(r=>setTimeout(r,350))}$('exportMsg').textContent=`Saved ${n} file(s)`};
$('bCsv').onclick=()=>{// cells starting with = + - @ are prefixed so a spreadsheet does not run them as formulas
  const q=s=>{s=String(s==null?'':s);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const L=['file,severity,line,rule,problem,details,correction,corrected_in_download'];
  for(const x of S.files)for(const f of x.f)L.push([x.name,GRP[f.sev],f.line||'',f.rule,T[f.rule]||'',f.msg,f.fix||'',f.fix&&S.fixes.has(f.fix)?'yes':''].map(q).join(','));
  for(const b of S.batch)L.push([b.file,GRP[b.sev],'',b.rule,T[b.rule]||'',b.msg,'',''].map(q).join(','));

// ---- example: two synthetic files of the same well (main log with deliberate defects, overlapping repeat)
function rng(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function synth(z0,n,seed,opt){const r=rng(seed),rows=[];

 WRAP.                   NO : ONE LINE PER DEPTH STEP
~Well Information
 STRT.M           ${o.strt} : START DEPTH
 STOP.M           ${o.stop} : STOP DEPTH
 STEP.M           ${o.step} : STEP
 NULL.            -999.2500 : NULL VALUE
 COMP.            EXAMPLE OPERATOR : COMPANY
 WELL.            EX-1 : WELL
 FLD .            SYNTHETIC FIELD : FIELD
 LOC .            BLOCK 1 : LOCATION
 CTRY.            NOWHERE : COUNTRY
 SRVC.            ${o.srvc} : SERVICE COMPANY
 DATE.            2025-03-14 : LOG DATE
 UWI .            ${o.uwi} : UNIQUE WELL ID
 X   .M           500000.0 : SURFACE X
 Y   .M           6500000.0 : SURFACE Y
 EKB .M           24.5 : KB ELEVATION
~Curve Information
 DEPT.M                     : MEASURED DEPTH
 GR  .GAPI                  : GAMMA RAY
 RHOB.G/C3                  : BULK DENSITY
 NPHI.V/V                   : NEUTRON POROSITY
 DT  .US/F                  : SONIC
 RT  .OHMM                  : DEEP RESISTIVITY
~Parameter Information
 BHT .DEGC        86.0 : BOTTOM HOLE TEMPERATURE${o.extra||''}
~A  DEPT        GR      RHOB      NPHI        DT        RT
${rows.join('\n')}
`}
function example(){
  const a=synth(1500,400,3,{pct:true});
  a[0].fill(-999.25,1);a[1].fill(-999.25,1);                    // all-NULL rows at the top

  a[260][1]=950;                                                 // spike

  S.files=[];S.sel=0;addText('EX-1_main.las',t1,'utf-8');addText('EX-1_repeat.las',t2,'utf-8');refresh();
  banner('Example: two synthetic files of the same well, the first with deliberate defects.')}
$('bExample').onclick=example;

document.querySelectorAll('.panel h2').forEach(h=>h.addEventListener('click',e=>{if(e.target.closest('.tt'))return;h.parentElement.classList.toggle('collapsed')}));

window.DG={S,refresh,addText};
</script>

({"what": "Runs entirely in your browser: the files are read in memory and never uploaded. Quality control of transmitted LAS well log files before loading them in an interpretation package: a file that follows the LAS conventions passes with nothing to do; otherwise every problem is listed with its line, and the mechanical ones can be fixed in a downloaded copy.", "method": ["Parsing: sections start with “~”; header lines are split as MNEM.UNIT VALUE : DESCRIPTION — the mnemonic ends at the first dot, the unit at the first space after it, the description starts at the first colon preceded by a space (so hh:mm units and 23:15 values survive), otherwise at the last colon. LAS 1.2 ~W layout (value after the colon) is detected.", "Data: whitespace-separated values; wrapped files (WRAP YES) are read record by record (index alone on its line, then values until the curve count is reached).", "Checks, by severity: E = import fails or data is wrong (missing sections, unreadable lines, STRT/STOP/STEP/NULL missing, empty WELL, curve count ≠ data columns, truncated rows, non-numeric or glued values, index not monotonic); W = non-conforming, imports with risk (BOM, tabs, non-ASCII, missing dot or colon, duplicate mnemonics, STRT/STOP/STEP inconsistent with the data, unit mismatch, wrapped data, comments in ~A, other null markers); I = worth a look (no coordinates or KB, LAS 3.0, implausible ranges, spikes, all-NULL or constant curves).", "Plausibility ranges (report only): GR 0–1000 GAPI; RHOB 1.0–3.2 g/cm³; NPHI −0.15–1 V/V or −15–100 %; DT 40–200 µs/ft or 130–650 µs/m; caliper 0–40; resistivity > 0. Spike: isolated jump of more than 10 robust σ (MAD) of the sample-to-sample change, on curves of ≥ 20 samples.", "Batch (several files): same WELL with different UWI or the reverse, overlapping depth ranges on the same curve for one well (duplicate runs), mixed depth units, same mnemonic with different units.", "Fixes, applied to the downloaded copy only: byte-order mark, line endings, tabs, malformed header lines, unwrap, LAS 2.0 version and ~W layout, STRT/STOP from the first/last index, STEP from the data (0 if irregular), all-NULL rows at the top/bottom. Replacing other null markers by the declared NULL changes values and is off by default. Number text is copied as is, never reformatted."], "sources": [["LAS 2.0 structure: ~V first, ~W, ~C, ~A last; ~P, ~O optional; numeric data; space separators", "Kansas Geological Survey, LAS 2.0/3.0 reader help (kgs.ku.edu)", "published"], ["Header line syntax, colons in values, dotted units, missing dot, duplicate mnemonics", "lasio documentation, header section (lasio.readthedocs.io)", "published"], ["Glued (run-on) values, other null markers seen in practice, non-numeric tokens", "lasio documentation, data section", "published"], ["Importer behaviour: wrapped files rejected, WELL falls back to file name, X/Y and KB mnemonics", "VRGS LAS well log import guide (docs.vrgeoscience.com)", "published"], ["LAS 2.0 standard itself (mandatory ~W items, wrap line length of 80 characters)", "Canadian Well Logging Society, LAS 2.0 (cwls.org); the PDF was not read", "memory"], ["Plausibility ranges, spike rule, batch checks", "Standard log QC practice; thresholds are the author's", "memory"]], "validation": ["Self-check script (scripts/las_check_test.mjs): one clean LAS 2.0 file with no error or warning, one broken variant per rule, wrapped reading, and round trips of the writer (each fix resolves its findings; values unchanged unless the null fix is ticked; no fix = identical file)."], "limits": ["LAS 3.0: version detected, typed sections and Definition/Data pairs not validated.", "Units and mnemonics are not checked against a dictionary; plausibility ranges cover only the common curves.", "Encoding: UTF-8, otherwise read as Windows-1252 and written back the same way.", "Corrected files are written unwrapped LAS 2.0 with CRLF line endings; ~O and comments are copied as they are."], "date": "24 November 2026"}
