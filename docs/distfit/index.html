<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Distribution fitting</title>
<link rel="canonical" href="https://RomainGiboreau.github.io/My_Website/distfit/">
<meta name="description" content="Fit and rank probability distributions on a one-dimensional dataset (field sizes, porosity, net/gross, recovery factors, costs): normal, lognormal, gamma, Weibull, exponential, uniform, logistic, Gumbel, Pareto, beta, triangular. Maximum likelihood, KS, Anderson-Darling, AIC and BIC, Q-Q and exceedance plots, manual fit, P90/P50/P10 export. Runs in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eeece6;--card:#f5f3ed;--alt:#e2ded3;--fg:#232220;--mut:#5c5a52;--line:#c9c4b6;--acc:#4a5a4e;--acc2:#a8623a}
html{color-scheme:light only}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:"Space Grotesk",Inter,sans-serif;margin:0}
.top{background:var(--acc);color:#f5f3ed;display:flex;gap:6px 24px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:12px 18px}
.top h1{font-size:1.15rem;font-weight:700}
.top a{color:#f5f3ed;opacity:.88;font-size:.85rem;text-decoration:none;border-bottom:1px solid rgba(245,243,237,.45)}
.top .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top .bar select,.top .bar button{padding:.2rem .5rem;font-size:.8rem}
.top .bar button.pri{background:#f5f3ed;color:var(--acc);border-color:#f5f3ed}
.top .bar .msg{color:#f5f3ed;opacity:.9;min-height:0;font-size:.78rem}
.layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;padding:14px 16px 32px}
.side{display:flex;flex-direction:column;gap:12px;min-width:0;position:sticky;top:8px;align-self:start;max-height:calc(100vh - 16px);overflow-y:auto;padding-right:2px;overflow-x:hidden}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}.side{position:static;max-height:none}}
main{min-width:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.panel h2{font-size:.95rem;font-weight:600;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.panel h2 .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--acc);color:#f5f3ed;font-size:.72rem}
.panel h2 .tt{margin-left:auto}
.panel h2 .chev{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--mut);transition:transform .15s}
.panel.collapsed h2 .chev{transform:rotate(-90deg)}
.panel .body{margin-top:8px}.panel.collapsed .body{display:none}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
button,select,input[type=text],input[type=number],textarea{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:4px;padding:.3rem .55rem}
textarea{width:100%;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:.78rem;min-height:96px}
button{cursor:pointer;background:var(--card)}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#f5f3ed}
button.on{background:var(--alt);border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
button:disabled{opacity:.5;cursor:default}
input[type=range]{width:100%;accent-color:var(--acc)}
.msg{font-size:.8rem;color:var(--mut);min-height:1.2em}.msg.err{color:var(--acc2)}
.hint{color:var(--mut);font-size:.78rem}
label.inl{display:flex;gap:6px;align-items:center;font-size:.82rem}
.tt{position:relative;display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--mut);font:600 .68rem Inter,sans-serif;cursor:help;flex:none}
.tt:hover,.tt:focus{border-color:var(--acc);color:var(--acc);outline:none}
.tt::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);right:-6px;width:280px;padding:8px 10px;background:var(--fg);color:#f5f3ed;border-radius:6px;font:400 .76rem/1.4 Inter,sans-serif;text-align:left;white-space:normal;box-shadow:0 4px 14px rgba(0,0,0,.22);z-index:20;opacity:0;visibility:hidden;transition:opacity .12s;pointer-events:none}
.tt:hover::after,.tt:focus::after{opacity:1;visibility:visible}
@media (min-width:901px){.tt.tt-r::after{right:auto;left:-6px}}
.top .tt{background:transparent;border-color:rgba(245,243,237,.55);color:#f5f3ed}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.tile small{display:block;color:var(--mut);font-size:.74rem}
.tile b{font:700 1.3rem "Space Grotesk",Inter,sans-serif;font-variant-numeric:tabular-nums}
.tile.key{border-left:6px solid var(--acc)}.tile.key2{border-left:6px solid var(--acc2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;overflow:hidden;min-width:0;margin-bottom:12px}
.card h3{font-size:.9rem;font-weight:600;margin:0 0 6px;display:flex;align-items:center;gap:8px}
.card h3 .sp{margin-left:auto;display:flex;gap:4px;align-items:center}
.card h3 button{padding:.05rem .45rem;font-size:.72rem}
.card h3 .tt{margin-left:auto}.card h3 .sp+.tt,.card h3 .tt:nth-last-child(1){margin-left:auto}
.card canvas{display:block;width:100%;height:300px;background:#fff;border:1px solid var(--line);border-radius:6px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:1100px){.two{grid-template-columns:minmax(0,1fr)}}
.tw{overflow:auto;border:1px solid var(--line);border-radius:6px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.8rem;font-variant-numeric:tabular-nums}
th,td{padding:3px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:#d6d1c2;font-family:"Space Grotesk",Inter,sans-serif;font-weight:600}
td.l,th.l{text-align:left}td.pc{white-space:normal;min-width:150px;max-width:260px}
table.rk tbody tr{cursor:pointer}table.rk tbody tr:hover{background:rgba(74,90,78,.08)}table.rk tbody tr.sel{background:rgba(74,90,78,.18)}
table.rk td.best{font-weight:700;color:var(--acc)}
table.rk tr.skip{color:var(--mut);cursor:default}table.rk tr.skip:hover{background:none}
.sw{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.prm{display:grid;grid-template-columns:78px minmax(0,1fr) 84px;gap:4px 8px;align-items:center;font-size:.8rem;margin:6px 0}
.prm input[type=number]{width:100%;padding:.15rem .3rem}
.mst{overflow-wrap:anywhere;font-size:.78rem;color:var(--mut);line-height:1.5;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:0}.seg button{border-radius:0;margin-left:-1px;flex:1}.seg button:first-child{border-radius:4px 0 0 4px;margin-left:0}.seg button:last-child{border-radius:0 4px 4px 0}
.pt tr.hl td{font-weight:700;background:rgba(168,98,58,.12)}
.warn{color:var(--acc2)}
.empty{padding:50px 16px;text-align:center;color:var(--mut)}

</head><body>
<div class="top"><h1>Distribution fitting</h1>
 <div class="bar"><span style="opacity:.85;font-size:.8rem">Data</span>
  <select id="exSel" aria-label="Example"><option value="">Example…</option><option value="fields">Field sizes (fictitious)</option><option value="poro">Porosity (fictitious)</option><option value="cost">Well costs (fictitious)</option></select>
  <button id="bCsv" title="Ranking of the fitted distributions as CSV">Ranking CSV</button>
  <button class="pri" id="bPros" title="Download a Prospect risking file whose direct volumes are the P90 / P50 / P10 of the selected fit (exceedance convention, P90 = low case)">Save as prospect volumes</button>
  <span class="msg" id="msg"></span>
  <span class="tt" tabindex="0" data-tip="Everything runs locally in your browser. Paste or open a one-dimensional sample, the page fits eleven distributions by maximum likelihood, ranks them by AIC (with BIC, Kolmogorov-Smirnov and Anderson-Darling shown) and draws the checks. Click a row of the ranking to select a fit; the manual fit lets you move the parameters yourself.">?</span>
 <a href="https://romaingiboreau.github.io/My_Website/">← Back to site</a></div></div>
<div class="layout">
<aside class="side">
 <section class="panel"><h2><span class="n">1</span>Data<span class="tt tt-r" tabindex="0" data-tip="Paste numbers separated by commas, spaces, tabs or new lines, or open a text / CSV file. A table with a header gives a choice of column; with a semicolon or tab separator a decimal comma is accepted. Lines starting with # are ignored. Non-numeric entries are skipped and counted.">?</span><i class="chev"></i></h2>
  <div class="body"><textarea id="txt" spellcheck="false" placeholder="Paste values here (comma, space, tab or newline separated)"></textarea>
   <div class="row"><button class="pri" id="bUse">Use data</button><button id="bOpen">Open file…</button><input type="file" id="ffile" accept=".csv,.txt,.tsv,.dat,text/plain,text/csv" hidden></div>
   <div class="row" id="colRow" style="display:none"><span style="font-size:.82rem">Column</span><select id="colSel" style="flex:1;min-width:0"></select></div>
   <div class="msg" id="dMsg"></div></div></section>
 <section class="panel"><h2><span class="n">2</span>Display<span class="tt tt-r" tabindex="0" data-tip="Convention for P90 / P50 / P10 and the percentile table. Exceedance (used on this site): P90 = value exceeded with 90 % probability = low case, so P90 &lt; P50 &lt; P10. Cumulative: P90 = 90th percentile. The file saved for the Prospect risking tool always uses the exceedance convention.">?</span><i class="chev"></i></h2>
  <div class="body"><div class="seg"><button id="convE" class="on" title="P90 = low case: 90 % chance to exceed">P90 = low (exceedance)</button><button id="convC" title="P90 = 90th percentile of the distribution">P90 = high (cumulative)</button></div>
   <div class="row"><label class="inl"><input type="checkbox" id="hlog"> Histogram on a log x axis</label></div>
   <div class="row"><label class="inl"><input type="checkbox" id="allc" checked> Show all fitted curves</label></div></div></section>
 <section class="panel"><h2><span class="n">3</span>Manual fit<span class="tt tt-r" tabindex="0" data-tip="Move the parameters of the selected distribution yourself: the charts, the percentile table and the KS / AD / AIC below follow live. Reset returns to the maximum-likelihood values. Untick to go back to the ML fit.">?</span><i class="chev"></i></h2>
  <div class="body"><div class="row"><label class="inl"><input type="checkbox" id="man"> Use manual parameters for</label><b id="manName" style="font-size:.85rem"></b></div>
   <div id="prm"></div><div class="row"><button id="bReset">Reset to ML fit</button></div><div class="mst" id="mst"></div></div></section>
</aside>
<main>
 <div class="tiles" id="tiles"></div>
 <div class="card"><h3>Ranking<span class="tt" tabindex="0" data-tip="Distributions fitted by maximum likelihood, best AIC first. k = number of fitted parameters; ΔAIC = AIC − best AIC; w = Akaike weight (relative support among the listed models); KS D and approximate p; AD A² (smaller is better for D and A²). The KS p-value is optimistic-conservative because the parameters were estimated from the same data: use it to flag poor fits, not to certify good ones. Bold = best in column. Click a row to select it.">?</span></h3>
  <div class="tw"><table class="rk" id="rk"></table></div><div class="hint" id="skipN" style="margin-top:6px"></div></div>
 <div class="two">
  <div class="card"><h3>Histogram and fitted densities<span class="tt" tabindex="0" data-tip="Density histogram of the data with the fitted pdfs. The selected fit is the thick line; with the log axis the bins are equal in ln x and the curves are densities of ln x.">?</span></h3><canvas id="cvH"></canvas></div>
  <div class="card"><h3>Exceedance curve<span class="tt" tabindex="0" data-tip="P(X &gt; x) against x (log axis when all values are positive): dots are the data at plotting positions 1 − (i − 0.5) / n, lines are the fitted survival functions 1 − F(x). Dashed lines mark 90 %, 50 % and 10 % exceedance.">?</span></h3><canvas id="cvE"></canvas></div>
 </div>
 <div class="two">
  <div class="card"><h3>Probability plot<span class="sp"><button id="qq" class="on">Q-Q</button><button id="pp">P-P</button></span><span class="tt" tabindex="0" data-tip="Q-Q: data quantiles against the quantiles of the selected fit at (i − 0.5) / n; points on the diagonal mean a good fit, a curved tail shows a wrong tail. P-P: fitted cdf at each observation against (i − 0.5) / n.">?</span></h3><canvas id="cvQ"></canvas></div>
  <div class="card"><h3>CDF difference<span class="tt" tabindex="0" data-tip="Empirical cdf minus fitted cdf (both sides of each step). The dashed lines are ± the Kolmogorov-Smirnov statistic D of the selected fit.">?</span></h3><canvas id="cvD"></canvas></div>
 </div>
 <div class="card"><h3 id="selT">Selected fit</h3><div class="two"><div class="tw"><table class="pt" id="pt"></table></div><div id="selP" class="mst" style="padding:4px 6px"></div></div></div>
</main></div>

({"what":"Runs entirely in your browser: nothing you enter leaves your machine. Fits eleven probability distributions to a one-dimensional sample (field or analogue volumes, porosity, net/gross, recovery factors, costs) by maximum likelihood, ranks them by AIC with BIC, Kolmogorov–Smirnov and Anderson–Darling shown, and draws the checks (histogram with fitted densities, exceedance curve on a log axis, Q-Q and P-P plots, cdf difference). The parameters can also be moved by hand, and the selected fit gives a percentile table and a Prospect risking file with its P90 / P50 / P10 as direct volumes.","method":["<b>Distributions and parameters.</b> Normal (μ, σ), lognormal (μ, σ of ln x), gamma (shape k, scale θ), Weibull (shape k, scale λ), exponential (mean θ), uniform (a, b), logistic (μ, s), Gumbel for maxima (μ, β), Pareto type I (xm, α), beta (a, b, with lower and upper bounds) and triangular (a, mode c, b). A distribution whose support does not contain all the data is not fitted and the reason is shown (lognormal, gamma, Weibull and Pareto need strictly positive values, exponential non-negative ones).","<b>Maximum likelihood.</b> Closed form: normal (σ with divisor n), lognormal (same on ln x), exponential (θ = mean), uniform (a = min, b = max), Pareto (xm = min, α = n / Σ ln(x / xm)). Gamma: the shape k solves ln k − ψ(k) = ln(mean) − mean(ln x) = s by Newton iteration from the start k0 = (3 − s + √((s − 3)² + 24 s)) / (12 s), then θ = mean / k. Weibull: k solves Σ x<sup>k</sup> ln x / Σ x<sup>k</sup> − 1/k − mean(ln x) = 0 (monotone in k, bisection on ln k, data scaled by the maximum), then λ = (mean x<sup>k</sup>)<sup>1/k</sup>. Logistic: the scores Σ tanh(z/2) = 0 and mean(z tanh(z/2)) = 1, z = (x − μ)/s, solved by nested bisection (μ inside, s outside). Gumbel: β solves β = mean − Σ x e<sup>−x/β</sup> / Σ e<sup>−x/β</sup> by bisection, then μ = −β ln mean(e<sup>−x/β</sup>). Beta: with the bounds fixed at min − r/(n − 1) and max + r/(n − 1) (r = range, the usual unbiased widening of the sample range), a and b solve ψ(a) − ψ(a + b) = mean ln u and ψ(b) − ψ(a + b) = mean ln(1 − u) by damped two-dimensional Newton with the trigamma Jacobian. Triangular: same widened bounds, mode c = 3 × mean − a − b clamped to [a, b] (method of moments, keeps the mean).","<b>Number of parameters (AIC, BIC).</b> k = 2 for most, 1 for the exponential, 3 for the triangular (a, c, b) and 4 for the beta (a, b and the two bounds, which are estimated from the data).","<b>Goodness of fit.</b> Kolmogorov–Smirnov D = max(max<sub>i</sub> (i/n − F(x<sub>i</sub>)), max<sub>i</sub> (F(x<sub>i</sub>) − (i − 1)/n)) with the asymptotic p-value 2 Σ (−1)<sup>j−1</sup> exp(−2 j² λ²), λ = (√n + 0.12 + 0.11/√n) D. Anderson–Darling A² = −n − (1/n) Σ (2i − 1)[ln F(x<sub>i</sub>) + ln(1 − F(x<sub>n+1−i</sub>))]. Log-likelihood, AIC = 2k − 2 ln L, BIC = k ln n − 2 ln L. The ranking is by AIC; ΔAIC and the Akaike weights w = exp(−ΔAIC/2) / Σ exp(−ΔAIC/2) are shown.","<b>Special functions</b> implemented in the page: log-gamma (Lanczos), regularised incomplete gamma (series and continued fraction), regularised incomplete beta (continued fraction), digamma and trigamma (recurrence and asymptotic series), normal cdf through the incomplete gamma, normal quantile (rational approximation refined by Newton steps). Gamma and beta quantiles are found by bisection on the cdf.","<b>Percentiles.</b> Exceedance convention used on this site: P90 is the value exceeded with 90 % probability (low case), so P90 &lt; P50 &lt; P10; the toggle switches to the cumulative convention (P90 = 90th percentile). Sample percentiles use linear interpolation between order statistics (type 7). The mode shown for the data is the maximum of a Gaussian kernel density (bandwidth 0.9 min(σ, IQR/1.34) n<sup>−1/5</sup>): a rough estimate, unreliable on small or strongly skewed samples. Skewness and excess kurtosis are the moment coefficients.","<b>Plots.</b> Plotting position (i − 0.5)/n for the Q-Q and P-P plots and for the empirical exceedance. The histogram has ⌈√n⌉ bins (5 to 40); on the log axis the bins are equal in ln x and the curves are the densities of ln x.","<b>Manual fit.</b> The parameters of the selected distribution can be set by hand; the charts, the percentile table and KS, AD, log L, AIC and BIC are recomputed for those parameters and compared with the ML fit.","<b>Prospect file.</b> “Save as prospect volumes” writes a <code>prospect-risk</code> file with the default six risk elements and economics of the Prospect risking tool and <code>vol = {mode: \"direct\", p90, p50, p10}</code> from the selected fit (P90 = quantile 10 %, P50 = median, P10 = quantile 90 %, five significant digits); it can be opened in that tool. It is refused if the fit gives non-positive volumes."],"sources":[["Probability density, cdf and quantile formulas of the eleven distributions","Standard results, e.g. Johnson, Kotz &amp; Balakrishnan, Continuous Univariate Distributions (as commonly cited; not re-read for this page)","classical (not re-read)"],["Maximum-likelihood equations (gamma, Weibull, logistic, Gumbel, beta, Pareto)","Derived from the log-likelihood and solved numerically; the recovered parameters on large seeded samples are checked in the test of the page","derived"],["Lanczos log-gamma, incomplete gamma and beta functions, digamma, trigamma","Standard numerical methods (Press et al., Numerical Recipes; Lanczos 1964; as commonly cited, not re-read); values checked against closed forms in the test","classical (not re-read)"],["Normal quantile approximation","Rational approximation (Acklam), coefficients typed from memory and refined with Newton steps on the exact cdf, so the result does not depend on their accuracy; checked against known values","derived"],["Kolmogorov–Smirnov statistic and asymptotic p-value","Kolmogorov (1933), Smirnov (1948); the finite-n correction √n + 0.12 + 0.11/√n is Stephens' (as commonly cited; not re-read). With parameters estimated from the same data the test is conservative (Lilliefors)","classical (not re-read)"],["Anderson–Darling statistic","Anderson &amp; Darling (1952); the statistic only, no p-value (its critical values depend on the distribution and on which parameters are estimated)","classical (not re-read)"],["AIC, BIC, Akaike weights","Akaike (1974), Schwarz (1978); Burnham &amp; Anderson, Model Selection and Multimodel Inference (as commonly cited; not re-read)","classical (not re-read)"],["Use of lognormal, Pareto, gamma and Weibull for field sizes, volumes and costs","Common practice in exploration and risk analysis; no specific reference is claimed here, and which family is appropriate depends on the play and the data","classical (not re-read)"],["Beta and triangular bounds widened by range/(n − 1)","Unbiased bound estimator for a uniform sample; adopted here so that the density does not vanish at the extreme observations","derived"],["P90 / P50 / P10 exceedance convention and the prospect file layout","Same as the Prospect risking tool of this site","on the page"],["Example data sets","Fictitious, generated from seeded random numbers, for illustration only","on the page"]],"validation":["Special functions agree with closed forms and known values; quantile(cdf(x)) = x to 1e-6 and the numerical derivative of the cdf equals the pdf for every distribution. On large seeded synthetic samples (n = 20 000, logistic 8 000, generated with independent samplers) the maximum-likelihood parameters of each family are recovered within 3 % (1 % of the range for the uniform bounds, 4 % for the beta). The KS statistic is below 0.015 for a sample from the fitted family and above 0.1 for a normal fit to a lognormal sample; AIC ranks the true family first for lognormal, normal and Weibull samples (and the lognormal above normal and uniform by more than 100 AIC units); P90 &lt; P50 &lt; P10 for every fit; the Pareto and the beta fits recover known samples (the beta shapes are invariant to a change of scale). The prospect file equals the Prospect risking defaults apart from the three volumes and runs in that tool's calculation core. Run <code>node scripts/distfit_test.mjs</code>."],"limits":["Not implemented: censored or truncated data, mixtures, weighted samples, bootstrap confidence intervals on the parameters or on the ranking, Bayesian fits, dependence between observations.","AIC says which of the listed families is closest to the data, not that any of them is true; differences below about 2 AIC units are not meaningful, and with few points (say n &lt; 20) several families are indistinguishable. Extrapolating to P99 or P1 beyond the data is driven by the assumed tail.","The KS p-value is the asymptotic one for a fully specified distribution, so with estimated parameters it is too large (conservative); there is no p-value for the Anderson–Darling statistic.","The beta and triangular bounds come from the sample range: when the true distribution has a thin tail near its bounds the sample extremes are inside them and the shapes are biased (for example a Beta(2, 5) on [0, 1] fitted this way gives b near 4). The triangular mode is a moment estimate, not a likelihood maximum.","The Pareto type I has its minimum at the smallest observation: it describes the tail above that value only, and its mean is infinite for α ≤ 1. A Pareto fitted to a whole field-size sample is usually a poor fit below the mode; truncated or censored fits, as used for creaming curves, are not implemented.","Large samples: the logistic and Gumbel fits use nested bisection and take noticeable time beyond a few tens of thousands of points."],"date":"26 November 2026"});
