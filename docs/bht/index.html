<div class="top"><h1>BHT correction (Horner)</h1>
 <div class="bar"><span style="opacity:.85;font-size:.8rem">Export</span>
  <button class="pri" id="bCsv" title="One line per depth: Horner extrapolated formation temperature, 95 % interval, sensitivity to the circulation time">Results CSV</button>
  <button id="bPng">PNG</button><span class="msg" id="exportMsg"></span>
  <span class="tt" tabindex="0" data-tip="Everything runs locally in your browser. Horner method (line source in an infinite medium): after circulation stops, the temperature measured at the bottom of the hole at time Δt is T(Δt) = T_f − m·ln((t_c + Δt)/Δt), where t_c is the circulation time and T_f the undisturbed formation temperature, reached when Δt → ∞, i.e. when ln((t_c + Δt)/Δt) → 0. A linear regression of T on this ratio therefore gives T_f as the intercept. It needs at least two logging runs at the same depth with different Δt (three to get an uncertainty). This is a physical extrapolation, not an empirical correction: it assumes pure conduction, no fluid flow and a known t_c. With a single run there is nothing to extrapolate; The “last resort” column is the simplest empirical correction, T<sub>eq</sub> = mean BHT + 33 °F (18.3 °C), the median of T<sub>eq</sub> − BHT in 983 DST/BHT pairs (Corrigan 1997 memo, as reported by ZetaWare; stated uncertainty on T<sub>eq</sub> ±17 °F = ±9 °C, 1σ not specified on the ZetaWare last-resort page). The same source gives about 8 °C (1σ) for a Horner correction made from ≥ 3 consistent runs. Waples et al. (2004, Petroleum Geoscience 10, 239–245; Gulf of Campeche, 3500–6500 m): T_true = T_surf + f·(T_meas − T_surf) − 0.001391·(Z − 4498), f = 1.32866·exp(−0.005289·TSC), TSC (h) taken equal to Δt of each run, averaged per depth; f and its uncertainty σ(f) = 0.10842·exp(−0.029·TSC) are those printed in the abstract of the paper (the paper itself was not read); the column ± 2σ(f) is the half-width (°C) from the uncertainty of f alone, 2σ(f)·(T_meas − T_surf), averaged over the runs of a depth. It does not include the scatter of the calibration. A regression of Fig. 3, 1.3433·exp(−0.0059·TSC), is quoted in a second-hand summary and differs slightly. The ZetaWare time-since-circulation correction is not included: its equation is only in a figure.">?</span></div>
 <a href="https://romaingiboreau.github.io/My_Website/">← Back to site</a></div>

<aside class="side">
 <section class="panel"><h2><span class="n">1</span>Data<i class="chev"></i></h2>
  <div class="body"><textarea id="paste" rows="6" placeholder="Depth&#9;Dt&#9;T&#10;2000&#9;6&#9;68.2&#10;2000&#9;12&#9;70.1&#10;…" spellcheck="false"></textarea>
  <input type="file" id="file" accept=".csv,.txt,.tsv,.dat,text/*" hidden>

  <div class="pg"><span>Depth</span><select id="cz"></select><span>Δt</span><select id="cd"></select><span>BHT</span><select id="cT"></select><span>t<sub>c</sub></span><select id="cc"></select></div>
  <div class="msg" id="dataMsg">No data yet.</div></div></section>
 <section class="panel"><h2><span class="n">2</span>Units and parameters<span class="tt" tabindex="0" data-tip="Δt: time since the end of mud circulation at the moment of the measurement. t_c: circulation time before that; if your table has no t_c column, the value below is used for all points (a typical value is a few hours, but it is the main source of uncertainty: see the sensitivity table). Surface temperature is used only for the geothermal gradient fit.">?</span><i class="chev"></i></h2>
  <div class="body"><div class="pg"><span>Time</span><select id="tu"><option value="1">hours</option><option value="0.0166667">minutes</option></select>
  <span>Depth</span><select id="zu"><option value="1">m</option><option value="0.3048">ft</option></select>
  <span>Temp.</span><select id="Tu"><option value="C">°C</option><option value="F">°F</option></select>
  <span>Default t<sub>c</sub></span><input id="tc0" value="6">
  <span>T surface (°C)</span><input id="T0" value="15"></div>
  <div class="pg"><span>Gradient from</span><select id="gsrc"><option value="h">Horner T<sub>f</sub></option><option value="lr">last resort</option><option value="wp">Waples et al. 2004</option></select><span>Gradient fit</span><select id="gmode"><option value="free">free intercept</option><option value="fix">through T surface</option></select></div>
  <div class="msg" id="runMsg"></div></div></section>
</aside>
<main>
 <div class="legend" id="legend"></div>
 <div class="cards">
  <div class="card"><h3>Horner plot<span class="sp"></span><button data-png="c1">PNG</button></h3><canvas id="c1" style="position:static;height:380px"></canvas></div>
  <div class="card"><h3>Formation temperature vs depth<span class="sp"></span><button data-png="c2">PNG</button></h3><canvas id="c2" style="position:static;height:380px"></canvas></div>
 </div>
 <div class="card" style="margin-top:12px"><h3>Results<span class="tt" tabindex="0" data-tip="T_f: extrapolated undisturbed temperature (intercept) with its 95 % Student-t interval (needs ≥ 3 runs at that depth). Correction = T_f minus the temperature of the latest run (longest Δt). Last resort = mean BHT of the depth + 18.3 °C. m: slope of the Horner line in °C per ln unit. The last three columns give T_f if the true circulation time were 0.5×, 1× or 2× the one used.">?</span></h3><div class="tw" id="resT"></div>
  <div class="msg" id="gradMsg" style="margin:8px 4px 2px"></div></div>
</main></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toN=s=>{if(typeof s==='number')return s;s=String(s==null?'':s).trim().replace(/\s/g,'');if(s===''||/^(nan|na|n\/a|nd|null|-+)$/i.test(s))return NaN;
  if(/^[-+]?\d{1,3}(\.\d{3})+,\d+$/.test(s))s=s.replace(/\./g,'').replace(',','.');else if(s.includes(',')&&!s.includes('.'))s=s.replace(',','.');
  return /^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(s)?+s:NaN};
const fmt=v=>!isFinite(v)?'–':(Math.abs(v)>=1e5||(Math.abs(v)<1e-3&&v!==0))?v.toExponential(2):String(+v.toPrecision(5));
const f3=v=>isFinite(v)?String(+v.toFixed(3)):'';
function rng(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
let banT=null;function banner(m,err){let b=$('banner');if(!b){b=document.createElement('div');b.id='banner';document.body.appendChild(b);b.style.cssText='position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:60;pointer-events:none;border-radius:6px;padding:7px 14px;font-size:.84rem;box-shadow:0 4px 14px rgba(0,0,0,.25);color:#f5f3ed;max-width:80%'}
  b.textContent=m;b.style.background=err?'#a8623a':'#232220';b.style.display='block';clearTimeout(banT);banT=setTimeout(()=>{b.style.display='none'},err?9000:3500)}
function download(name,text,mime){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime||'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function copyText(t,ok){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>banner(ok||'Copied.'),()=>fallbackCopy(t,ok));else fallbackCopy(t,ok)}
function fallbackCopy(t,ok){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');banner(ok||'Copied.')}catch(e){banner('Copy failed.',true)}a.remove()}
const csvCell=(v,sep)=>{v=v==null?'':String(v);return(v.includes(sep)||v.includes('"')||v.includes('\n'))?'"'+v.replace(/"/g,'""')+'"':v};
document.querySelectorAll('.panel>h2').forEach(h=>h.addEventListener('click',e=>{if(e.target.closest('.tt'))return;h.parentElement.classList.toggle('collapsed')}));
// ---- table parsing (tab, ;, , or whitespace separated; optional header and units row)
function parseTable(text,minCols){
  const lines=text.replace(/\r/g,'').split('\n').map(l=>l.replace(/\s+$/,'')).filter(l=>l.trim()&&!/^(#|\/\/)/.test(l.trim()));if(!lines.length)return{err:'Empty input.'};
  const has=c=>lines.some(l=>l.includes(c));let sep;
  if(has('\t'))sep='\t';else if(has(';'))sep=';';else if(lines.every(l=>l.split(',').length>=(minCols||2)))sep=',';else sep=/\s+/;
  const split=l=>{if(sep===','||sep===';'){const o=[];let c='',q=false;for(const ch of l){if(ch==='"')q=!q;else if(ch===sep&&!q){o.push(c);c=''}else c+=ch}o.push(c);return o.map(s=>s.trim())}return l.split(sep).map(s=>s.trim().replace(/^"|"$/g,''))};
  let rows=lines.map(split);const nc=Math.max(...rows.map(r=>r.length));if(nc<(minCols||2))return{err:`At least ${minCols||2} columns are needed.`};
  const numFrac=r=>r.filter(s=>s!==''&&isFinite(toN(s))).length/Math.max(1,r.filter(s=>s!=='').length);
  let head=null,units=null;if(numFrac(rows[0])<0.5){head=rows.shift();if(rows.length&&numFrac(rows[0])<0.34&&rows.length>1&&rows[0].every(s=>s===''||isNaN(toN(s)))){units=rows.shift()}}
  if(!head)head=Array.from({length:nc},(_,i)=>'col '+(i+1));while(head.length<nc)head.push('col '+(head.length+1));
  rows=rows.map(r=>{while(r.length<nc)r.push('');return r});
  return{head,units,rows,nc,sep:sep===/\s+/?' ':sep}}
const normName=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
// ---- plotting engine ----------------------------------------------------------------

const TT={1:12.706,2:4.303,3:3.182,4:2.776,5:2.571,6:2.447,7:2.365,8:2.306,9:2.262,10:2.228,12:2.179,15:2.131,20:2.086,30:2.042,120:1.980};

// The paper itself was not read. Only the uncertainty of f is propagated (half-width = 2 sigma(f) * (Tmeas - Tsurf), degC); the scatter of the calibration in depth is not.
