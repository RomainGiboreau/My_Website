<div class="top"><h1>Field development screening</h1>
 <div class="bar"><span style="opacity:.85;font-size:.8rem">File</span>
  <button class="pri" id="bSave" title="The whole case in one JSON file">Save case</button>
  <button id="bLoad">Open</button><input type="file" id="jfile" accept=".json,application/json" hidden>
  <button id="bCsv" title="Annual profile and cash flow as CSV">Annual CSV</button>
  <select id="exSel" aria-label="Example"><option value="">Example…</option><option value="oil">Offshore oil field</option><option value="small">Small field (marginal)</option></select>
  <span class="msg" id="msg"></span>
  <span class="tt" tabindex="0" data-tip="Everything runs locally in your browser. A screening model, not a reservoir or facilities study: the field profile is a plateau followed by an Arps decline whose rate is solved so that the field produces exactly the reserves; costs are phased before first oil; royalty and tax with loss carry-forward; monthly discounting in real terms.">?</span>
 <a href="https://romaingiboreau.github.io/My_Website/">← Back to site</a></div></div>
<div class="layout">
<aside class="side">
 <section class="panel"><h2><span class="n">1</span>Reserves and production<span class="tt tt-r" tabindex="0" data-tip="Recoverable reserves (EUR) in MMboe. Plateau rate target in kboe/d; the wells set the capacity: plateau = min(target, wells × initial rate per well). The plateau lasts until the chosen fraction of the reserves is produced, then the rate declines (Arps, exponent b: 0 exponential, 1 harmonic) down to the economic limit; the decline rate is solved so that the total equals the reserves. Ramp-up: linear rise to the plateau after first oil.">?</span><i class="chev"></i></h2>
  <div class="body" id="pRes"></div></section>
 <section class="panel"><h2><span class="n">2</span>Costs<span class="tt tt-r" tabindex="0" data-tip="Capex = facilities (fixed) + wells × cost per well, phased over the years before first oil: the phasing list gives the % per year (its length is the number of years from FID to first oil). Opex = fixed $MM/yr while producing + variable $/boe. Abandonment (ABEX) is spent in the last producing month. Real terms (no inflation).">?</span><i class="chev"></i></h2>
  <div class="body" id="pCost"></div></section>
 <section class="panel"><h2><span class="n">3</span>Price and fiscal<span class="tt tt-r" tabindex="0" data-tip="Flat real price. Royalty on revenue. Tax on revenue − royalty − opex − depreciation, depreciation straight-line over the given years from first oil, losses carried forward without limit; ABEX is not deducted. Discount rate real, applied monthly at mid-month from FID. A generic regime, not a country model: production sharing, windfall or ring-fencing rules are not represented.">?</span><i class="chev"></i></h2>
  <div class="body" id="pFis"></div></section>
</aside>
<main>
 <div class="tiles" id="tiles"></div>
 <div class="two" style="margin-top:0">
  <div class="card"><h3>Production profile<span class="tt" tabindex="0" data-tip="Annual production in MMboe (bars) and the rate in kboe/d (line). Plateau and decline are visible; the dashed line is the economic limit.">?</span></h3><canvas id="cvp"></canvas></div>
  <div class="card"><h3>Cash flow<span class="tt" tabindex="0" data-tip="Annual net cash flow after tax (bars) and its cumulative sum (line), undiscounted. The lowest point of the cumulative curve is the peak funding.">?</span></h3><canvas id="cvc"></canvas></div>
 </div>
 <div class="two">
  <div class="card"><h3>Sensitivities on NPV<span class="tt" tabindex="0" data-tip="NPV when each input is lowered (orange) or raised (green) alone: price ±20 %, reserves ±20 %, capex ±20 %, opex ±20 %, plateau target ±20 %, discount rate ±2 points, first oil one year later / earlier. The black line is the base case.">?</span></h3><div class="tor" id="tor"></div></div>
  <div class="card"><h3>Annual table</h3><div class="tw tall"><table class="cvt" id="annT"></table></div></div>
 </div>
</main></div>
<script id="fdp-core">
/* Field development screening core: production profile, costs, fiscal terms, NPV / IRR / payback, break-even price and minimum economic volume. Pure logic, no DOM; window.FDP. Tested by scripts/fdp_test.mjs. */
(function(){
const DPM=365.25/12,clamp=(v,a,b)=>v<a?a:v>b?b:v;
const defaults=()=>({format:'fdp-case',version:1,name:'Offshore oil field',
 reserves:120,plateau:40,wellIP:8,wells:6,plateauFrac:.3,b:.3,qmin:3,ramp:1,
 facilities:900,wellCost:70,phasing:[30,40,30],opexFixed:90,opexVar:6,abex:250,
 price:70,royalty:10,tax:35,dep:8,disc:10});
const clean=p=>{const q=Object.assign(defaults(),p);for(const k of Object.keys(defaults())){if(k!=='name'&&k!=='format'&&k!=='phasing'&&!isFinite(+q[k]))q[k]=defaults()[k]}return q};
// production profile, monthly, in kboe/d. Plateau (with a linear ramp-up) until plateauFrac × reserves is produced, then Arps decline from the plateau rate;
// the nominal decline rate Di is solved so that the cumulative production (down to the economic limit) equals the reserves.
function arps(q0,Di,b,t){return b<1e-6?q0*Math.exp(-Di*t):q0/Math.pow(1+b*Di*t,1/b)}
function profile(p){const EUR=+p.reserves,qpl=Math.max(0,Math.min(+p.plateau,(+p.wells||0)*(+p.wellIP||0))),rm=Math.max(0,Math.round(+p.ramp*12)),pf=clamp(+p.plateauFrac,0,1),b=clamp(+p.b,0,1),qmin=Math.max(0,+p.qmin||0),N=12*60;
  const run=Di=>{const q=[];let cum=0,k=0,capped=false;
    // plateau phase
    while(k<N&&cum<pf*EUR-1e-12&&qpl>0){const r=qpl*(rm>0?Math.min(1,(k+1)/rm):1);q.push(r);cum+=r*DPM/1000;k++}
    const q0=q.length?q[q.length-1]:qpl;let t=0;
    if(cum<EUR-1e-9&&q0>0)while(k<N){t+=1/12;const r=arps(q0,Di,b,t);if(r<qmin||r<1e-6)break;const dc=r*DPM/1000;if(cum+dc>EUR){q.push(r*(EUR-cum)/dc);cum=EUR;capped=true;k++;break}q.push(r);cum+=dc;k++}
    return{q,cum,capped}};
  let lo=1e-4,hi=20;{const r=run(lo);if(!r.capped)return{q:r.q,Di:lo,cum:r.cum,qpl,short:r.cum<EUR*.999}}
  for(let i=0;i<60;i++){const mid=Math.sqrt(lo*hi);if(run(mid).capped)lo=mid;else hi=mid}
  const r=run(Math.sqrt(lo*hi));return{q:r.q,Di:Math.sqrt(lo*hi),cum:r.cum,qpl,short:r.cum<EUR*.995}}
// monthly economics from FID (month 0)
function economics(p,prof){prof=prof||profile(p);const ph=(p.phasing||[100]).map(Number).filter(x=>isFinite(x)&&x>=0),sum=ph.reduce((a,b)=>a+b,0)||1,ny=ph.length,m0=12*ny,q=prof.q,np=q.length,M=m0+np+1,r=Math.pow(1+(+p.disc||0)/100,1/12)-1;
  const capTot=(+p.facilities||0)+(+p.wells||0)*(+p.wellCost||0),dep=Math.max(1,Math.round((+p.dep||1)*12)),roy=(+p.royalty||0)/100,tax=(+p.tax||0)/100;
  const rows=[];let cum=0,carry=0,pvC=0,pvO=0,pvA=0,pvP=0,npv=0,minCum=0,pay=NaN;const cfs=[];
  for(let m=0;m<M;m++){const prod=m>=m0&&m<m0+np?q[m-m0]*DPM/1000:0,rev=prod*(+p.price||0),royal=rev*roy,opex=prod>0?(+p.opexFixed||0)/12+prod*(+p.opexVar||0):0,
    capex=m<m0?capTot*ph[Math.floor(m/12)]/sum/12:0,abex=m===m0+np-1?(+p.abex||0):0,d=m>=m0&&m<m0+dep?capTot/dep:0,ti=rev-royal-opex-d;
    let tx=0;if(ti<0)carry-=ti;else{const use=Math.min(carry,ti);carry-=use;tx=tax*(ti-use)}
    const cf=rev-royal-opex-capex-abex-tx,df=Math.pow(1+r,-(m+.5)),pre=cum<0;cum+=cf;if(cum<minCum)minCum=cum;if(isNaN(pay)&&pre&&cum>=0)pay=(m+1)/12;
    npv+=cf*df;pvC+=(capex)*df;pvO+=(opex+abex)*df;pvP+=prod*df;cfs.push(cf);rows.push({m,prod,q:prod>0?q[m-m0]:0,rev,royal,opex,capex,abex,tax:tx,cf,cum})}
  return{rows,npv,irr:irr(cfs),payback:pay,peak:-minCum,pvCapex:pvC,pvOpex:pvO,utc:pvP>0?(pvC+pvO)/pvP:NaN,pi:pvC>0?npv/pvC:NaN,total:q.reduce((a,x)=>a+x*DPM/1000,0),capTot,firstOil:ny,end:(m0+np)/12}}
function irr(cf){const f=x=>{let s=0;for(let m=0;m<cf.length;m++)s+=cf[m]*Math.pow(1+x,-(m+.5)/12);return s};// bracket from 0 upwards (a late abandonment cost makes f(x) negative for very negative x); below 0 only if the project does not pay back
  let lo=0,hi=20;if(!(f(0)>0)){lo=-.5;hi=0}const a=f(lo),b=f(hi);if(!(a*b<0))return NaN;for(let i=0;i<80;i++){const mid=(lo+hi)/2;(f(mid)*a>0)?lo=mid:hi=mid}return(lo+hi)/2}
const npvOf=p=>economics(p).npv;
function solve(f,lo,hi,n=60){const a=f(lo),b=f(hi);if(!(a*b<0))return NaN;for(let i=0;i<n;i++){const m=(lo+hi)/2;(f(m)*a>0)?lo=m:hi=m}return(lo+hi)/2}
// break-even price (NPV = 0) and minimum economic reserves (NPV = 0 with wells, facilities and all costs unchanged)
const breakeven=p=>solve(x=>npvOf(Object.assign({},p,{price:x})),0,2000);
const mefv=p=>solve(x=>npvOf(Object.assign({},p,{reserves:x})),.05,Math.max(10*p.reserves,50));
function sensitivities(p){const base=npvOf(p),sc=(k,f)=>Object.assign({},p,{[k]:p[k]*f}),
  C=f=>Object.assign({},p,{facilities:p.facilities*f,wellCost:p.wellCost*f}),O=f=>Object.assign({},p,{opexFixed:p.opexFixed*f,opexVar:p.opexVar*f}),
  X=d=>{const ph=p.phasing.slice();d>0?ph.unshift(0):ph.shift();return ph.length?Object.assign({},p,{phasing:ph}):p},
  L=[['Oil price ±20 %',npvOf(sc('price',.8)),npvOf(sc('price',1.2))],['Reserves ±20 %',npvOf(sc('reserves',.8)),npvOf(sc('reserves',1.2))],['Capex ±20 %',npvOf(C(1.2)),npvOf(C(.8))],['Opex ±20 %',npvOf(O(1.2)),npvOf(O(.8))],
   ['Plateau target ±20 %',npvOf(sc('plateau',.8)),npvOf(sc('plateau',1.2))],['Discount rate ±2 pts',npvOf(Object.assign({},p,{disc:p.disc+2})),npvOf(Object.assign({},p,{disc:Math.max(0,p.disc-2)}))],['First oil 1 yr later / earlier',npvOf(X(1)),npvOf(X(-1))]];
  return{base,items:L.map(([n,lo,hi])=>({name:n,lo,hi,swing:Math.abs(hi-lo)})).sort((a,b)=>b.swing-a.swing)}}
function annual(res){const A=[];for(const r of res.rows){const y=Math.floor(r.m/12);if(!A[y])A[y]={y,prod:0,rev:0,royal:0,opex:0,capex:0,abex:0,tax:0,cf:0,qm:0,n:0};const a=A[y];a.prod+=r.prod;a.rev+=r.rev;a.royal+=r.royal;a.opex+=r.opex;a.capex+=r.capex;a.abex+=r.abex;a.tax+=r.tax;a.cf+=r.cf;if(r.q>0){a.qm+=r.q;a.n++}}
  let c=0;for(const a of A){c+=a.cf;a.cum=c;a.q=a.n?a.qm/a.n:0}return A}
