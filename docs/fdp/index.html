<style>

.stage{position:relative;height:max(520px,76vh)}
.banner{pointer-events:none;position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:80%;z-index:3;background:var(--fg);color:#f5f3ed;border-radius:6px;padding:7px 14px;font-size:.84rem;box-shadow:0 4px 14px rgba(0,0,0,.25)}

.panel h2{cursor:pointer;user-select:none;margin-bottom:0}
.panel h2 .tt{margin-left:auto}

.panel .body{margin-top:6px}.panel.collapsed .body{display:none}
.tt{position:relative;display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--mut);font:600 .68rem Inter,sans-serif;cursor:help;flex:none}
.tt:hover,.tt:focus{border-color:var(--acc);color:var(--acc);outline:none}
.tt::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);right:-6px;width:280px;padding:8px 10px;background:var(--fg);color:#f5f3ed;border-radius:6px;font:400 .76rem/1.4 Inter,sans-serif;text-align:left;white-space:normal;box-shadow:0 4px 14px rgba(0,0,0,.22);z-index:20;opacity:0;visibility:hidden;transition:opacity .12s;pointer-events:none}
.tt:hover::after,.tt:focus::after{opacity:1;visibility:visible}
/* tooltip near the left edge (two-column layout): open to the right instead */
@media (min-width:901px){.tt.tt-r::after{right:auto;left:-6px}}
.top .tt{background:transparent;border-color:rgba(245,243,237,.55);color:#f5f3ed}
.top .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top .bar button{padding:.2rem .5rem;font-size:.8rem}
.top .bar button.pri{background:#f5f3ed;color:var(--acc);border-color:#f5f3ed}
.top .bar label{display:flex;gap:4px;align-items:center;font-size:.8rem}
.top .bar .msg{color:#f5f3ed;opacity:.9;min-height:0;font-size:.78rem}
.top{align-items:center}


.side{position:sticky;top:8px;align-self:start;max-height:calc(100vh - 16px);overflow-y:auto;padding-right:2px}

<div class="top"><h1>Field development screening</h1>
 <div class="bar"><span style="opacity:.85;font-size:.8rem">File</span>
  <button class="pri" id="bSave" title="The whole case in one JSON file">Save case</button>
  <button id="bLoad">Open</button><input type="file" id="jfile" accept=".json,application/json" hidden>
  <button id="bCsv" title="Annual profile and cash flow as CSV">Annual CSV</button>
  <button id="bLink" title="Small JSON file (format fdp-link): minimum economic volume, break-even price, unit technical cost, capex, NPV. Import it in Prospect risking or Portfolio.">Save link for Prospect risking / Portfolio</button>
  <select id="exSel" aria-label="Example"><option value="">Example…</option><option value="oil">Offshore oil field</option><option value="small">Small field (marginal)</option></select>
  <span class="msg" id="msg"></span>
  <span class="tt" tabindex="0" data-tip="Everything runs locally in your browser. A screening model, not a reservoir or facilities study: the field profile is a plateau followed by an Arps decline whose rate is solved so that the field produces exactly the reserves; costs are phased before first oil; royalty and tax with loss carry-forward; monthly discounting in real terms.">?</span>
 <a href="https://romaingiboreau.github.io/My_Website/">← Back to site</a></div></div>
<div class="layout">
<aside class="side">
 <section class="panel"><h2><span class="n">1</span>Reserves and production<span class="tt tt-r" tabindex="0" data-tip="Recoverable reserves (EUR) in MMboe. Plateau rate target in kboe/d; the wells set the capacity: plateau = min(target, wells online × initial rate per well). With a drilling schedule, wells are added at the start of each production year and capacity rises accordingly. The plateau lasts until the chosen fraction of the reserves is produced, then the rate declines (Arps, exponent b: 0 exponential, 1 harmonic) down to the economic limit; the decline rate is solved so that the total equals the reserves. Ramp-up: linear rise to the plateau after first oil.">?</span><i class="chev"></i></h2>
  <div class="body" id="pRes"></div></section>
 <section class="panel"><h2><span class="n">2</span>Costs<span class="tt tt-r" tabindex="0" data-tip="Capex = facilities (fixed) + wells × cost per well, phased over the years before first oil: the phasing list gives the % per year (its length is the number of years from FID to first oil). Opex = fixed $MM/yr while producing + variable $/boe. Abandonment (ABEX) is spent in the last producing month. Real terms (no inflation).">?</span><i class="chev"></i></h2>
  <div class="body" id="pCost"></div></section>
 <section class="panel"><h2><span class="n">3</span>Price and fiscal<span class="tt tt-r" tabindex="0" data-tip="Flat real price. Fiscal regime: Royalty / tax (royalty on revenue; tax on revenue − royalty − opex − depreciation, straight-line over the given years from first oil, losses carried forward, ABEX not deducted), or a generic production-sharing contract (cost-recovery ceiling, profit-oil split, optional R-factor tier, contractor tax). Discount rate real, applied monthly at mid-month from FID. Both regimes are generic, not any country's: windfall, ring-fencing or signature bonuses are not represented.">?</span><i class="chev"></i></h2>
  <div class="body" id="pFis"></div></section>
 <section class="panel"><h2><span class="n">4</span>Uncertainty (Monte Carlo)<span class="tt tt-r" tabindex="0" data-tip="Each input gets a triangular distribution (min / most likely / max, as a % of the value above); the reserves can instead be lognormal from P90 / P50 / P10. Each trial redraws the four inputs and recomputes the whole profile and economics (royalty-tax or production sharing as selected). Seeded random numbers: the same seed gives the same result. It runs only when you press the button. Capex scale multiplies facilities and cost per well; opex scale multiplies fixed and variable opex. The inputs are independent; the distributions are yours, not data.">?</span><i class="chev"></i></h2>
  <div class="body" id="pMc"></div></section>
</aside>
<main>
 <div class="tiles" id="tiles"></div>
 <div class="two" style="margin-top:0">
  <div class="card"><h3>Production profile<span class="tt" tabindex="0" data-tip="Annual production in MMboe (bars) and the rate in kboe/d (line). Plateau and decline are visible; the dashed line is the economic limit.">?</span></h3><canvas id="cvp"></canvas></div>
  <div class="card"><h3>Cash flow<span class="tt" tabindex="0" data-tip="Annual net cash flow after tax (bars) and its cumulative sum (line), undiscounted. The lowest point of the cumulative curve is the peak funding.">?</span></h3><canvas id="cvc"></canvas></div>
 </div>
 <div class="two">
  <div class="card"><h3>Sensitivities on NPV<span class="tt" tabindex="0" data-tip="NPV when each input is lowered (orange) or raised (green) alone: price ±20 %, reserves ±20 %, capex ±20 %, opex ±20 %, plateau target ±20 %, discount rate ±2 points, first oil one year later / earlier. The black line is the base case.">?</span></h3><div class="tor" id="tor"></div></div>
  <div class="card"><h3>Annual table<span class="tt" tabindex="0" data-tip="Net CF and Cum. CF are the contractor's (after tax). Govt take = royalty + tax, or government profit oil + contractor tax under production sharing.">?</span></h3><div class="tw tall"><table class="cvt" id="annT"></table></div></div>
 </div>
 <div class="card" id="mcCard" style="margin-top:12px;display:none"><h3>Uncertainty on NPV<span class="tt" tabindex="0" data-tip="Histogram of the NPV over the trials (orange: NPV below zero). Black line: base-case NPV; dashed: P50. P90 is the value exceeded with 90 % probability (low), P10 with 10 % (high).">?</span></h3>
  <div class="tiles" id="mcTiles" style="margin:8px 0"></div><canvas id="cvm"></canvas><div class="msg" id="mcNote" style="padding:4px 8px"></div></div>
</main></div>
<script id="fdp-core">
/* Field development screening core: production profile, costs, fiscal terms, NPV / IRR / payback, break-even price and minimum economic volume. Pure logic, no DOM; window.FDP. Tested by scripts/fdp_test.mjs. */
(function(){
const DPM=365.25/12,clamp=(v,a,b)=>v<a?a:v>b?b:v;
const defaults=()=>({format:'fdp-case',version:1,name:'Offshore oil field',
 reserves:120,plateau:40,wellIP:8,wells:6,plateauFrac:.3,b:.3,qmin:3,ramp:1,
 facilities:900,wellCost:70,phasing:[30,40,30],opexFixed:90,opexVar:6,abex:250,
 price:70,royalty:10,tax:35,dep:8,disc:10,
 wellMode:'fixed',drill:[4,2],
 regime:'rt',pscCeiling:60,pscShare:40,pscShare2:30,pscR:1.5,pscTax:0});
const NONNUM={name:1,format:1,phasing:1,drill:1,wellMode:1,regime:1};
const clean=p=>{const q=Object.assign(defaults(),p);for(const k of Object.keys(defaults())){if(!NONNUM[k]&&!isFinite(+q[k]))q[k]=defaults()[k]}
  if(q.regime!=='psc')q.regime='rt';if(q.wellMode!=='sched')q.wellMode='fixed';
  if(!Array.isArray(q.drill)||!q.drill.length||q.drill.some(x=>!isFinite(+x)||+x<0))q.drill=defaults().drill;q.drill=q.drill.map(Number);return q};
// wells online in production year y (0 = first year): the fixed number, or the cumulative of the drilling schedule (wells added at the start of each production year)
const wellsOn=(p,y)=>{if(p.wellMode!=='sched')return+p.wells||0;let s=0;const d=p.drill||[];for(let i=0;i<=y&&i<d.length;i++)s+=Math.max(0,+d[i]||0);return s};
const wellsTot=p=>p.wellMode==='sched'?(p.drill||[]).reduce((a,x)=>a+Math.max(0,+x||0),0):(+p.wells||0);
// production profile, monthly, in kboe/d. Plateau (with a linear ramp-up) until plateauFrac × reserves is produced, then Arps decline from the plateau rate;
// the nominal decline rate Di is solved so that the cumulative production (down to the economic limit) equals the reserves.
function arps(q0,Di,b,t){return b<1e-6?q0*Math.exp(-Di*t):q0/Math.pow(1+b*Di*t,1/b)}
function profile(p){const EUR=+p.reserves,capAt=y=>Math.max(0,Math.min(+p.plateau,wellsOn(p,y)*(+p.wellIP||0))),qpl=capAt(p.wellMode==='sched'?(p.drill||[]).length:0),rm=Math.max(0,Math.round(+p.ramp*12)),pf=clamp(+p.plateauFrac,0,1),b=clamp(+p.b,0,1),qmin=Math.max(0,+p.qmin||0),N=12*60;
  const run=Di=>{const q=[];let cum=0,k=0,capped=false;
    // plateau phase
    while(k<N&&cum<pf*EUR-1e-12&&qpl>0){const r=capAt(Math.floor(k/12))*(rm>0?Math.min(1,(k+1)/rm):1);q.push(r);cum+=r*DPM/1000;k++}
    const q0=q.length?q[q.length-1]:qpl;let t=0;
    if(cum<EUR-1e-9&&q0>0)while(k<N){t+=1/12;const r=arps(q0,Di,b,t);if(r<qmin||r<1e-6)break;const dc=r*DPM/1000;if(cum+dc>EUR){q.push(r*(EUR-cum)/dc);cum=EUR;capped=true;k++;break}q.push(r);cum+=dc;k++}
    return{q,cum,capped}};
  let lo=1e-4,hi=20;{const r=run(lo);if(!r.capped)return{q:r.q,Di:lo,cum:r.cum,qpl,short:r.cum<EUR*.999}}
  for(let i=0;i<60;i++){const mid=Math.sqrt(lo*hi);if(run(mid).capped)lo=mid;else hi=mid}
  const r=run(Math.sqrt(lo*hi));return{q:r.q,Di:Math.sqrt(lo*hi),cum:r.cum,qpl,short:r.cum<EUR*.995}}
// monthly economics from FID (month 0). Two regimes: 'rt' royalty / tax, or 'psc' generic production sharing (cost-recovery ceiling, profit-oil split, contractor tax).
// npv, cf and tax are the contractor's (or the operator's, in royalty / tax); gov is the government take (royalty + tax, or government profit oil + contractor tax).
function economics(p,prof){prof=prof||profile(p);const ph=(p.phasing||[100]).map(Number).filter(x=>isFinite(x)&&x>=0),sum=ph.reduce((a,b)=>a+b,0)||1,ny=ph.length,m0=12*ny,q=prof.q,np=q.length,r=Math.pow(1+(+p.disc||0)/100,1/12)-1,
  sched=p.wellMode==='sched',dr=sched?(p.drill||[]).map(x=>Math.max(0,+x||0)):[],M=Math.max(m0+np+1,m0+12*Math.max(0,dr.length-1)+1),wc=+p.wellCost||0;
  const capTot=(+p.facilities||0)+wellsTot(p)*wc,capInit=(+p.facilities||0)+(sched?(dr[0]||0):(+p.wells||0))*wc,dep=Math.max(1,Math.round((+p.dep||1)*12)),
    psc=p.regime==='psc',roy=psc?0:(+p.royalty||0)/100,tax=(psc?+p.pscTax||0:+p.tax||0)/100,ceil=clamp((+p.pscCeiling||0)/100,0,1),s1=clamp((+p.pscShare||0)/100,0,1),s2=clamp((+p.pscShare2||0)/100,0,1),rthr=+p.pscR||0;
  const rows=[];let cum=0,carry=0,pvC=0,pvO=0,pvA=0,pvP=0,npv=0,minCum=0,pay=NaN,pool=0,cumEnt=0,cumCost=0,govTot=0,pvG=0;const cfs=[];
  for(let m=0;m<M;m++){const prod=m>=m0&&m<m0+np?q[m-m0]*DPM/1000:0,rev=prod*(+p.price||0),opex=prod>0?(+p.opexFixed||0)/12+prod*(+p.opexVar||0):0,

  $('pMc').innerHTML=`<div class="hint">Triangular, % of the base value. Run on demand: each trial is a full profile and economics.</div><div class="mcg"><small></small><small>min</small><small>mode</small><small>max</small>${MCV.map(([v,t])=>`<span>${t}</span>${g(v,'min')}${g(v,'mode')}${g(v,'max')}`).join('')}</div>
  <label class="chk"><input type="checkbox" data-mc="ln.on"${MC.ln.on?' checked':''}> Reserves lognormal from P90 / P50 / P10 (MMboe, replaces the triangle)</label>
  <div class="mcg"><small></small><small>P90</small><small>P50</small><small>P10</small><span>Reserves</span><input type="number" step="any" data-mc="ln.p90" value="${MC.ln.p90}"><input type="number" step="any" data-mc="ln.p50" value="${MC.ln.p50}"><input type="number" step="any" data-mc="ln.p10" value="${MC.ln.p10}"></div>
  <div class="mcg" style="margin-top:8px"><span>Trials</span><input type="number" min="10" max="20000" step="100" data-mc="n" value="${MC.n}"><span>Seed</span><input type="number" step="1" data-mc="seed" value="${MC.seed}"></div>
  <div class="row"><button class="pri" id="bMc">Run Monte Carlo</button><span class="msg" id="mcMsg"></span></div>`;
  $('bMc').onclick=runMc}
$('pMc').addEventListener('input',e=>{const k=e.target.dataset.mc;if(!k)return;const [a,b]=k.split('.');if(b)MC[a][b]=e.target.type==='checkbox'?e.target.checked:+e.target.value;else MC[a]=+e.target.value;staleMc()});
function staleMc(){if(mcOut&&$('mcMsg'))$('mcMsg').textContent='Inputs changed since the last run: run again.'}
function runMc(){const b=$('bMc'),m=$('mcMsg');b.disabled=true;m.textContent='Running…';setTimeout(()=>{try{const t=performance.now();MC.n=Math.min(20000,Math.max(10,Math.round(MC.n)||2000));const p=F.clean(M);mcOut=F.mc(p,MC);mcOut.p=p;drawMc();m.textContent=`${mcOut.n} trials in ${((performance.now()-t)/1000).toFixed(1)} s.`}catch(err){m.textContent='Error: '+err.message}b.disabled=false},30)}
function drawMc(){if(!mcOut)return;const r=mcOut;$('mcCard').style.display='';
  const T=[['P90 (low), $MM',f1(r.p90),''],['P50, $MM',f1(r.p50),'key'],['P10 (high), $MM',f1(r.p10),''],['Mean, $MM',f1(r.mean),''],['P(NPV < 0)',(100*r.pNeg).toFixed(1)+' %',r.pNeg>.2?'key2':'key'],['Base-case NPV, $MM',f1(r.base),'']];
  $('mcTiles').innerHTML=T.map(([a,b,k])=>`<div class="tile ${k}"><small>${a}</small><b>${b}</b></div>`).join('');
  $('mcNote').textContent=`Standard deviation ${f1(r.sd)} $MM; range ${f1(r.min)} to ${f1(r.max)}. ${r.lnUsed?'Reserves lognormal (P90 / P50 / P10).':'Reserves triangular.'} Fiscal regime: ${r.p.regime==='psc'?'production sharing':'royalty / tax'}.`;
  const{c,W,H}=prep('cvm'),m={l:44,r:12,t:14,b:36},h=r.hist,nb=h.counts.length,xmin=h.lo,xmax=h.lo+h.w*nb,ymax=Math.max(...h.counts)*1.1||1,pw=W-m.l-m.r,ph=H-m.t-m.b,X=v=>m.l+(v-xmin)/(xmax-xmin)*pw,Y=v=>m.t+(1-v/ymax)*ph;
  c.fillStyle='#5c5a52';c.strokeStyle='#e2ded3';c.textAlign='right';c.textBaseline='middle';for(let k=0;k<=4;k++){const v=ymax*k/4;c.beginPath();c.moveTo(m.l,Y(v));c.lineTo(W-m.r,Y(v));c.stroke();c.fillText((100*v/r.n).toFixed(1)+'%',m.l-5,Y(v))}
  h.counts.forEach((n,i)=>{const x0=xmin+i*h.w;c.fillStyle=x0+h.w/2<0?'#c98f6e':'#8a9a8c';c.fillRect(X(x0)+.5,Y(n),Math.max(1,X(x0+h.w)-X(x0)-1),Y(0)-Y(n))});
  c.textAlign='center';c.textBaseline='top';c.fillStyle='#5c5a52';for(let k=0;k<=5;k++){const v=xmin+(xmax-xmin)*k/5;c.fillText(f1(v),X(v),m.t+ph+4)}c.fillText('NPV, $MM',m.l+pw/2,m.t+ph+19);
  c.lineWidth=1.5;if(xmin<0&&xmax>0){c.strokeStyle='#a8623a';c.beginPath();c.moveTo(X(0),m.t);c.lineTo(X(0),m.t+ph);c.stroke()}
  c.strokeStyle='#232220';c.beginPath();c.moveTo(X(r.base),m.t);c.lineTo(X(r.base),m.t+ph);c.stroke();c.setLineDash([5,4]);c.beginPath();c.moveTo(X(r.p50),m.t);c.lineTo(X(r.p50),m.t+ph);c.stroke();c.setLineDash([])}
const EX={oil:()=>F.defaults(),small:()=>Object.assign(F.defaults(),{name:'Small field',reserves:25,plateau:8,wellIP:4,wells:3,facilities:250,wellCost:30,phasing:[40,60],opexFixed:30,abex:60,qmin:1})};
$('exSel').onchange=()=>{const k=$('exSel').value;if(k){M=EX[k]();mcOut=null;$('mcCard').style.display='none';renderInputs();compute()}$('exSel').value=''};
document.querySelectorAll('.panel h2').forEach(h=>h.addEventListener('click',e=>{if(e.target.closest('.tt'))return;h.parentElement.classList.toggle('collapsed')}));
renderInputs();compute();
</script>
<script id="rgm-js">
/* rgm: shared "Method & sources" panel for the tool pages. Data object D = {what, method:[html], sources:[[item,source,status]], validation:[html], limits:[html]} */
(function(D){
  const css=`
.rgm-btn{font:inherit;font-size:.8rem;border:1px solid rgba(245,243,237,.55);background:transparent;color:#f5f3ed;border-radius:4px;padding:.2rem .6rem;cursor:pointer;margin-left:8px}
.rgm-btn:hover,.rgm-btn.on{background:#f5f3ed;color:#4a5a4e;border-color:#f5f3ed}
#rgm{position:fixed;left:0;right:0;bottom:0;top:56px;overflow:auto;background:var(--bg,#eeece6);color:var(--fg,#232220);z-index:40;display:none;font:14px/1.5 Inter,system-ui,sans-serif}
#rgm.on{display:block}
#rgm .rgdoc{max-width:1000px;margin:0 auto;padding:18px 18px 70px}
#rgm h2{font:600 1.15rem "Space Grotesk",Inter,sans-serif;margin:26px 0 8px}
#rgm h2:first-child{margin-top:4px}
#rgm p{max-width:82ch;margin:6px 0}
#rgm ul{max-width:82ch;margin:6px 0 6px 20px;padding:0}
#rgm li{margin:4px 0}
#rgm table{width:100%;border-collapse:collapse;background:var(--card,#f5f3ed);border:1px solid var(--line,#c9c4b6);font-size:.84rem;margin:8px 0 14px}
#rgm th,#rgm td{text-align:left;vertical-align:top;padding:6px 9px;white-space:normal;border-bottom:1px solid var(--line,#c9c4b6)}
#rgm th{background:var(--alt,#e2ded3);position:static}
#rgm td.rgst{white-space:normal;width:12em;min-width:9em}
#rgm .rgchip{display:inline-block;padding:0 7px;border-radius:9px;font-size:.72rem;font-weight:600;background:#e3dfd2;color:#5c5a52}
#rgm .rgchip.ok{background:rgba(74,90,78,.2);color:#3a4a3e}
#rgm .rgchip.warn{background:rgba(168,98,58,.2);color:#8a4e2c}
#rgm .rgleg{color:var(--mut,#5c5a52);font-size:.78rem;max-width:90ch}
@media(max-width:700px){#rgm table{display:block;overflow-x:auto}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const chip=s=>{const l=String(s).toLowerCase(),c=l.startsWith('published')?'ok':(/^(supplied|memory)|not retrieved|to add|to complete|to verify/.test(l)?'warn':'');return `<span class="rgchip ${c}">${s}</span>`};
  let h='<div class="rgdoc">';
  h+=`<h2>What it does</h2><p>${D.what}</p>`;
  if(D.method&&D.method.length)h+='<h2>Method</h2><ul>'+D.method.map(x=>`<li>${x}</li>`).join('')+'</ul>';
  if(D.sources&&D.sources.length){h+='<h2>Sources and status</h2><table><thead><tr><th>Item</th><th>Source</th><th>Status</th></tr></thead><tbody>'+D.sources.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td class="rgst">${chip(r[2])}</td></tr>`).join('')+'</tbody></table>';
    h+='<p class="rgleg">Status tags: <b>published (read)</b> the content for the number or method concerned was read in the publication or standard; <b>published (metadata verified)</b> the reference exists and its citation (authors, year, title, journal, volume, pages) was checked in Crossref or another scholarly metadata service, but its content was not re-read; <b>to verify</b> a citation that could not be verified, with what is missing; <b>published (second hand)</b> as reported by a secondary page; <b>figure</b> values read off a published figure, not from a table; <b>supplied</b> numbers supplied by the site author, not checked against the paper; <b>derived</b> own derivation from a mass balance or first principles; <b>memory</b> written from memory, not checked; <b>existence confirmed</b> the reference exists (title, year), its content was not read; <b>classical</b> standard method, reference still to add; <b>on the page</b> the rule or default is shown and editable in the tool itself. A reference is listed only when its existence was confirmed; when only the record is known, the details are left out rather than guessed.</p>'}
  if(D.validation&&D.validation.length)h+='<h2>Validation</h2><ul>'+D.validation.map(x=>`<li>${x}</li>`).join('')+'</ul>';
  if(D.limits&&D.limits.length)h+='<h2>Limits and not implemented</h2><ul>'+D.limits.map(x=>`<li>${x}</li>`).join('')+'</ul>';
  h+=`<p class="rgleg">Last updated ${D.date||'12 October 2026'}.</p></div>`;
  const box=document.createElement('div');box.id='rgm';box.innerHTML=h;document.body.appendChild(box);
  const top=document.querySelector('.top'),btn=document.createElement('button');btn.type='button';btn.className='rgm-btn';btn.textContent='Method & sources';
  const bar=top&&top.querySelector('.bar'),back=top&&Array.from(top.children).find(e=>e.tagName==='A');
  if(bar)bar.appendChild(btn);else if(top)top.insertBefore(btn,back||null);else{btn.style.cssText='position:fixed;right:10px;top:10px;z-index:50;background:#4a5a4e';document.body.appendChild(btn)}
  function set(on){box.classList.toggle('on',on);btn.classList.toggle('on',on);btn.textContent=on?'← Back to the tool':'Method & sources';
    if(on){const r=top?top.getBoundingClientRect():{bottom:0};box.style.top=Math.max(0,Math.round(r.bottom))+'px';box.scrollTop=0}}
  btn.onclick=()=>set(!box.classList.contains('on'));
  // ---- Tools menu: switch between the tool pages without going back to the site
  (function(){
    const CAT=[['Data preparation',[['LAS checker','las-checker'],['ZMAP checker','zmap-checker'],['Colour-blind check','cvd']]],['Digitization',[['Plot digitizer','digitizer'],['Continuous map digitizer','mapdigitizer'],['Discrete map digitizer','discretemap'],['Well-log digitizer','logdigitizer']]],
      ['Mapping and spatial statistics',[['Map interpolation','gridding'],['Variogram','variogram'],['Convex & concave hulls','hull'],['Clustering','clustering'],['GDE map generator','gdemap'],['Grid attributes','gridattr']]],
      ['Organic geochemistry',[['Rock-Eval QC','rockeval'],['Source rock potential','source'],['Thermal maturity','maturity'],['Biomarkers','biomarkers'],['Chromatogram','chromatogram'],['Ternary diagram','ternary']]],
      ['Basin modelling and petrophysics',[['Compaction fit','compaction'],['BHT correction','bht'],['TR Cycles','tr-cycles'],['Petroleum system events','psec'],['Burial history (1D)','burial'],['Log correlation (DTW)','logcorr']]],
      ['Decision support',[['MCDA (AHP & PROMETHEE)','mcda'],['Prospect risking (gCOS, eCOS)','risking'],['Portfolio consolidation','portfolio'],['Field development screening','fdp'],['Contact and well POS','wellpos'],['Distribution fitting','distfit']]]];
    const top=document.querySelector('.top');if(!top)return;
    const cur=(location.pathname.replace(/\/index\.html$/,'/').split('/').filter(Boolean).pop()||'');
    const st=document.createElement('style');st.textContent=`
.rgnav{position:relative;display:inline-block}
.rgnav>button{font:inherit;font-size:.8rem;border:1px solid rgba(245,243,237,.55);background:transparent;color:#f5f3ed;border-radius:4px;padding:.2rem .6rem;cursor:pointer}
.rgnav>button:hover,.rgnav>button[aria-expanded=true]{background:#f5f3ed;color:#4a5a4e;border-color:#f5f3ed}
.rgnav .rgmenu{display:none;position:absolute;left:0;top:calc(100% + 6px);z-index:80;background:#f5f3ed;color:#232220;border:1px solid #c9c4b6;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.22);padding:12px 14px;width:max-content;max-width:min(92vw,760px);font:13px/1.4 Inter,system-ui,sans-serif;columns:2 230px;column-gap:22px}
.rgnav.on .rgmenu{display:block}
.rgnav .rgmenu h3{font:600 .72rem Inter,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:#5c5a52;margin:0 0 4px;break-after:avoid}
.rgnav .rgmenu div{break-inside:avoid;margin-bottom:12px}
.rgnav .rgmenu a{display:block;color:#232220;text-decoration:none;border:0;opacity:1;font-size:.84rem;padding:3px 6px;border-radius:4px}
.rgnav .rgmenu a:hover{background:#e2ded3}
.rgnav .rgmenu a.cur{background:rgba(74,90,78,.18);font-weight:600}
.rgnav .rgmenu a.home{margin-bottom:10px;border-bottom:1px solid #c9c4b6;border-radius:0;column-span:all}
@media(max-width:700px){.rgnav{position:static}.rgnav .rgmenu{position:fixed;left:8px;right:8px;top:56px;width:auto;max-width:none;columns:1;max-height:calc(100vh - 70px);overflow:auto}}`;
    document.head.appendChild(st);
    const w=document.createElement('span');w.className='rgnav';
    const b=document.createElement('button');b.type='button';b.textContent='Tools ▾';b.setAttribute('aria-haspopup','true');b.setAttribute('aria-expanded','false');
    const m=document.createElement('nav');m.className='rgmenu';m.setAttribute('aria-label','Tools');
    m.innerHTML='<a class="home" href="../">← Back to the site</a>'+CAT.map(([c,l])=>'<div><h3>'+c+'</h3>'+l.map(([n,s])=>'<a href="../'+s+'/"'+(s===cur?' class="cur" aria-current="page"':'')+'>'+n+'</a>').join('')+'</div>').join('');
    w.appendChild(b);w.appendChild(m);
    const h1=top.querySelector('h1');if(h1&&h1.nextSibling)top.insertBefore(w,h1.nextSibling);else top.appendChild(w);
    const set=on=>{w.classList.toggle('on',on);b.setAttribute('aria-expanded',on?'true':'false')};
    b.onclick=e=>{e.stopPropagation();set(!w.classList.contains('on'))};
    document.addEventListener('click',e=>{if(!w.contains(e.target))set(false)});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&w.classList.contains('on')){set(false);b.focus()}});
  })();

  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&box.classList.contains('on'))set(false)});
  window.addEventListener('resize',()=>{if(box.classList.contains('on'))set(true)});
})
({"what":"Runs entirely in your browser: nothing you enter leaves your machine. A basic field development plan screening: a plateau and Arps decline production profile matched to the reserves, capex phased before first oil, opex, abandonment, royalty and tax with loss carry-forward, then NPV, IRR, payback, break-even price, unit technical cost, the minimum economic volume (MEFV), one-at-a-time sensitivities, a Monte Carlo on the main inputs, a generic production-sharing option and a simple drilling schedule.","method":["<b>Profile.</b> Plateau rate = min(target, wells × initial rate per well), reached by a linear ramp-up after first oil, kept until the chosen fraction of the reserves is produced; then Arps decline q = q<sub>0</sub> / (1 + b·D<sub>i</sub>·t)<sup>1/b</sup> (exponential for b = 0) down to the economic limit. The nominal decline rate D<sub>i</sub> is solved by bisection so that the cumulative production equals the reserves. Monthly steps.","<b>Costs.</b> Capex = facilities + wells × cost per well, phased by the yearly percentages (their number is the delay from FID to first oil). Opex = fixed $MM/yr while producing + variable $/boe. Abandonment in the last producing month. Real terms.","<b>Fiscal.</b> Royalty on revenue; tax on revenue − royalty − opex − depreciation (straight-line over the given years from first oil), losses carried forward without limit; abandonment not deducted. A generic regime: no windfall tax, ring-fence or tax holiday (production sharing is a separate option, below).","<b>Results.</b> Monthly net cash flow discounted at mid-month from FID; IRR by bisection on the same monthly flows; payback = first month the undiscounted cumulative flow returns to zero; PI = NPV / PV capex; unit technical cost = PV(capex + opex + abandonment) / PV(volume). Break-even price: price giving NPV = 0. MEFV: reserves giving NPV = 0 with wells, facilities and plateau unchanged (a smaller field keeps the same fixed costs). Use it as the MEFV override of the Prospect risking tool.","<b>Link file.</b> The button <i>Save link for Prospect risking / Portfolio</i> writes a small JSON file: <code>{format:'fdp-link', version:1, name, mefv (MMboe, reserves at NPV = 0), breakeven ($/boe), utc (unit technical cost, $/boe), capex (total, $MM), npv ($MM), reserves (MMboe), price ($/boe)}</code>; mefv, breakeven and utc are null when they cannot be computed.","<b>Production sharing (generic).</b> Each month: cost oil = min(ceiling × revenue, unrecovered costs carried forward), where the costs are capex + opex + abandonment of the month plus the unrecovered balance; profit oil = revenue − cost oil, split between contractor and government with a fixed contractor share, or a second share once the R-factor (cumulative contractor entitlement = cost oil + contractor profit oil, divided by cumulative costs, both up to the previous month) reaches the threshold. Contractor tax = rate × (entitlement − opex − depreciation), losses carried forward, abandonment not deducted. Contractor net cash flow = entitlement − capex − opex − abandonment − tax. Government take = government profit oil + tax, and month by month contractor cash flow + government take = revenue − (capex + opex + abandonment). The royalty field is not used in this regime. The structure is generic and the example values are invented: it is not any country's contract, and signature bonus, state participation, domestic market obligation or windfall terms are not represented.","<b>Drilling schedule.</b> Instead of a fixed number of wells: wells added at the start of each production year (list); the plateau capacity of a year is min(target, wells online × initial rate per well), so the plateau steps up as wells are added. The first entry is paid with the facilities according to the capex phasing; each later entry is paid evenly over the year before it comes online. Depreciation uses the total capex from first oil. A single entry equals the fixed number of wells.","<b>Uncertainty.</b> Monte Carlo with a seeded generator (mulberry32): each trial draws the reserves, the price, a capex scale (facilities and cost per well) and an opex scale (fixed and variable) from triangular distributions given as min / mode / max in % of the base value (inverse-CDF sampling), or the reserves from a lognormal with median P50 and σ = ln(P10 / P90) / (2 × 1.2816); the draws are independent. Each trial recomputes the full profile and economics, so the reserves still set the decline. Results: P90 (low), P50, P10 (high) as quantiles of the NPV sample (linear interpolation), mean, standard deviation, P(NPV &lt; 0) and a 24-bin histogram. It runs on demand only."],"sources":[["Arps decline q = q<sub>0</sub> / (1 + b·D<sub>i</sub>·t)<sup>1/b</sup>, exponential for b = 0, down to an economic limit","Arps, J.J. (1945), Analysis of decline curves, Transactions of the AIME 160(1), 228–247, <a href=\"https://doi.org/10.2118/945228-g\" target=\"_blank\" rel=\"noopener\">doi:10.2118/945228-g</a>; Fetkovich, M.J. (1980), Decline curve analysis using type curves, Journal of Petroleum Technology 32(6), 1065–1077, <a href=\"https://doi.org/10.2118/4629-pa\" target=\"_blank\" rel=\"noopener\">doi:10.2118/4629-pa</a> (range and meaning of the exponent b)","published (metadata verified)"],["Plateau at min(target, wells × initial rate), linear ramp-up, plateau until a fraction of the reserves is produced, then decline matched to the reserves by bisection","Screening construction of the site author, common in field development screening but with no publication cited for the exact rule; the unit technical cost PV(costs) / PV(volume) is the usual ratio, also without a specific source","on the page (no publication)"],["Discounted cash flow: NPV with mid-month discounting from FID, IRR by bisection, payback, profitability index PI = NPV / PV capex, break-even price","Hirshleifer, J. (1958), On the theory of optimal investment decision, Journal of Political Economy 66(4), 329–352, <a href=\"https://doi.org/10.1086/258057\" target=\"_blank\" rel=\"noopener\">doi:10.1086/258057</a> (NPV and internal rate of return criteria); Newendorp, P.D. &amp; Schuyler, J.R. (2000), Decision Analysis for Petroleum Exploration, 2nd ed., Planning Press, Aurora, Colorado, ISBN 978-0-9664401-1-9 (existence confirmed in Open Library, content not re-read). The mid-month timing and the monthly steps are choices of the page. IRR and break-even are solved by bisection (elementary numerical method)","published (metadata verified); timing on the page"],["Minimum economic field volume (MEFV): reserves giving NPV = 0 with wells, facilities and plateau unchanged","Concept of a minimum economic (commercial) field size: Rose, P.R. (2001), Risk Analysis and Management of Petroleum Exploration Ventures, AAPG Methods in Exploration Series 12, <a href=\"https://doi.org/10.1306/mth12792\" target=\"_blank\" rel=\"noopener\">doi:10.1306/mth12792</a>; Schneider, M., Citron, G.P., Haryott, P. &amp; Cook, D. (2023), AAPG Bulletin 107(5), 743–759, <a href=\"https://doi.org/10.1306/09232222051\" target=\"_blank\" rel=\"noopener\">doi:10.1306/09232222051</a> (abstract read). The definition used here (fixed costs kept while the reserves shrink) is a convention of the page","published (abstract read; metadata verified); definition on the page"],["Royalty on revenue; tax with straight-line depreciation and losses carried forward (generic concessionary regime)","Kaiser, M.J. (2007), Fiscal system analysis—concessionary systems, Energy 32(11), 2135–2147, <a href=\"https://doi.org/10.1016/j.energy.2007.04.013\" target=\"_blank\" rel=\"noopener\">doi:10.1016/j.energy.2007.04.013</a>; Johnston, D. (1994), International Petroleum Fiscal Systems and Production Sharing Contracts, PennWell Books, ISBN 0-87814-426-9 (existence confirmed in Open Library, content not re-read). The regime on the page is generic and not any country's terms","published (metadata verified)"],["Production sharing: cost oil ceiling on sharing: a 100 % ceiling and a 100 % contractor share without tax equal the royalty-free pre-tax NPV; contractor cash flow + government take = revenue − costs paid, in every month; cost oil never exceeds the costs nor the ceiling; the contractor NPV falls as the government profit-oil share rises. Drilling schedule: the plateau steps with the wells online; a single entry equals the fixed number; capex is conserved. Link file: exact keys, values equal to the computed tiles. Run <code>node scripts/fdp_test.mjs</code>."],"limits":["Not implemented: rig constraints and well-by-well performance (the schedule adds whole wells per year at the same initial rate, with no interference or decline per well), gas and condensate, price decks and cost inflation, specific country regimes (the production-sharing model is generic), correlation between the Monte Carlo inputs (they are independent), uncertainty on the other inputs (plateau, decline, discount rate), facilities capacity and constraints beyond the plateau rate, the effect of the reserves on the number of wells."],"date":"26 November 2026"});
