<html lang="en"><head><meta charset="utf-8">

<style>

:root{--bg:#eeece6;--card:#f5f3ed;--alt:#e2ded3;--fg:#232220;--mut:#5c5a52;--line:#c9c4b6;--acc:#4a5a4e;--acc2:#a8623a}
html{color-scheme:light only}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 Inter,system-ui,sans-serif}
h1,h2{font-family:"Space Grotesk",Inter,sans-serif;margin:0}
.top{background:var(--acc);color:#f5f3ed;display:flex;gap:6px 24px;flex-wrap:wrap;align-items:baseline;justify-content:space-between;padding:12px 18px}
.top h1{font-size:1.15rem;font-weight:700}
.top a{color:#f5f3ed;opacity:.88;font-size:.85rem;text-decoration:none;border-bottom:1px solid rgba(245,243,237,.45)}
.layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;padding:14px 16px 32px}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.panel h2{font-size:.95rem;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.panel h2 .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--acc);color:#f5f3ed;font-size:.72rem}
.hint{color:var(--mut);font-size:.78rem;margin:2px 0 8px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
button,select,input[type=text],input[type=number]{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:4px;padding:.3rem .55rem}
button{cursor:pointer;background:var(--card)}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#f5f3ed}
button.on{background:var(--alt);border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
button:disabled{opacity:.5;cursor:default}
.grid2{display:grid;grid-template-columns:auto 1fr 90px;gap:4px 8px;align-items:center;font-size:.82rem}
.grid2 input{width:100%}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line)}
.dot.ok{background:var(--acc)}
.stage{position:relative;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;height:max(430px,64vh);touch-action:none}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.tools{position:absolute;left:8px;top:8px;display:flex;gap:6px;z-index:2}
.tools button{background:rgba(245,243,237,.94)}
#loupe{position:absolute;right:8px;top:8px;width:150px;height:150px;border:2px solid var(--acc);border-radius:6px;background:#fff;z-index:2;display:none;image-rendering:pixelated}
.ro{position:absolute;left:8px;bottom:8px;background:rgba(245,243,237,.94);border:1px solid var(--line);border-radius:4px;padding:2px 8px;font-size:.78rem;color:var(--mut);z-index:2;font-variant-numeric:tabular-nums}
.drop{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--mut);pointer-events:none;padding:24px}
.drop b{font-family:"Space Grotesk",Inter,sans-serif;font-size:1.1rem;color:var(--fg)}
.msg{font-size:.8rem;color:var(--mut);min-height:1.2em}
.msg.err{color:var(--acc2)}
.dpanel{margin-top:12px}
.tw{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:6px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.8rem;font-variant-numeric:tabular-nums}
th,td{padding:3px 8px;text-align:right;border-bottom:1px solid var(--line)}
th{position:sticky;top:0;background:#d6d1c2;font-family:"Space Grotesk",Inter,sans-serif;font-weight:600}
tbody tr{cursor:pointer}tbody tr.sel{background:rgba(74,90,78,.16)}
input[type=range]{width:100%;accent-color:var(--acc)}
.sw{display:inline-block;width:22px;height:22px;border-radius:4px;border:1px solid var(--line);vertical-align:middle;background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/8px 8px}
label.inl{display:flex;gap:6px;align-items:center;font-size:.82rem}
.note{color:var(--mut);font-size:.74rem;line-height:1.4;margin-top:10px}
.panel h2{cursor:pointer;user-select:none;margin-bottom:0}
.panel h2 .tt{margin-left:auto}
.panel h2 .chev{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--mut);transition:transform .15s}
.panel.collapsed h2 .chev{transform:rotate(-90deg)}
.panel .body{margin-top:6px}
.panel.collapsed .body{display:none}
.tt{position:relative;display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--mut);font:600 .68rem Inter,sans-serif;cursor:help;flex:none}
.tt:hover,.tt:focus{border-color:var(--acc);color:var(--acc);outline:none}
.tt::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);right:-6px;width:260px;padding:8px 10px;background:var(--fg);color:#f5f3ed;border-radius:6px;font:400 .76rem/1.4 Inter,sans-serif;text-align:left;white-space:normal;box-shadow:0 4px 14px rgba(0,0,0,.22);z-index:20;opacity:0;visibility:hidden;transition:opacity .12s;pointer-events:none}
.tt:hover::after,.tt:focus::after{opacity:1;visibility:visible}
.top .tt{background:transparent;border-color:rgba(245,243,237,.55);color:#f5f3ed}
.top .tt:hover,.top .tt:focus{border-color:#fff;color:#fff}
.top .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top .bar select,.top .bar button{padding:.2rem .5rem;font-size:.8rem}
.top .bar button.pri{background:#f5f3ed;color:var(--acc);border-color:#f5f3ed}
.top .bar label{display:flex;gap:4px;align-items:center;font-size:.8rem}
.top .bar .msg{color:#f5f3ed;opacity:.9;min-height:0;font-size:.78rem}
.top{align-items:center}
@media (max-width:900px){.layout{grid-template-columns:1fr}}

.stage{position:relative;height:max(520px,76vh)}
.banner{pointer-events:none;position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:80%;z-index:3;background:var(--fg);color:#f5f3ed;border-radius:6px;padding:7px 14px;font-size:.84rem;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.banner.err{background:var(--acc2)}
.panel h2{cursor:pointer;user-select:none;margin-bottom:0}
.panel h2 .tt{margin-left:auto}
.panel h2 .chev{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--mut);transition:transform .15s}
.panel.collapsed h2 .chev{transform:rotate(-90deg)}
.panel .body{margin-top:6px}.panel.collapsed .body{display:none}
.tt{position:relative;display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--mut);font:600 .68rem Inter,sans-serif;cursor:help;flex:none}
.tt:hover,.tt:focus{border-color:var(--acc);color:var(--acc);outline:none}
.tt::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);right:-6px;width:280px;padding:8px 10px;background:var(--fg);color:#f5f3ed;border-radius:6px;font:400 .76rem/1.4 Inter,sans-serif;text-align:left;white-space:normal;box-shadow:0 4px 14px rgba(0,0,0,.22);z-index:20;opacity:0;visibility:hidden;transition:opacity .12s;pointer-events:none}
.tt:hover::after,.tt:focus::after{opacity:1;visibility:visible}
.top .tt{background:transparent;border-color:rgba(245,243,237,.55);color:#f5f3ed}
.top .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top .bar button{padding:.2rem .5rem;font-size:.8rem}
.top .bar button.pri{background:#f5f3ed;color:var(--acc);border-color:#f5f3ed}
.top .bar label{display:flex;gap:4px;align-items:center;font-size:.8rem}
.top .bar .msg{color:#f5f3ed;opacity:.9;min-height:0;font-size:.78rem}
.top{align-items:center}
.side{position:sticky;top:8px;align-self:start;max-height:calc(100vh - 16px);overflow-y:auto;padding-right:2px}
textarea{width:100%;font:12px/1.35 ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:4px;padding:6px;resize:vertical;white-space:pre}
.pg{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center;font-size:.82rem;margin:4px 0}.pg input,.pg select{width:100%}
.g3{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:4px 8px;align-items:center;font-size:.82rem}.g3 input{width:100%}
canvas.v{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:4px;margin-top:6px}
table.cvt{width:100%;font-size:.76rem;margin-top:6px}table.cvt th,table.cvt td{padding:2px 5px;text-align:right}table.cvt th:first-child,table.cvt td:first-child{text-align:left}
table.cvt tr.best td{background:rgba(74,90,78,.18);font-weight:600}table.cvt .err{color:var(--acc2);text-align:left}
@media (max-width:900px){.layout{grid-template-columns:1fr}.side{position:static;max-height:none}}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{padding:.35rem .9rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 8px 8px;position:relative;min-width:0}
.card h3{font:600 .86rem "Space Grotesk",Inter,sans-serif;margin:2px 4px 2px;display:flex;align-items:center;gap:6px}
.card h3 .sp{margin-left:auto}
.card h3 button{padding:.05rem .4rem;font-size:.72rem}
.card canvas{width:100%;height:340px;display:block}
.card.wide{grid-column:1/-1}.card.wide canvas{height:460px}
.legend{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:.8rem;margin:0 0 10px;color:var(--mut)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;border:1px solid #232220;vertical-align:-1px;margin-right:4px}
.legend i.x{border:none;background:none;width:auto;height:auto;font-style:normal;color:#9a968a;font-weight:700;margin-right:3px}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--fg);color:#f5f3ed;border-radius:6px;padding:5px 9px;font-size:.76rem;line-height:1.35;display:none;max-width:300px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.chip{display:inline-block;padding:0 7px;border-radius:9px;font-size:.72rem;font-weight:600}
.chip.ok{background:rgba(74,90,78,.2);color:#3a4a3e}.chip.warn{background:rgba(168,98,58,.2);color:#8a4e2c}.chip.masked{background:#e3dfd2;color:#5c5a52}.chip.excluded{background:#d8c9c2;color:#7a3a2a}
.rules{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:start;font-size:.8rem}
.rules .r{display:contents}.rules input[type=number]{width:62px;padding:.1rem .3rem}.rules select{padding:.1rem .2rem;font-size:.76rem}
.rules .act{display:block;margin-top:2px}
.sum{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 10px}.sum div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:.8rem}.sum b{font:700 1.2rem "Space Grotesk",Inter,sans-serif;display:block}
.tw.tall{max-height:62vh}
td.l,th.l{text-align:left}
.pane{display:none}.pane.on{display:block}
.empty{padding:40px 16px;text-align:center;color:var(--mut)}

</head><body>
<div class="top"><h1>Rock-Eval QC &amp; plots</h1>
 <div class="bar"><span style="opacity:.85;font-size:.8rem">Export</span>
  <button class="pri" id="bCopy" title="Copy the cleaned table (rejected rows removed, masked values blanked) as tab-separated text, ready to paste into Excel">Copy clean</button>
  <button id="bClean" title="Cleaned table: rejected/excluded rows and standards removed, masked values blanked">Clean CSV</button>
  <button id="bQC" title="Every row with its QC status and the list of flags">QC CSV</button>
  <span class="msg" id="exportMsg"></span>
  <span class="tt" tabindex="0" data-tip="Everything runs locally in your browser: your data never leave it. Paste or open a Rock-Eval table (CSV, TSV, or copied from Excel). Columns are recognised from their names and can be reassigned. Rules and thresholds are editable; nothing is hidden: a flagged point stays visible as a grey cross unless you turn that off.">?</span></div>
 <a href="https://romaingiboreau.github.io/My_Website/">← Back to site</a></div>
<div class="layout">
<aside class="side">
 <section class="panel"><h2><span class="n">1</span>Data<i class="chev"></i></h2>
  <div class="body"><textarea id="paste" rows="6" placeholder="Sample&#9;Depth&#9;S1&#9;S2&#9;S3&#9;Tmax&#9;TOC&#10;A-01&#9;2010&#9;0.8&#9;9.1&#9;0.4&#9;429&#9;2.4&#10;…" spellcheck="false"></textarea>
  <input type="file" id="file" accept=".csv,.txt,.tsv,.dat,text/*" hidden>
  <div class="row"><button class="pri" id="bOpen">Open file…</button><button id="bExample">Example</button></div>
  <div class="msg" id="dataMsg">No data yet.</div></div></section>
 <section class="panel"><h2><span class="n">2</span>Columns<span class="tt" tabindex="0" data-tip="Detected from the column names (S1, S2, S3, Tmax/Tpeak, TOC, HI, OI, PI, PC, RC, MinC, depth, sample, formation…). Change any of them. HI, OI and PI are recomputed from S1, S2, S3 and TOC when absent; when present in the file they are compared with the recomputed values. Rows whose sample name matches the standards pattern are kept apart and shown as control charts.">?</span><i class="chev"></i></h2>
  <div class="body"><div class="pg" id="colMap"></div>
  <div class="pg"><span>Standards (regex)</span><input type="text" id="stdre" value="^(std|standard|ref)"></div></div></section>
 <section class="panel"><h2><span class="n">3</span>QC rules<span class="tt" tabindex="0" data-tip="Each rule can be switched off, has an editable threshold and an action: Flag only (the point stays coloured), Mask (the point is greyed in the plots that depend on the suspect value: Tmax, or HI/OI), or Exclude (the sample is greyed everywhere and removed from the clean export). Default thresholds are common practice, not a standard: adjust them to your lab and your basin.">?</span><i class="chev"></i></h2>
  <div class="body"><div class="rules" id="rules"></div></div></section>
 <section class="panel"><h2><span class="n">4</span>Display<i class="chev"></i></h2>
  <div class="body"><div class="pg"><span>Colour by</span><select id="colby"><option value="qc">QC status</option><option value="group">Group</option><option value="depth">Depth</option></select></div>
  <label class="inl"><input type="checkbox" id="showGrey" checked>Show masked / excluded as grey crosses</label>
  <label class="inl"><input type="checkbox" id="logS" checked>Log axes for S1, S2 vs TOC</label></div></section>
</aside>
<main>
 <div class="tabs"><button class="on" data-t="plots">Crossplots</button><button data-t="prof">Depth profiles</button><button data-t="qc">QC report</button><button data-t="std">Standards</button></div>
 <div class="legend" id="legend"></div>
 <div class="pane on" id="t_plots"><div class="cards" id="cards"></div></div>
 <div class="pane" id="t_prof"><div class="cards"><div class="card wide"><h3>Depth profiles<span class="sp"></span><button data-png="cvProf">PNG</button></h3><canvas id="cvProf"></canvas></div></div></div>
 <div class="pane" id="t_qc"><div class="sum" id="sum"></div><div class="row"><span style="font-size:.82rem">Show</span><select id="qcf"><option value="all">all samples</option><option value="flag">flagged only</option><option value="ok">ok</option><option value="warn">warn</option><option value="masked">masked</option><option value="excluded">excluded</option></select></div><div class="tw tall"><table id="qcT"></table></div></div>
 <div class="pane" id="t_std"><div class="cards" id="stdCards"></div><div class="msg" id="stdMsg"></div></div>
</main></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toN=s=>{if(typeof s==='number')return s;s=String(s==null?'':s).trim().replace(/\s/g,'');if(s===''||/^(nan|na|n\/a|nd|null|-+)$/i.test(s))return NaN;
  if(/^[-+]?\d{1,3}(\.\d{3})+,\d+$/.test(s))s=s.replace(/\./g,'').replace(',','.');else if(s.includes(',')&&!s.includes('.'))s=s.replace(',','.');
  return /^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(s)?+s:NaN};
const fmt=v=>!isFinite(v)?'–':(Math.abs(v)>=1e5||(Math.abs(v)<1e-3&&v!==0))?v.toExponential(2):String(+v.toPrecision(5));
const f3=v=>isFinite(v)?String(+v.toFixed(3)):'';
function rng(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
let banT=null;function banner(m,err){let b=$('banner');if(!b){b=document.createElement('div');b.id='banner';document.body.appendChild(b);b.style.cssText='position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:60;pointer-events:none;border-radius:6px;padding:7px 14px;font-size:.84rem;box-shadow:0 4px 14px rgba(0,0,0,.25);color:#f5f3ed;max-width:80%'}
  b.textContent=m;b.style.background=err?'#a8623a':'#232220';b.style.display='block';clearTimeout(banT);banT=setTimeout(()=>{b.style.display='none'},err?9000:3500)}
function download(name,text,mime){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime||'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function copyText(t,ok){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>banner(ok||'Copied.'),()=>fallbackCopy(t,ok));else fallbackCopy(t,ok)}
function fallbackCopy(t,ok){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');banner(ok||'Copied.')}catch(e){banner('Copy failed.',true)}a.remove()}
const csvCell=(v,sep)=>{v=v==null?'':String(v);return(v.includes(sep)||v.includes('"')||v.includes('\n'))?'"'+v.replace(/"/g,'""')+'"':v};
document.querySelectorAll('.panel>h2').forEach(h=>h.addEventListener('click',e=>{if(e.target.closest('.tt'))return;h.parentElement.classList.toggle('collapsed')}));
// ---- table parsing (tab, ;, , or whitespace separated; optional header and units row)
function parseTable(text,minCols){
  const lines=text.replace(/\r/g,'').split('\n').map(l=>l.replace(/\s+$/,'')).filter(l=>l.trim()&&!/^(#|\/\/)/.test(l.trim()));if(!lines.length)return{err:'Empty input.'};
  const has=c=>lines.some(l=>l.includes(c));let sep;
  if(has('\t'))sep='\t';else if(has(';'))sep=';';else if(lines.every(l=>l.split(',').length>=(minCols||2)))sep=',';else sep=/\s+/;
  const split=l=>{if(sep===','||sep===';'){const o=[];let c='',q=false;for(const ch of l){if(ch==='"')q=!q;else if(ch===sep&&!q){o.push(c);c=''}else c+=ch}o.push(c);return o.map(s=>s.trim())}return l.split(sep).map(s=>s.trim().replace(/^"|"$/g,''))};
  let rows=lines.map(split);const nc=Math.max(...rows.map(r=>r.length));if(nc<(minCols||2))return{err:`At least ${minCols||2} columns are needed.`};
  const numFrac=r=>r.filter(s=>s!==''&&isFinite(toN(s))).length/Math.max(1,r.filter(s=>s!=='').length);
  let head=null,units=null;if(numFrac(rows[0])<0.5){head=rows.shift();if(rows.length&&numFrac(rows[0])<0.34&&rows.length>1&&rows[0].every(s=>s===''||isNaN(toN(s)))){units=rows.shift()}}
  if(!head)head=Array.from({length:nc},(_,i)=>'col '+(i+1));while(head.length<nc)head.push('col '+(head.length+1));
  rows=rows.map(r=>{while(r.length<nc)r.push('');return r});
  return{head,units,rows,nc,sep:sep===/\s+/?' ':sep}}
const normName=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
// ---- plotting engine ----------------------------------------------------------------
const PAL=['#4a5a4e','#a8623a','#3b6ea5','#c9a227','#7b4f9d','#2a9d8f','#d1495b','#8d6b3f','#6b7f2a','#444444'];
function niceStep(r,n){const raw=r/n,p=Math.pow(10,Math.floor(Math.log10(raw))),m=raw/p;return(m<1.5?1:m<2.25?2:m<3.5?2.5:m<7.5?5:10)*p}
function lin(lo,hi,n){const st=niceStep(hi-lo,n),a=Math.ceil(lo/st-1e-9)*st,t=[];for(let v=a;v<=hi+st*1e-9;v+=st)t.push(+v.toPrecision(12));return t}
function logt(lo,hi){const t=[];for(let e=Math.floor(Math.log10(lo));e<=Math.ceil(Math.log10(hi));e++)for(const m of[1,2,5]){const v=m*Math.pow(10,e);if(v>=lo*0.999&&v<=hi*1.001)t.push(v)}return t}
const tickTxt=v=>(Math.abs(v)>=1e5||(Math.abs(v)<1e-2&&v!==0))?v.toExponential(0):String(+v.toPrecision(6));

/* spec: {title, ylab, ylim, yrev, ylog, panels:[{xlab,xlim,xlog,pts:[{x,y,c,g(rey),info}],lines:[{x:[],y:[],c,w,dash,label}],vlines:[{v,c,label}],hlines:[{v,c,label}]}], sq(uare)} */
function drawChart(cv,spec){

  const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.fillStyle='#fff';x.fillRect(0,0,W,H);
  const P=spec.panels,np=P.length,L=58,R=10,T=spec.title?22:10,B=44,gap=np>1?10:0,pw=(W-L-R-gap*(np-1))/np,ph=H-T-B;
  const fin=Number.isFinite;

  let ys=[];for(const p of P){for(const q of p.pts)if(fin(q.y))ys.push(q.y);for(const l of p.lines||[])for(const v of l.y)if(fin(v))ys.push(v)}
  let [y0,y1]=spec.ylim||[Math.min(...ys),Math.max(...ys)];if(!fin(y0)||!fin(y1)){y0=0;y1=1}if(y0===y1){y0-=1;y1+=1}

  x.font='11px Inter,sans-serif';x.textBaseline='middle';cv._hits=[];
  if(spec.title){x.fillStyle='#232220';x.font='600 12px "Space Grotesk",Inter,sans-serif';x.textAlign='left';x.fillText(spec.title,L,10)}
  P.forEach((p,k)=>{
    const ox=L+k*(pw+gap);let xs=[];for(const q of p.pts)if(fin(q.x))xs.push(q.x);
    let [x0,x1]=p.xlim||[Math.min(...xs),Math.max(...xs)];if(!fin(x0)||!fin(x1)){x0=0;x1=1}if(x0===x1){x0-=1;x1+=1}
    if(!p.xlim){if(p.xlog){x0/=1.15;x1*=1.15}else{const pd=(x1-x0)*0.05;x0-=pd;x1+=pd}}
    const fx=p.xlog?Math.log10:v=>v,xa=fx(x0),xb=fx(x1),px=v=>p.xrev?ox+pw-(fx(v)-xa)/(xb-xa)*pw:ox+(fx(v)-xa)/(xb-xa)*pw;

    for(const v of p.vlines||[]){const u=px(v.v);x.strokeStyle=v.c||'#a8623a';x.setLineDash([5,4]);x.beginPath();x.moveTo(u,T);x.lineTo(u,T+ph);x.stroke();x.setLineDash([]);if(v.label){x.fillStyle=v.c||'#a8623a';x.textAlign='left';x.fillText(v.label,u+3,T+9)}}
    for(const v of p.hlines||[]){const u=py(v.v);x.strokeStyle=v.c||'#a8623a';x.setLineDash([5,4]);x.beginPath();x.moveTo(ox,u);x.lineTo(ox+pw,u);x.stroke();x.setLineDash([]);if(v.label){x.fillStyle=v.c||'#a8623a';x.textAlign='left';x.fillText(v.label,ox+3,u-7)}}
    for(const l of p.lines||[]){x.strokeStyle=l.c||'#5c5a52';x.lineWidth=l.w||1.2;x.setLineDash(l.dash||[]);x.beginPath();let on=false,last=null,first=null;
      for(let i=0;i<l.x.length;i++){if(!fin(l.x[i])||!fin(l.y[i])){on=false;continue}const a=px(l.x[i]),b=py(l.y[i]);if(on)x.lineTo(a,b);else x.moveTo(a,b);on=true;last=[a,b];if(!first)first=[a,b]}x.stroke();x.setLineDash([]);
      if(l.label&&l.start&&first){x.fillStyle=l.c||'#5c5a52';x.textAlign='left';x.fillText(l.label,Math.max(first[0]+4,ox+4),Math.min(T+ph-8,first[1]-8))}else if(l.label&&last){x.fillStyle=l.c||'#5c5a52';x.textAlign='right';x.fillText(l.label,Math.min(last[0]-3,ox+pw-3),Math.max(T+8,last[1]-8))}}
    // points: grey crosses first, then coloured
    for(const q of p.pts){if(!q.g||!fin(q.x)||!fin(q.y))continue;const a=px(q.x),b=py(q.y);x.strokeStyle='#9a968a';x.lineWidth=1.3;x.beginPath();x.moveTo(a-3,b-3);x.lineTo(a+3,b+3);x.moveTo(a+3,b-3);x.lineTo(a-3,b+3);x.stroke();cv._hits.push({x:a,y:b,i:q.info})}

    x.fillStyle='#5c5a52';x.textAlign='center';x.textBaseline='top';x.font='11px Inter,sans-serif';for(const t of xt){const u=px(t);if(u>=ox-1&&u<=ox+pw+1)x.fillText(tickTxt(t),u,T+ph+4)}
    x.fillStyle='#232220';x.font='500 12px Inter,sans-serif';x.fillText(p.xlab||'',ox+pw/2,T+ph+22);
    if(k===0){x.textAlign='right';x.textBaseline='middle';x.fillStyle='#5c5a52';x.font='11px Inter,sans-serif';for(const t of yt){const u=py(t);if(u>=T-1&&u<=T+ph+1)x.fillText(tickTxt(t),ox-5,u)}
      x.save();x.translate(12,T+ph/2);x.rotate(-Math.PI/2);x.textAlign='center';x.fillStyle='#232220';x.font='500 12px Inter,sans-serif';x.fillText(spec.ylab||'',0,0);x.restore()}
    x.textBaseline='middle'});
  if(!cv._tip){cv._tip=true;cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;let best=null,bd=100;for(const h of cv._hits||[]){const d=(h.x-mx)**2+(h.y-my)**2;if(d<bd){bd=d;best=h}}
      const t=tipEl();if(best&&best.i){t.innerHTML=best.i;t.style.display='block';t.style.left=Math.min(window.innerWidth-310,e.clientX+14)+'px';t.style.top=(e.clientY+14)+'px'}else t.style.display='none'});
    cv.addEventListener('mouseleave',()=>{tipEl().style.display='none'})}}
function pngOf(cv,name){cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)})}

// =====================================================================================
//  Rock-Eval QC. Units: S1, S2 mg HC / g rock; S3 mg CO2 / g rock; Tmax °C; TOC, PC, RC, MinC wt %;
//  HI = 100 S2 / TOC (mg HC / g TOC); OI = 100 S3 / TOC (mg CO2 / g TOC); PI = S1 / (S1 + S2); OSI = 100 S1 / TOC (mg HC / g TOC).
// =====================================================================================
const FIELDS=[
 {k:'id',label:'Sample',re:/^(sample|sampleid|samplename|echantillon|ech|id|name|labno|lab)/,text:true},
 {k:'depth',label:'Depth',re:/^(depth|prof|md|tvd|z$)/},
 {k:'group',label:'Group / formation',re:/^(form|litho|well|puits|unit|group|fm$|facies|zone|stage|age)/,text:true},
 {k:'s1',label:'S1',re:/^s1/},{k:'s2',label:'S2',re:/^s2/},{k:'s3',label:'S3',re:/^s3(?!co|p)/},
 {k:'tmax',label:'Tmax',re:/^(tmax|tpeak|tmx)/},{k:'toc',label:'TOC',re:/^(toc|cot)/},
 {k:'hi',label:'HI',re:/^(hi|hydrogenindex)/},{k:'oi',label:'OI',re:/^(oi|oxygenindex)/},{k:'pi',label:'PI',re:/^(pi|productionindex)/},
 {k:'pc',label:'PC',re:/^pc/},{k:'rc',label:'RC',re:/^rc/},{k:'minc',label:'MinC',re:/^(minc|mineralcarbon)/}];
const NUM=FIELDS.filter(f=>!f.text).map(f=>f.k);
const D={table:null,map:{},rows:[],stds:[],groups:[],tab:'plots'};
// ---- QC rules. scope: which plots a "mask" removes the point from. acts: allowed actions.
const RULES=[
 {id:'neg',label:'Negative value in S1, S2, S3, TOC, PC or RC',acts:['flag','excl'],act:'excl',on:true,tip:'A negative peak or carbon content is an instrument or transcription error.'},
 {id:'s2low',label:'S2 below',p:[['thr',0.2,'mg HC/g']],scope:'tmax',acts:['flag','mask','excl'],act:'mask',on:true,tip:'Tmax read on a very small S2 peak is unreliable (usual practice, see Peters 1986, AAPG Bull. 70(3), p. 318, for the guidelines on Tmax and S2).'},
 {id:'tmaxr',label:'Tmax outside',p:[['lo',350,'°C'],['hi',600,'°C']],scope:'tmax',acts:['flag','mask','excl'],act:'mask',on:true,tip:'Physically implausible Tmax for a Rock-Eval run (instrument range, not a geological limit).'},
 {id:'toclow',label:'TOC below',p:[['thr',0.5,'wt %']],scope:'hioi',acts:['flag','mask','excl'],act:'mask',on:true,tip:'HI and OI are ratios to TOC: with very low TOC they are dominated by noise and by the mineral matrix.'},
 {id:'hihigh',label:'HI above',p:[['thr',1000,'mg HC/g TOC']],scope:'hioi',acts:['flag','mask','excl'],act:'mask',on:true,tip:'HI above about 1000 is not credible for sedimentary organic matter: contamination, wrong TOC or wrong units.'},
 {id:'osi',label:'S1/TOC × 100 above',p:[['thr',100,'mg HC/g TOC']],acts:['flag','excl'],act:'flag',on:true,tip:'Oil saturation index. Above ~100 the S1 peak is likely to contain migrated oil or contamination (mud, additives): HI and Tmax of such samples are biased.'},
 {id:'picons',label:'PI differs from S1/(S1+S2) by more than',p:[['tol',0.03,'']],acts:['flag','excl'],act:'flag',on:true,tip:'PI in the file is compared with the value recomputed from S1 and S2.'},

 {id:'oihigh',label:'OI above',p:[['thr',200,'mg CO2/g TOC']],scope:'hioi',acts:['flag','mask','excl'],act:'flag',on:true,tip:'Very high OI usually means CO2 from carbonates or oxidation, not organic oxygen; check MinC.'},

const ACTN={flag:'Flag only',mask:'Mask',excl:'Exclude'};
function buildRulesUI(){$('rules').innerHTML=RULES.map(r=>`<div class="r"><input type="checkbox" data-r="${r.id}" ${r.on?'checked':''}><div>${esc(r.label)} ${(r.p||[]).map(([k,v,u])=>`<input type="number" step="any" data-rp="${r.id}.${k}" value="${v}"> ${esc(u)}`).join(' ')}<span class="tt" tabindex="0" data-tip="${esc(r.tip)}" style="margin-left:4px;width:15px;height:15px">?</span>
  <span class="act"><select data-ra="${r.id}">${r.acts.map(a=>`<option value="${a}"${a===r.act?' selected':''}>${ACTN[a]}</option>`).join('')}</select></span></div></div>`).join('');
  $('rules').querySelectorAll('input,select').forEach(e=>e.addEventListener('change',refresh))}
const rv=(id,k)=>{const e=document.querySelector(`[data-rp="${id}.${k}"]`);const v=e?+e.value:NaN;return isFinite(v)?v:RULES.find(r=>r.id===id).p.find(p=>p[0]===k)[1]};
const ron=id=>document.querySelector(`[data-r="${id}"]`).checked,ract=id=>document.querySelector(`[data-ra="${id}"]`).value;
// ---- loading
function fillMap(){const t=D.table,used=new Set();D.map={};
  for(const f of FIELDS){let j=-1;for(let i=0;i<t.nc;i++){if(used.has(i))continue;if(f.re.test(normName(t.head[i]))){j=i;break}}if(j>=0)used.add(j);D.map[f.k]=j}
  $('colMap').innerHTML=FIELDS.map(f=>`<span>${f.label}</span><select data-m="${f.k}"><option value="-1">—</option>${t.head.map((h,i)=>`<option value="${i}"${D.map[f.k]===i?' selected':''}>${esc(h)}</option>`).join('')}</select>`).join('');
  $('colMap').querySelectorAll('select').forEach(e=>e.onchange=()=>{D.map[e.dataset.m]=+e.value;build()})}
function loadText(text){const t=parseTable(text,3);if(t.err){$('dataMsg').textContent=t.err;$('dataMsg').className='msg err';return false}D.table=t;fillMap();build();return true}
$('paste').addEventListener('input',()=>{clearTimeout(D.pt);D.pt=setTimeout(()=>{if($('paste').value.trim())loadText($('paste').value)},350)});
$('bOpen').onclick=()=>$('file').click();
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('paste').value=r.result.length>3e6?r.result.slice(0,3e6):r.result;loadText(r.result)};r.readAsText(f);e.target.value=''};
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('paste').value=r.result;loadText(r.result)};r.readAsText(f)});
$('stdre').addEventListener('change',()=>{if(D.table)build()});
function build(){const t=D.table;if(!t)return;const M=D.map;let re;try{re=new RegExp($('stdre').value,'i')}catch(e){re=null}
  D.rows=[];D.stds=[];
  t.rows.forEach((r,n)=>{const o={n,raw:r};for(const f of FIELDS){const j=M[f.k];o[f.k]=j>=0?(f.text?(r[j]||'').trim():toN(r[j])):(f.text?'':NaN)}
    if(!o.id)o.id='#'+(n+1);
    const isStd=re&&re.test(String(o.id).trim());(isStd?D.stds:D.rows).push(o)});
  for(const o of D.rows.concat(D.stds)){o.hiC=isFinite(o.s2)&&o.toc>0?100*o.s2/o.toc:NaN;o.oiC=isFinite(o.s3)&&o.toc>0?100*o.s3/o.toc:NaN;o.piC=isFinite(o.s1)&&isFinite(o.s2)&&o.s1+o.s2>0?o.s1/(o.s1+o.s2):NaN;o.osi=isFinite(o.s1)&&o.toc>0?100*o.s1/o.toc:NaN;
    o.HI=isFinite(o.hi)?o.hi:o.hiC;o.OI=isFinite(o.oi)?o.oi:o.oiC;o.PI=isFinite(o.pi)?o.pi:o.piC}
  D.groups=[...new Set(D.rows.map(o=>o.group).filter(g=>g))];
  const has=NUM.filter(k=>M[k]>=0).map(k=>FIELDS.find(f=>f.k===k).label);
  $('dataMsg').className='msg';$('dataMsg').textContent=`${D.rows.length} samples${D.stds.length?` + ${D.stds.length} standard run(s)`:''} · numeric columns: ${has.join(', ')||'none'}${M.s2<0||M.toc<0?' · S2 and TOC are needed for most plots':''}`;
  refresh()}
// ---- QC
function qc(){
  const nmap=new Map(),dmap=new Map();for(const o of D.rows){const a=String(o.id).toLowerCase();nmap.set(a,(nmap.get(a)||0)+1);if(isFinite(o.depth)){const k=o.depth+'|'+o.group;dmap.set(k,(dmap.get(k)||0)+1)}}
  for(const o of D.rows){o.flags=[];o.maskT=false;o.maskH=false;o.excluded=false;
    const add=(id,txt)=>{if(!ron(id))return;const a=ract(id),R=RULES.find(r=>r.id===id);o.flags.push(txt);if(a==='excl')o.excluded=true;else if(a==='mask'){if(R.scope==='tmax')o.maskT=true;else o.maskH=true}};
    if(['s1','s2','s3','toc','pc','rc'].some(k=>o[k]<0))add('neg','negative value');
    if(o.s2<rv('s2low','thr'))add('s2low',`S2 < ${rv('s2low','thr')}`);
    if(o.tmax<rv('tmaxr','lo')||o.tmax>rv('tmaxr','hi'))add('tmaxr','Tmax out of range');
    if(o.toc<rv('toclow','thr'))add('toclow',`TOC < ${rv('toclow','thr')}`);
    if(o.HI>rv('hihigh','thr'))add('hihigh','HI implausible');
    if(o.osi>rv('osi','thr'))add('osi',`S1/TOC×100 = ${Math.round(o.osi)}`);
    if(isFinite(o.pi)&&isFinite(o.piC)&&Math.abs(o.pi-o.piC)>rv('picons','tol'))add('picons','PI inconsistent');
    const tl=rv('hicons','tol')/100;
    if((isFinite(o.hi)&&isFinite(o.hiC)&&Math.abs(o.hi-o.hiC)>tl*o.hiC+2)||(isFinite(o.oi)&&isFinite(o.oiC)&&Math.abs(o.oi-o.oiC)>tl*o.oiC+2))add('hicons','HI/OI inconsistent');
    if(isFinite(o.toc)&&isFinite(o.pc)&&isFinite(o.rc)&&Math.abs(o.toc-o.pc-o.rc)>rv('toccons','tol')/100*o.toc)add('toccons','TOC ≠ PC + RC');
    if(o.OI>rv('oihigh','thr'))add('oihigh','OI high');
    if(nmap.get(String(o.id).toLowerCase())>1||(isFinite(o.depth)&&dmap.get(o.depth+'|'+o.group)>1))add('dup','duplicate');
    o.status=o.excluded?'excluded':(o.maskT||o.maskH)?'masked':o.flags.length?'warn':'ok'}}
// ---- colours
function colorOf(o){const m=$('colby').value;
  if(m==='group'&&D.groups.length)return PAL[Math.max(0,D.groups.indexOf(o.group))%PAL.length];
  if(m==='depth'){const d=D.dr;if(d&&isFinite(o.depth)){const t=(o.depth-d[0])/((d[1]-d[0])||1),a=[74,90,78],b=[168,98,58],c=a.map((v,i)=>Math.round(v+(b[i]-v)*t));return`rgb(${c})`}}
  return o.status==='warn'?'#a8623a':'#4a5a4e'}
function legend(){const m=$('colby').value;let h='';
  if(m==='group'&&D.groups.length)h=D.groups.map((g,i)=>`<span><i style="background:${PAL[i%PAL.length]}"></i>${esc(g)}</span>`).join('');
  else if(m==='depth'&&D.dr)h=`<span><i style="background:#4a5a4e"></i>${fmt(D.dr[0])}</span><span>→</span><span><i style="background:#a8623a"></i>${fmt(D.dr[1])} (depth)</span>`;
  else h='<span><i style="background:#4a5a4e"></i>ok</span><span><i style="background:#a8623a"></i>flagged (warning)</span>';
  h+='<span><i class="x">×</i>masked / excluded</span>';$('legend').innerHTML=h}
function info(o){const f=(l,v,u)=>isFinite(v)?`<br>${l} ${fmt(v)}${u||''}`:'';
  return`<b>${esc(o.id)}</b>${o.group?' · '+esc(o.group):''}${f('depth',o.depth)}${f('S1',o.s1)}${f('S2',o.s2)}${f('S3',o.s3)}${f('Tmax',o.tmax,' °C')}${f('TOC',o.toc,' %')}${f('HI',o.HI)}${f('OI',o.OI)}${f('PI',o.PI)}${o.flags.length?'<br>⚑ '+o.flags.map(esc).join('; '):''}`}
// ---- charts
function pt(o,xv,yv,need){const g=o.excluded||(need.t&&o.maskT)||(need.h&&o.maskH);if(g&&!$('showGrey').checked)return null;return{x:xv,y:yv,g,c:colorOf(o),info:info(o)}}
// Tmax <= 0 or > 650 degC is a missing/failed measurement (Rock-Eval reports 0): never plot it nor let it set the axis
const TMX=t=>t>=300&&t<=650;
function mk(rows,fx,fy,need){const out=[];for(const o of rows){const x=fx(o),y=fy(o);if(!isFinite(x)||!isFinite(y))continue;const p=pt(o,x,y,need);if(p)out.push(p)}return out}
// logical axis bounds: Tmax window around the oil window, indices from 0, PI in [0,1]; based on points actually drawn
function lim(pts,k,kind){const v=pts.filter(q=>!q.g&&isFinite(q[k])).map(q=>q[k]);const all=pts.filter(q=>isFinite(q[k])).map(q=>q[k]);const a=v.length?v:all;if(!a.length)return undefined;
  const lo=Math.min(...a),hi=Math.max(...a);
  if(kind==='tmax')return[Math.floor((Math.min(lo,425)-5)/10)*10,Math.ceil((Math.max(hi,475)+5)/10)*10];
  if(kind==='pi')return[0,Math.min(1,Math.max(0.1,Math.ceil(hi*11)/10))];
  if(kind==='idx')return[0,Math.ceil(hi*1.05/50)*50||50];
  return undefined}
function renderCharts(){const R=D.rows,log=$('logS').checked,cards=[];
