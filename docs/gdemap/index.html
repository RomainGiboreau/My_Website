<!doctype html><html><head><title>GDE map generator</title></head><body><div class="top"><h1>GDE map generator</h1></div>
<script id="gde-core">
/* GDE map generator core: conceptual belts on a proximal-distal coordinate, calibrated on wells. Pure logic, no DOM; window.GDE.
   Tested by scripts/gde_test.mjs. Polygon tracing, shared-arc simplification and the IRAP / GeoJSON / CSV writers are copied from

(function(){

  ['Shoreface','#f3d955',0.7,['upper shoreface','lower shoreface','beach','foreshore','shoreline','shallow marine sand']],
  ['Offshore transition','#cfe5c6',1,['transition zone','offshore transition zone']],
  ['Offshore shelf','#a9d3ec',2.4,['offshore','shelf','inner shelf','outer shelf','open shelf']],
  ['Slope','#6c9fcd',1.4,['continental slope']],
  ['Basin','#3c6aa3',2,['basin floor','deep basin','deep marine']]]),

  ['Delta plain','#9fc46e',3,['upper delta plain','lower delta plain','deltaic plain','distributary channel']],
  ['Delta front','#f3d34f',1,['mouth bar','delta front sand']],
  ['Prodelta','#c8dcc0',1.5,['pro delta']],
  ['Shelf','#a9d3ec',2.5,['offshore shelf','offshore','open shelf']],
  ['Slope','#6c9fcd',1.5,['continental slope']],
  ['Basin','#3c6aa3',2,['basin floor','deep basin','deep marine']]]),

  ['Slope / canyon','#97a9bd',2,['upper slope','feeder canyon','slope channel']],
  ['Channel–levee complex','#e7a043',2.5,['channel levee','channel levee system','channel','leveed channel','inner fan']],
  ['Proximal lobes','#f4d35e',2,['lobe','mid fan','middle fan','lobe complex']],
  ['Distal lobes / lobe fringe','#f6ebb0',2,['outer fan','distal fan','fringe']],
  ['Basin plain','#5a80b3',2,['basin floor','basin','abyssal plain']]]),

  ['Inner platform / lagoon','#9edfd3',3,['platform interior','tidal flat','restricted platform']],
  ['Platform margin (reef / shoal)','#e98fb1',0.8,['shelf margin','barrier','oolite shoal','margin']],
  ['Fore-reef slope','#64b3c7',1.5,['foreslope','fore reef','slope']],
  ['Basin','#3c6aa3',2,['basin floor','deep basin']]]),

  ['Alluvial fan / proximal','#a8703d',1.5,['alluvial fan','fanglomerate']],
  ['Braided plain','#d29f5a',2,['braided river','braided']],
  ['Meandering belt','#e5c784',2.5,['meandering river','meander belt','meandering']],
  ['Floodplain–coastal plain','#a5c47a',2,['floodplain','coastal plain','flood plain']]]),

// ---------- environment names -> belt index (case-insensitive, punctuation and plural tolerant) ----------
const norm=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()

  for(let i=0;i<belts.length;i++)if(norm(belts[i].name)===e)return i;

  return -1}
// ---------- wells table: name, x, y, environment (tab, ';', ',' or spaces) ----------
const NUMRE=/^[-+]?(\d+\.?\d*|\.\d+)([eE][-+]?\d+)?$/;

  String(text||'').split(/\r?\n/).forEach((ln,i)=>{const s=ln.trim();if(!s||s[0]==='#'||s[0]==='!')return;let f;
    if(s.includes('\t'))f=s.split('\t');else if(s.includes(';'))f=s.split(';');else if(s.includes(','))f=s.split(',');

// ---------- model ----------
function makeModel(key,o={}){const t=templates[key]||templates.shelf;

// prior boundaries: belt k starts at the sum of the widths before it, scaled so that the most distal belt starts at `span` from the source

// proximal-distal coordinate: linear = projection on the transport azimuth (clockwise from north) from the source point;

const smooth=u=>u*u*(3-2*u);

  const f=(x,y,z)=>{let X=Math.floor(x),Y=Math.floor(y),Z=Math.floor(z);x-=X;y-=Y;z-=Z;X&=255;Y&=255;Z&=255;
    const u=fade(x),v=fade(y),w=fade(z),A=p[X]+Y,AA=p[A]+Z,AB=p[A+1]+Z,B=p[X+1]+Y,BA=p[B]+Z,BB=p[B+1]+Z;
    return lerp(lerp(lerp(g(p[AA],x,y,z),g(p[BA],x-1,y,z),u),lerp(g(p[AB],x,y-1,z),g(p[BB],x-1,y-1,z),u),v),
      lerp(lerp(g(p[AA+1],x,y,z-1),g(p[BA+1],x-1,y,z-1),u),lerp(g(p[AB+1],x,y-1,z-1),g(p[BB+1],x-1,y-1,z-1),u),v),w)};
  const o=[0,1,2].map(()=>[r()*256,r()*256,r()*256]),res={f,o};PCACHE.set(seed,res);if(PCACHE.size>64)PCACHE.delete(PCACHE.keys().next().value);return res}

function field(M){const amp=+(M.noise&&M.noise.amp)||0;if(!(amp>0))return(x,y)=>dBase(M,x,y);

  return(x,y)=>{const d=dBase(M,x,y);if(!isFinite(d))return d;const X=x/wl,Y=y/wl,Zz=d/wz;

const classify=(d,t)=>{if(d!==d)return 0;let k=0;while(k<t.length&&d>=t[k])k++;return k};
// ---------- calibration ----------
// longest chain of wells whose order along d agrees with the belt order (wells with an infinite d outside the distal belt excluded)
function chain(d,b,n1){const idx=[];for(let i=0;i<d.length;i++)if(b[i]>=0&&b[i]<=n1&&d[i]===d[i]&&(isFinite(d[i])||b[i]===n1))idx.push(i);
  idx.sort((i,j)=>(d[i]===d[j]?0:d[i]-d[j])||b[i]-b[j]||i-j);
  const L=idx.map(()=>1),pr=idx.map(()=>-1),ok=(i,j)=>b[i]<b[j]?d[i]<d[j]:b[i]===b[j];
  for(let a=0;a<idx.length;a++)for(let c=0;c<a;c++)if(ok(idx[c],idx[a])&&L[c]+1>L[a]){L[a]=L[c]+1;pr[a]=c}
  let best=-1;for(let a=0;a<idx.length;a++)if(best<0||L[a]>L[best])best=a;

  for(const i of S)for(let k=0;k<n1;k++){if(b[i]<=k)lo[k]=Math.max(lo[k],d[i]);else hi[k]=Math.min(hi[k],d[i])}

function calibrate(d,b,p,opt={}){const n1=p.length,S=chain(d,b,n1),inS=new Set(S);

    for(let k=z+1;k<n1;k++){const w=sc*(p[k]-p[k-1]);t[k]=Math.max(t[k-1]+w,lo[k]+.25*w)}}

// ---------- warping: truncated Gaussian RBF of the d offsets needed at the conflicting wells ----------
