<div class="top"><h1>Convex & concave hulls</h1>
 <div class="bar"><span style="opacity:.85;font-size:.8rem">Export</span>
  <button class="pri" id="bCsv" title="Vertices of every ring: group, polygon, ring (outer or hole), order, x, y">Vertices CSV</button>
  <button id="bWkt" title="Copy the polygons as WKT, one line per group and hull type">Copy WKT</button>
  <button id="bGeo" title="Download the polygons as a GeoJSON FeatureCollection (coordinates as in your table, no projection information)">GeoJSON</button>
  <button id="bPng">PNG</button><span class="msg" id="exportMsg"></span>
  <span class="tt" tabindex="0" data-tip="Everything runs locally in your browser: your data never leave it. The convex hull is the smallest convex polygon containing the points (Andrew's monotone chain). The concave hull is an alpha shape: the Delaunay triangulation keeps only triangles whose circumradius is below a threshold R; the boundary of what remains is the hull. Small R follows the point cloud closely and can split it into several polygons or leave holes; R → ∞ gives the convex hull. Geometry is planar: with longitude/latitude the areas and lengths are in degrees².">?</span></div>
 <a href="https://romaingiboreau.github.io/My_Website/">← Back to site</a></div>
<div class="layout">
<aside class="side">
 <section class="panel"><h2><span class="n">1</span>Data<i class="chev"></i></h2>
  <div class="body"><textarea id="paste" rows="6" placeholder="X&#9;Y&#9;Group&#10;12.5&#9;40.1&#9;A&#10;…" spellcheck="false"></textarea>
  <input type="file" id="file" accept=".csv,.txt,.tsv,.dat,text/*" hidden>
  <div class="row"><button class="pri" id="bOpen">Open file…</button><button id="bExample">Example</button></div>
  <div class="pg"><span>X</span><select id="cx"></select><span>Y</span><select id="cy"></select><span>Group</span><select id="cg"></select></div>

 <section class="panel"><h2><span class="n">2</span>Hulls<span class="tt" tabindex="0" data-tip="Triangles kept: share of Delaunay triangles retained, ranked by circumradius (smallest first). 100 % is the convex hull. Lower it until the outline follows the shape you want; the radius R that this corresponds to is shown in your data units. Fill holes keeps only the outer boundaries. Duplicated points are merged.">?</span><i class="chev"></i></h2>
  <div class="body"><div class="pg"><span>Show</span><select id="mode"><option value="both">convex + concave</option><option value="cvx">convex only</option><option value="ccv">concave only</option></select></div>

  <label class="inl"><input type="checkbox" id="holes">Fill holes (outer boundaries only)</label>

 <section class="panel"><h2><span class="n">3</span>Display<i class="chev"></i></h2>

 <div class="card" style="margin-top:12px"><h3>Results<span class="tt" tabindex="0" data-tip="Areas are in squared data units, perimeters in data units. Perimeter of the concave hull includes the boundaries of holes. Solidity = concave area / convex area: 1 for a convex cloud, small for a crescent or a ring.">?</span></h3><div class="tw" id="resT"></div></div>
</main></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toN=s=>{if(typeof s==='number')return s;s=String(s==null?'':s).trim().replace(/\s/g,'');if(s===''||/^(nan|na|n\/a|nd|null|-+)$/i.test(s))return NaN;
  if(/^[-+]?\d{1,3}(\.\d{3})+,\d+$/.test(s))s=s.replace(/\./g,'').replace(',','.');else if(s.includes(',')&&!s.includes('.'))s=s.replace(',','.');
  return /^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(s)?+s:NaN};
const fmt=v=>!isFinite(v)?'–':(Math.abs(v)>=1e5||(Math.abs(v)<1e-3&&v!==0))?v.toExponential(2):String(+v.toPrecision(5));
const f3=v=>isFinite(v)?String(+v.toFixed(3)):'';

let banT=null;function banner(m,err){let b=$('banner');if(!b){b=document.createElement('div');b.id='banner';document.body.appendChild(b);b.style.cssText='position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:60;pointer-events:none;border-radius:6px;padding:7px 14px;font-size:.84rem;box-shadow:0 4px 14px rgba(0,0,0,.25);color:#f5f3ed;max-width:80%'}
  b.textContent=m;b.style.background=err?'#a8623a':'#232220';b.style.display='block';clearTimeout(banT);banT=setTimeout(()=>{b.style.display='none'},err?9000:3500)}
function download(name,text,mime){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime||'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function copyText(t,ok){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>banner(ok||'Copied.'),()=>fallbackCopy(t,ok));else fallbackCopy(t,ok)}
function fallbackCopy(t,ok){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');banner(ok||'Copied.')}catch(e){banner('Copy failed.',true)}a.remove()}
const csvCell=(v,sep)=>{v=v==null?'':String(v);return(v.includes(sep)||v.includes('"')||v.includes('\n'))?'"'+v.replace(/"/g,'""')+'"':v};
document.querySelectorAll('.panel>h2').forEach(h=>h.addEventListener('click',e=>{if(e.target.closest('.tt'))return;h.parentElement.classList.toggle('collapsed')}));
// ---- table parsing (tab, ;, , or whitespace separated; optional header and units row)
function parseTable(text,minCols){
  const lines=text.replace(/\r/g,'').split('\n').map(l=>l.replace(/\s+$/,'')).filter(l=>l.trim()&&!/^(#|\/\/)/.test(l.trim()));if(!lines.length)return{err:'Empty input.'};
  const has=c=>lines.some(l=>l.includes(c));let sep;
  if(has('\t'))sep='\t';else if(has(';'))sep=';';else if(lines.every(l=>l.split(',').length>=(minCols||2)))sep=',';else sep=/\s+/;
  const split=l=>{if(sep===','||sep===';'){const o=[];let c='',q=false;for(const ch of l){if(ch==='"')q=!q;else if(ch===sep&&!q){o.push(c);c=''}else c+=ch}o.push(c);return o.map(s=>s.trim())}return l.split(sep).map(s=>s.trim().replace(/^"|"$/g,''))};
  let rows=lines.map(split);const nc=Math.max(...rows.map(r=>r.length));if(nc<(minCols||2))return{err:`At least ${minCols||2} columns are needed.`};
  const numFrac=r=>r.filter(s=>s!==''&&isFinite(toN(s))).length/Math.max(1,r.filter(s=>s!=='').length);
  let head=null,units=null;if(numFrac(rows[0])<0.5){head=rows.shift();if(rows.length&&numFrac(rows[0])<0.34&&rows.length>1&&rows[0].every(s=>s===''||isNaN(toN(s)))){units=rows.shift()}}
  if(!head)head=Array.from({length:nc},(_,i)=>'col '+(i+1));while(head.length<nc)head.push('col '+(head.length+1));
  rows=rows.map(r=>{while(r.length<nc)r.push('');return r});
  return{head,units,rows,nc,sep:sep===/\s+/?' ':sep}}
const normName=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
// ---- plotting engine ----------------------------------------------------------------
const PAL=['#4a5a4e','#a8623a','#3b6ea5','#c9a227','#7b4f9d','#2a9d8f','#d1495b','#8d6b3f','#6b7f2a','#444444'];
function niceStep(r,n){const raw=r/n,p=Math.pow(10,Math.floor(Math.log10(raw))),m=raw/p;return(m<1.5?1:m<2.25?2:m<3.5?2.5:m<7.5?5:10)*p}
function lin(lo,hi,n){const st=niceStep(hi-lo,n),a=Math.ceil(lo/st-1e-9)*st,t=[];for(let v=a;v<=hi+st*1e-9;v+=st)t.push(+v.toPrecision(12));return t}
function logt(lo,hi){const t=[];for(let e=Math.floor(Math.log10(lo));e<=Math.ceil(Math.log10(hi));e++)for(const m of[1,2,5]){const v=m*Math.pow(10,e);if(v>=lo*0.999&&v<=hi*1.001)t.push(v)}return t}
const tickTxt=v=>(Math.abs(v)>=1e5||(Math.abs(v)<1e-2&&v!==0))?v.toExponential(0):String(+v.toPrecision(6));
