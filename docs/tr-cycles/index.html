<title>Accès protégé</title>
<style>
:root{--bg:#fafafa;--fg:#1c1c1e;--mut:#6b6b70;--line:#d8d8dc;--acc:#2474d2}
@media (prefers-color-scheme:dark){:root{--bg:#16171a;--fg:#ececf0;--mut:#9a9aa3;--line:#33343a;--acc:#5da0f0}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.5 Inter,system-ui,sans-serif}
form{width:min(92vw,360px);padding:0 4px}
h1{font-size:1.15rem;margin:0 0 .25rem}
p{margin:0 0 1rem;color:var(--mut);font-size:.9rem}
.pwr{position:relative}
.pwr input{padding-right:2.6rem}
.eye{position:absolute;right:4px;top:4px;bottom:4px;width:2.2rem!important;margin:0!important;padding:0!important;background:transparent!important;border:0!important;color:var(--mut)!important;display:grid;place-items:center}
.eye svg{width:20px;height:20px}
input,button{font:inherit;width:100%;padding:.65rem .8rem;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--fg)}
button{margin-top:.6rem;background:var(--acc);border-color:var(--acc);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#err{min-height:1.4em;margin-top:.6rem;color:#d63b32;font-size:.88rem}
a{color:var(--mut);font-size:.85rem}
</style></head><body>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.i,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.n)},key,b64(P.c));
  const ds=new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip')));
  return ds.text();
}
const eye=document.getElementById('eye'),pwi=document.getElementById('pw');
eye.addEventListener('click',()=>{const show=pwi.type==='password';pwi.type=show?'text':'password';
  eye.setAttribute('aria-label',show?'Masquer le mot de passe':'Afficher le mot de passe');pwi.focus()});
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=document.getElementById('go'),err=document.getElementById('err');
  btn.disabled=true;err.textContent='';
  const v=pwi.value;let html=null;
  try{html=await unlock(v)}catch(x){if(v!==v.trim()){try{html=await unlock(v.trim())}catch(y){}}}
  if(html===null){err.textContent='Mot de passe incorrect.';btn.disabled=false;return}
  document.open();document.write(html);document.close();
});
if(!window.crypto||!crypto.subtle){document.getElementById('err').textContent='Navigateur non compatible (HTTPS requis).';}
