<style>
:root{--bg:#eeece6;--fg:#232220;--mut:#5c5a52;--line:#c9c4b6;--acc:#4a5a4e}

*{box-sizing:border-box}

p{margin:0 0 1rem;color:var(--mut);font-size:.9rem}
.pwr{position:relative}

.eye svg{width:20px;height:20px}
input,button{font:inherit;width:100%;padding:.65rem .8rem;border-radius:4px;border:1px solid var(--line);background:transparent;color:var(--fg)}
button{margin-top:.6rem;background:var(--acc);border-color:var(--acc);color:#f5f3ed;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}

a{color:var(--mut);font-size:.85rem}

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.i,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.n)},key,b64(P.c));
  const ds=new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip')));
  return ds.text();
}
const eye=document.getElementById('eye'),pwi=document.getElementById('pw');
eye.addEventListener('click',()=>{const show=pwi.type==='password';pwi.type=show?'text':'password';
  eye.setAttribute('aria-label',show?'Hide password':'Show password');pwi.focus()});
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=document.getElementById('go'),err=document.getElementById('err');
  btn.disabled=true;err.textContent='';
  const v=pwi.value;let html=null;
  try{html=await unlock(v)}catch(x){if(v!==v.trim()){try{html=await unlock(v.trim())}catch(y){}}}
  if(html===null){err.textContent='Incorrect password.';btn.disabled=false;return}
  document.open();document.write(html);document.close();
});
if(!window.crypto||!crypto.subtle){document.getElementById('err').textContent='Unsupported browser (HTTPS required).';}
