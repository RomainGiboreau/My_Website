<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clustering</title>
<meta name="description" content="Cluster tabular data (k-means, hierarchical, DBSCAN, Gaussian mixture) with silhouette, elbow/BIC against k, PCA view and CSV export. Runs entirely in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>

:root{--bg:#eeece6;--card:#f5f3ed;--alt:#e2ded3;--fg:#232220;--mut:#5c5a52;--line:#c9c4b6;--acc:#4a5a4e;--acc2:#a8623a}
html{color-scheme:light only}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 Inter,system-ui,sans-serif}
h1,h2{font-family:"Space Grotesk",Inter,sans-serif;margin:0}
.top{background:var(--acc);color:#f5f3ed;display:flex;gap:6px 24px;flex-wrap:wrap;align-items:baseline;justify-content:space-between;padding:12px 18px}
.top h1{font-size:1.15rem;font-weight:700}
.top a{color:#f5f3ed;opacity:.88;font-size:.85rem;text-decoration:none;border-bottom:1px solid rgba(245,243,237,.45)}
.layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;padding:14px 16px 32px}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.panel h2{font-size:.95rem;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.panel h2 .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--acc);color:#f5f3ed;font-size:.72rem}
.hint{color:var(--mut);font-size:.78rem;margin:2px 0 8px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
button,select,input[type=text],input[type=number]{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:4px;padding:.3rem .55rem}
button{cursor:pointer;background:var(--card)}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#f5f3ed}
button.on{background:var(--alt);border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
button:disabled{opacity:.5;cursor:default}
.grid2{display:grid;grid-template-columns:auto 1fr 90px;gap:4px 8px;align-items:center;font-size:.82rem}
.grid2 input{width:100%}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line)}
.dot.ok{background:var(--acc)}
.stage{position:relative;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;height:max(430px,64vh);touch-action:none}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.tools{position:absolute;left:8px;top:8px;display:flex;gap:6px;z-index:2}
.tools button{background:rgba(245,243,237,.94)}
#loupe{position:absolute;right:8px;top:8px;width:150px;height:150px;border:2px solid var(--acc);border-radius:6px;background:#fff;z-index:2;display:none;image-rendering:pixelated}
.ro{position:absolute;left:8px;bottom:8px;background:rgba(245,243,237,.94);border:1px solid var(--line);border-radius:4px;padding:2px 8px;font-size:.78rem;color:var(--mut);z-index:2;font-variant-numeric:tabular-nums}
.drop{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--mut);pointer-events:none;padding:24px}
.drop b{font-family:"Space Grotesk",Inter,sans-serif;font-size:1.1rem;color:var(--fg)}
.msg{font-size:.8rem;color:var(--mut);min-height:1.2em}
.msg.err{color:var(--acc2)}
.dpanel{margin-top:12px}
.tw{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:6px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.8rem;font-variant-numeric:tabular-nums}
th,td{padding:3px 8px;text-align:right;border-bottom:1px solid var(--line)}
th{position:sticky;top:0;background:#d6d1c2;font-family:"Space Grotesk",Inter,sans-serif;font-weight:600}
tbody tr{cursor:pointer}tbody tr.sel{background:rgba(74,90,78,.16)}
input[type=range]{width:100%;accent-color:var(--acc)}
.sw{display:inline-block;width:22px;height:22px;border-radius:4px;border:1px solid var(--line);vertical-align:middle;background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/8px 8px}
label.inl{display:flex;gap:6px;align-items:center;font-size:.82rem}
.note{color:var(--mut);font-size:.74rem;line-height:1.4;margin-top:10px}
.panel h2{cursor:pointer;user-select:none;margin-bottom:0}
.panel h2 .tt{margin-left:auto}
.panel h2 .chev{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--mut);transition:transform .15s}
.panel.collapsed h2 .chev{transform:rotate(-90deg)}
.panel .body{margin-top:6px}
.panel.collapsed .body{display:none}
.tt{position:relative;display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--mut);font:600 .68rem Inter,sans-serif;cursor:help;flex:none}
.tt:hover,.tt:focus{border-color:var(--acc);color:var(--acc);outline:none}
.tt::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);right:-6px;width:260px;padding:8px 10px;background:var(--fg);color:#f5f3ed;border-radius:6px;font:400 .76rem/1.4 Inter,sans-serif;text-align:left;white-space:normal;box-shadow:0 4px 14px rgba(0,0,0,.22);z-index:20;opacity:0;visibility:hidden;transition:opacity .12s;pointer-events:none}
.tt:hover::after,.tt:focus::after{opacity:1;visibility:visible}
.top .tt{background:transparent;border-color:rgba(245,243,237,.55);color:#f5f3ed}
.top .tt:hover,.top .tt:focus{border-color:#fff;color:#fff}
.top .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top .bar select,.top .bar button{padding:.2rem .5rem;font-size:.8rem}
.top .bar button.pri{background:#f5f3ed;color:var(--acc);border-color:#f5f3ed}
.top .bar label{display:flex;gap:4px;align-items:center;font-size:.8rem}
.top .bar .msg{color:#f5f3ed;opacity:.9;min-height:0;font-size:.78rem}
.top{align-items:center}
@media (max-width:900px){.layout{grid-template-columns:1fr}}

.stage{position:relative;height:max(520px,76vh)}
.banner{pointer-events:none;position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:80%;z-index:3;background:var(--fg);color:#f5f3ed;border-radius:6px;padding:7px 14px;font-size:.84rem;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.banner.err{background:var(--acc2)}
.panel h2{cursor:pointer;user-select:none;margin-bottom:0}
.panel h2 .tt{margin-left:auto}
.panel h2 .chev{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--mut);transition:transform .15s}
.panel.collapsed h2 .chev{transform:rotate(-90deg)}
.panel .body{margin-top:6px}.panel.collapsed .body{display:none}
.tt{position:relative;display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--mut);font:600 .68rem Inter,sans-serif;cursor:help;flex:none}
.tt:hover,.tt:focus{border-color:var(--acc);color:var(--acc);outline:none}
.tt::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);right:-6px;width:280px;padding:8px 10px;background:var(--fg);color:#f5f3ed;border-radius:6px;font:400 .76rem/1.4 Inter,sans-serif;text-align:left;white-space:normal;box-shadow:0 4px 14px rgba(0,0,0,.22);z-index:20;opacity:0;visibility:hidden;transition:opacity .12s;pointer-events:none}
.tt:hover::after,.tt:focus::after{opacity:1;visibility:visible}
.top .tt{background:transparent;border-color:rgba(245,243,237,.55);color:#f5f3ed}
.top .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top .bar button{padding:.2rem .5rem;font-size:.8rem}
.top .bar button.pri{background:#f5f3ed;color:var(--acc);border-color:#f5f3ed}
.top .bar label{display:flex;gap:4px;align-items:center;font-size:.8rem}
.top .bar .msg{color:#f5f3ed;opacity:.9;min-height:0;font-size:.78rem}
.top{align-items:center}
.side{position:sticky;top:8px;align-self:start;max-height:calc(100vh - 16px);overflow-y:auto;padding-right:2px}
textarea{width:100%;font:12px/1.35 ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:4px;padding:6px;resize:vertical;white-space:pre}
.pg{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center;font-size:.82rem;margin:4px 0}.pg input,.pg select{width:100%}
.g3{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:4px 8px;align-items:center;font-size:.82rem}.g3 input{width:100%}
canvas.v{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:4px;margin-top:6px}
table.cvt{width:100%;font-size:.76rem;margin-top:6px}table.cvt th,table.cvt td{padding:2px 5px;text-align:right}table.cvt th:first-child,table.cvt td:first-child{text-align:left}
table.cvt tr.best td{background:rgba(74,90,78,.18);font-weight:600}table.cvt .err{color:var(--acc2);text-align:left}
@media (max-width:900px){.layout{grid-template-columns:1fr}.side{position:static;max-height:none}}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{padding:.35rem .9rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 8px 8px;position:relative;min-width:0}
.card h3{font:600 .86rem "Space Grotesk",Inter,sans-serif;margin:2px 4px 2px;display:flex;align-items:center;gap:6px}
.card h3 .sp{margin-left:auto}
.card h3 button{padding:.05rem .4rem;font-size:.72rem}
.card canvas{width:100%;height:340px;display:block}
.card.wide{grid-column:1/-1}.card.wide canvas{height:460px}
.legend{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:.8rem;margin:0 0 10px;color:var(--mut)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;border:1px solid #232220;vertical-align:-1px;margin-right:4px}
.legend i.x{border:none;background:none;width:auto;height:auto;font-style:normal;color:#9a968a;font-weight:700;margin-right:3px}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--fg);color:#f5f3ed;border-radius:6px;padding:5px 9px;font-size:.76rem;line-height:1.35;display:none;max-width:300px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.chip{display:inline-block;padding:0 7px;border-radius:9px;font-size:.72rem;font-weight:600}
.chip.ok{background:rgba(74,90,78,.2);color:#3a4a3e}.chip.warn{background:rgba(168,98,58,.2);color:#8a4e2c}.chip.masked{background:#e3dfd2;color:#5c5a52}.chip.excluded{background:#d8c9c2;color:#7a3a2a}
.rules{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:start;font-size:.8rem}
.rules .r{display:contents}.rules input[type=number]{width:62px;padding:.1rem .3rem}.rules select{padding:.1rem .2rem;font-size:.76rem}
.rules .act{display:block;margin-top:2px}
.sum{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 10px}.sum div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:.8rem}.sum b{font:700 1.2rem "Space Grotesk",Inter,sans-serif;display:block}
.tw.tall{max-height:62vh}
td.l,th.l{text-align:left}
.pane{display:none}.pane.on{display:block}
.empty{padding:40px 16px;text-align:center;color:var(--mut)}

</head><body>
<div class="top"><h1>Clustering</h1>
 <div class="bar"><span style="opacity:.85;font-size:.8rem">Export</span>
  <button class="pri" id="bLab" title="Your table with the cluster number, silhouette and the first two principal components added">Labelled CSV</button>
  <button id="bSum" title="One row per cluster: size, mean of each feature, mean silhouette">Summary CSV</button>
  <button id="bPng">PNG</button><span class="msg" id="exportMsg"></span>
  <span class="tt" tabindex="0" data-tip="Everything runs locally in your browser: your data never leave it. Paste or open a table (rows = samples, columns = measurements), pick the feature columns, choose an algorithm and read the clusters on a crossplot or on the first two principal components. The silhouette and, for k-means or Gaussian mixtures, the inertia or BIC against k help choosing the number of clusters.">?</span></div>
 <a href="https://romaingiboreau.github.io/My_Website/">← Back to site</a></div>
<div class="layout">
<aside class="side">
 <section class="panel"><h2><span class="n">1</span>Data<i class="chev"></i></h2>
  <div class="body"><textarea id="paste" rows="6" placeholder="Sample&#9;GR&#9;RHOB&#9;NPHI&#10;A1&#9;110&#9;2.55&#9;0.31&#10;…" spellcheck="false"></textarea>
  <input type="file" id="file" accept=".csv,.txt,.tsv,.dat,text/*" hidden>
  <div class="row"><button class="pri" id="bOpen">Open file…</button><button id="bExample">Example</button></div>
  <div class="pg"><span>Label column</span><select id="clab"></select></div>
  <div class="hint" style="margin-top:6px">Feature columns</div><div id="feats" style="display:grid;grid-template-columns:1fr 1fr;gap:2px 8px"></div>
  <div class="msg" id="dataMsg">No data yet.</div></div></section>
 <section class="panel"><h2><span class="n">2</span>Method<span class="tt" tabindex="0" data-tip="k-means: Lloyd iterations from k-means++ starts, best of 10 runs, spherical clusters in the scaled space. Hierarchical: agglomerative; Ward minimises the variance increase, single/complete/average use Euclidean distances. DBSCAN: density-based, no k, noise points get no cluster (grey crosses). Gaussian mixture: EM from a k-means start, diagonal or full covariance, soft assignments (tooltip shows the probability). Scaling matters: without it, the feature with the largest unit decides.">?</span><i class="chev"></i></h2>
  <div class="body"><div class="pg"><span>Algorithm</span><select id="alg"><option value="km">k-means</option><option value="hc">Hierarchical</option><option value="db">DBSCAN</option><option value="gm">Gaussian mixture</option></select>
  <span class="o-k">Clusters k</span><input type="number" id="k" value="3" min="1" max="20" step="1" class="o-k">
  <span class="o-hc">Linkage</span><select id="link" class="o-hc"><option value="ward">Ward</option><option value="average">Average</option><option value="complete">Complete</option><option value="single">Single</option></select>
  <span class="o-db">eps (scaled units)</span><input type="number" id="eps" value="0.5" min="0.001" step="0.05" class="o-db">
  <span class="o-db">min points</span><input type="number" id="minpts" value="5" min="1" step="1" class="o-db">
  <span class="o-gm">Covariance</span><select id="cov" class="o-gm"><option value="diag">diagonal</option><option value="full">full</option></select>
  <span>Scaling</span><select id="scal"><option value="z">z-score</option><option value="mm">min–max</option><option value="none">none</option></select>
  <span>Seed</span><input type="number" id="seed" value="1" step="1"></div>
  <label class="inl"><input type="checkbox" id="log10">log10 of all features (positive values only)</label>
  <div class="msg" id="runMsg"></div></div></section>
 <section class="panel"><h2><span class="n">3</span>Display<i class="chev"></i></h2>
  <div class="body"><div class="pg"><span>X axis</span><select id="ax"></select><span>Y axis</span><select id="ay"></select></div>
  <label class="inl"><input type="checkbox" id="cent" checked>Cluster centres</label>
  <label class="inl"><input type="checkbox" id="scan" checked>Compute metrics for k = 2…10</label></div></section>
</aside>
<main>
 <div class="legend" id="legend"></div>
 <div class="cards"><div class="card wide"><h3 id="tScat">Clusters<span class="sp"></span><button data-png="cv">PNG</button></h3><canvas id="cv" style="position:static;height:460px"></canvas></div>
  <div class="card" id="cScan1"><h3>Silhouette vs k<span class="sp"></span><button data-png="cs1">PNG</button></h3><canvas id="cs1"></canvas></div>
  <div class="card" id="cScan2"><h3 id="tScan2">Inertia vs k<span class="sp"></span><button data-png="cs2">PNG</button></h3><canvas id="cs2"></canvas></div>
  <div class="card" id="cSil"><h3>Silhouette per sample<span class="sp"></span><button data-png="csil">PNG</button></h3><canvas id="csil"></canvas></div>
  <div class="card" id="cDen"><h3>Dendrogram<span class="sp"></span><button data-png="cden">PNG</button></h3><canvas id="cden"></canvas></div></div>
 <div class="card" style="margin-top:12px"><h3>Clusters<span class="tt" tabindex="0" data-tip="Means are in the original units (before scaling and log). Silhouette ranges from −1 to 1: above about 0.5 the structure is clear, below 0.25 it is weak or absent. Clusters are numbered by decreasing size.">?</span></h3><div class="tw" id="sumT"></div></div>
</main></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toN=s=>{if(typeof s==='number')return s;s=String(s==null?'':s).trim().replace(/\s/g,'');if(s===''||/^(nan|na|n\/a|nd|null|-+)$/i.test(s))return NaN;
  if(/^[-+]?\d{1,3}(\.\d{3})+,\d+$/.test(s))s=s.replace(/\./g,'').replace(',','.');else if(s.includes(',')&&!s.includes('.'))s=s.replace(',','.');
  return /^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(s)?+s:NaN};
const fmt=v=>!isFinite(v)?'–':(Math.abs(v)>=1e5||(Math.abs(v)<1e-3&&v!==0))?v.toExponential(2):String(+v.toPrecision(5));
const f3=v=>isFinite(v)?String(+v.toFixed(3)):'';
function rng(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
let banT=null;function banner(m,err){let b=$('banner');if(!b){b=document.createElement('div');b.id='banner';document.body.appendChild(b);b.style.cssText='position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:60;pointer-events:none;border-radius:6px;padding:7px 14px;font-size:.84rem;box-shadow:0 4px 14px rgba(0,0,0,.25);color:#f5f3ed;max-width:80%'}
  b.textContent=m;b.style.background=err?'#a8623a':'#232220';b.style.display='block';clearTimeout(banT);banT=setTimeout(()=>{b.style.display='none'},err?9000:3500)}
function download(name,text,mime){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime||'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function copyText(t,ok){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>banner(ok||'Copied.'),()=>fallbackCopy(t,ok));else fallbackCopy(t,ok)}
function fallbackCopy(t,ok){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');banner(ok||'Copied.')}catch(e){banner('Copy failed.',true)}a.remove()}
const csvCell=(v,sep)=>{v=v==null?'':String(v);return(v.includes(sep)||v.includes('"')||v.includes('\n'))?'"'+v.replace(/"/g,'""')+'"':v};
document.querySelectorAll('.panel>h2').forEach(h=>h.addEventListener('click',e=>{if(e.target.closest('.tt'))return;h.parentElement.classList.toggle('collapsed')}));
// ---- table parsing (tab, ;, , or whitespace separated; optional header and units row)
function parseTable(text,minCols){
  const lines=text.replace(/\r/g,'').split('\n').map(l=>l.replace(/\s+$/,'')).filter(l=>l.trim()&&!/^(#|\/\/)/.test(l.trim()));if(!lines.length)return{err:'Empty input.'};
  const has=c=>lines.some(l=>l.includes(c));let sep;
  if(has('\t'))sep='\t';else if(has(';'))sep=';';else if(lines.every(l=>l.split(',').length>=(minCols||2)))sep=',';else sep=/\s+/;
  const split=l=>{if(sep===','||sep===';'){const o=[];let c='',q=false;for(const ch of l){if(ch==='"')q=!q;else if(ch===sep&&!q){o.push(c);c=''}else c+=ch}o.push(c);return o.map(s=>s.trim())}return l.split(sep).map(s=>s.trim().replace(/^"|"$/g,''))};
  let rows=lines.map(split);const nc=Math.max(...rows.map(r=>r.length));if(nc<(minCols||2))return{err:`At least ${minCols||2} columns are needed.`};
  const numFrac=r=>r.filter(s=>s!==''&&isFinite(toN(s))).length/Math.max(1,r.filter(s=>s!=='').length);
  let head=null,units=null;if(numFrac(rows[0])<0.5){head=rows.shift();if(rows.length&&numFrac(rows[0])<0.34&&rows.length>1&&rows[0].every(s=>s===''||isNaN(toN(s)))){units=rows.shift()}}
  if(!head)head=Array.from({length:nc},(_,i)=>'col '+(i+1));while(head.length<nc)head.push('col '+(head.length+1));
  rows=rows.map(r=>{while(r.length<nc)r.push('');return r});
  return{head,units,rows,nc,sep:sep===/\s+/?' ':sep}}
const normName=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
// ---- plotting engine ----------------------------------------------------------------
const PAL=['#4a5a4e','#a8623a','#3b6ea5','#c9a227','#7b4f9d','#2a9d8f','#d1495b','#8d6b3f','#6b7f2a','#444444'];

function scanK(alg,r){const X=D.X,n=X.length,K=Math.min(10,n-1),out=[];let M=D.hc;

function cfit(cv){const dpr=window.devicePixelRatio||1,W=cv.clientWidth||600,H=cv.clientHeight||340;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.fillStyle='#fff';x.fillRect(0,0,W,H);return{x,W,H}}
