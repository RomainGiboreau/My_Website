<style>
:root{--bg:#eeece6;--fg:#232220;--mut:#5c5a52;--line:#c9c4b6;--acc:#4a5a4e}
html{color-scheme:light only}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.5 Inter,system-ui,sans-serif}
form{width:min(92vw,360px);padding:0 4px}
h1{font-family:'Space Grotesk',Inter,sans-serif;font-weight:700;font-size:1.2rem;margin:0 0 .25rem}
p{margin:0 0 1rem;color:var(--mut);font-size:.9rem}
.pwr{position:relative}
.pwr input{padding-right:2.6rem}
.eye{position:absolute;right:4px;top:4px;bottom:4px;width:2.2rem!important;margin:0!important;padding:0!important;background:transparent!important;border:0!important;color:var(--mut)!important;display:grid;place-items:center}
.eye svg{width:20px;height:20px}
input,button{font:inherit;width:100%;padding:.65rem .8rem;border-radius:4px;border:1px solid var(--line);background:transparent;color:var(--fg)}
button{margin-top:.6rem;background:var(--acc);border-color:var(--acc);color:#f5f3ed;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#err{min-height:1.4em;margin-top:.6rem;color:#a8623a;font-size:.88rem}
a{color:var(--mut);font-size:.85rem}
</style></head><body>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),K='rg_site_pw';
async function unlock(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.i,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.n)},key,b64(P.c));
  return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
}
function show(html){document.open();document.write(html);document.close()}
const f=document.getElementById('f'),eye=document.getElementById('eye'),pwi=document.getElementById('pw'),err=document.getElementById('err');
eye.addEventListener('click',()=>{const sh=pwi.type==='password';pwi.type=sh?'text':'password';eye.setAttribute('aria-label',sh?'Hide password':'Show password');pwi.focus()});
f.addEventListener('submit',async e=>{
  e.preventDefault();const btn=document.getElementById('go');btn.disabled=true;err.textContent='';
  let v=pwi.value,html=null;
  try{html=await unlock(v)}catch(x){if(v!==v.trim()){v=v.trim();try{html=await unlock(v)}catch(y){}}}
  if(html===null){err.textContent='Incorrect password.';btn.disabled=false;return}
  try{sessionStorage.setItem(K,v)}catch(x){}
  show(html)});
(async()=>{
  if(!window.crypto||!crypto.subtle){f.style.display='';err.textContent='Unsupported browser (HTTPS required).';return}
  let v=null;try{v=sessionStorage.getItem(K)}catch(x){}
  if(v){try{show(await unlock(v));return}catch(x){try{sessionStorage.removeItem(K)}catch(y){}}}
  f.style.display='';pwi.focus()})();
})();
