<script id="bm-core">
/* bm-core: pure logic of the interpretation charts (no DOM). Tested by scripts/biomarkers_test.mjs.
   Fields of the four charts below were digitised from the figures of a review (Ogbesejana et al. 2023, RSC Adv. 13, 25635-25659):
   Fig. 10 (Pr/n-C17 vs Ph/n-C18), Fig. 12 (C19-20 / C21 / C23 tricyclic terpanes), Fig. 13 (C27-C28-C29 steranes) and the C26/C28 TAS plot.
   They are qualitative guides drawn by the authors over their own data, read off the images to about +/-1 % (ternary), +/-0.01 (TAS ratios), +/-0.02 decade (log-log). */
(function(g){
const SQ3=Math.sqrt(3);
// ---- ternary: a = bottom-left vertex, b = top vertex, c = bottom-right vertex; unit side, origin at the bottom-left vertex
const xy=(a,b,c)=>{const t=a+b+c;a/=t;b/=t;c/=t;return[c+b/2,b*SQ3/2]};
const bary=(x,y)=>{const b=y*2/SQ3,c=x-b/2;return[1-b-c,b,c]};
// ---- geometry
const inEllipse=(x,y,E)=>{const th=(E.rot||0)*Math.PI/180,c=Math.cos(th),s=Math.sin(th),u=(x-E.cx)*c+(y-E.cy)*s,v=-(x-E.cx)*s+(y-E.cy)*c;return(u/E.a)**2+(v/E.b)**2<=1};
const inPoly=(x,y,P)=>{let k=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const[xi,yi]=P[i],[xj,yj]=P[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)k=!k}return k};
const centroid=P=>{let A=0,cx=0,cy=0;for(let i=0,j=P.length-1;i<P.length;j=i++){const f=P[j][0]*P[i][1]-P[i][0]*P[j][1];A+=f;cx+=(P[j][0]+P[i][0])*f;cy+=(P[j][1]+P[i][1])*f}return[cx/(3*A),cy/(3*A)]};
const ellipsePts=(E,n)=>{n=n||90;const th=(E.rot||0)*Math.PI/180,c=Math.cos(th),s=Math.sin(th),o=[];for(let k=0;k<=n;k++){const t=2*Math.PI*k/n,u=E.a*Math.cos(t),v=E.b*Math.sin(t);o.push([E.cx+u*c-v*s,E.cy+u*s+v*c])}return o};
// ---- (a) C26/C28 20R TAS vs C26/C28 20S TAS: three ellipses (data coordinates, x = 20S ratio, y = 20R ratio); axis-aligned (fitted rotation < 0.1 deg)
const TAS={x:[0,0.7],y:[0,1],labels:[{t:'A',x:0.284,y:0.478},{t:'B',x:0.5246,y:0.737},{t:'C',x:0.284,y:0.795}],fields:[
 {id:'A',name:'freshwater lacustrine oils',cx:0.2833,cy:0.5192,a:0.1296,b:0.1237,rot:0},
 {id:'B',name:'freshwater / saline / brackish lacustrine oils',cx:0.4768,cy:0.7307,a:0.1047,b:0.1637,rot:0},
 {id:'C',name:'saline / brackish lacustrine oils',cx:0.2866,cy:0.7612,a:0.073,b:0.0971,rot:0}]};
const classTAS=(s20,r20)=>TAS.fields.filter(E=>inEllipse(s20,r20,E)).map(E=>E.id);
// ---- (b) C19-20 TT / C21 TT / C23 TT (% , sum 100): four zones, vertices [C19-20, C21, C23]
const TT={names:['C19-20 TT','C21 TT','C23 TT'],zones:[
 {id:1,name:'marine / saline lacustrine',col:'#8d6b6b',pts:[[26.8,35.1,38.1],[4.7,35.1,60.2],[24.8,15,60.2],[46.9,15,38.1]]},
 {id:2,name:'freshwater lacustrine',col:'#232220',pts:[[19.9,60.3,19.8],[9.9,60.3,29.8],[9.9,50.1,40],[33.8,26.2,40],[43.7,26.2,30.1],[43.7,36.5,19.8]]},
 {id:3,name:'swamp',col:'#3b6ea5',pts:[[68.3,30,1.7],[60.3,30,9.7],[60.3,19.9,19.8],[80.2,0,19.8],[93.8,4.5,1.7]]},
 {id:4,name:'fluvial / deltaic',col:'#c0392b',pts:[[49.9,30,20.1],[34.2,30,35.8],[44.1,20.1,35.8],[59.8,20.1,20.1]]}]};
const zonePlane=z=>z.pts.map(p=>xy(...p));
const classTT=(a,b,c)=>{const q=xy(a,b,c);return TT.zones.filter(z=>inPoly(q[0],q[1],zonePlane(z))).map(z=>z.id)};
// ---- (c) steranes: ellipses of the review's Fig. 13 in plane coordinates (unit side; a = C27 at bottom left, b = C28 at the top, c = C29 at bottom right); axis-aligned
const STER={names:['C27','C28','C29'],fields:[
 {id:'II',grp:'II',name:'lacustrine (algae)',cx:0.4882,cy:0.362,a:0.0829,b:0.226,rot:0},
 {id:'T',grp:'T',name:'transitional',cx:0.6162,cy:0.3669,a:0.0476,b:0.1779,rot:0},
 {id:'I',grp:'I',name:'terrestrial (higher plant)',cx:0.7227,cy:0.1896,a:0.0985,b:0.1775,rot:0},
 {id:'IVp',grp:'IV',name:'open marine (phytoplankton)',cx:0.2835,cy:0.2324,a:0.107,b:0.1308,rot:0},

const D={table:null,map:{},rows:[],groups:[],tab:'plots',dr:null};
const isVal=(o,k)=>o.r&&isFinite(o.r[k]);
// ---- columns
function fillMap(){const t=D.table,used=new Set();D.map={};
  const detect=(key,re)=>{let j=-1;for(let i=0;i<t.nc;i++){if(used.has(i))continue;if(re.test(normName(t.head[i]))){j=i;break}}if(j>=0)used.add(j);D.map[key]=j};
  for(const f of IDF)detect(f.k,f.re);for(const r of RAT)detect('r_'+r.id,r.re);for(const [k,,re] of PK)detect('p_'+k,re);
  const opt=key=>`<select data-m="${key}"><option value="-1">—</option>${t.head.map((h,i)=>`<option value="${i}"${D.map[key]===i?' selected':''}>${esc(h)}</option>`).join('')}</select>`;
  $('mapId').innerHTML=IDF.map(f=>`<span>${f.label}</span>${opt(f.k)}`).join('');
  $('mapR').innerHTML=RAT.map(r=>`<span>${esc(r.label)}</span>${opt('r_'+r.id)}`).join('');
  $('mapP').innerHTML=PK.map(([k,l])=>`<span>${esc(l)}</span>${opt('p_'+k)}`).join('');
  document.querySelectorAll('[data-m]').forEach(e=>e.onchange=()=>{D.map[e.dataset.m]=+e.value;build()})}
function loadText(text){const t=parseTable(text,2);if(t.err){$('dataMsg').textContent=t.err;$('dataMsg').className='msg err';return false}D.table=t;fillMap();build();return true}
$('paste').addEventListener('input',()=>{clearTimeout(D.pt);D.pt=setTimeout(()=>{if($('paste').value.trim())loadText($('paste').value)},350)});
$('bOpen').onclick=()=>$('file').click();
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('paste').value=r.result.length>3e6?r.result.slice(0,3e6):r.result;loadText(r.result)};r.readAsText(f);e.target.value=''};
document.addEventListener('dragover',e=>e.preventDefault());document.addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('paste').value=r.result;loadText(r.result)};r.readAsText(f)});
function build(){const t=D.table,M=D.map;if(!t)return;D.rows=[];
  t.rows.forEach((r,n)=>{const o={n,raw:r,v:{},f:{},r:{},src:{}};
    for(const f of IDF){const j=M[f.k];o[f.k]=j>=0?(f.text?(r[j]||'').trim():toN(r[j])):(f.text?'':NaN)}if(!o.id)o.id='#'+(n+1);
    for(const [k] of PK){const j=M['p_'+k];o.v[k]=j>=0?toN(r[j]):NaN}
    for(const R of RAT){const j=M['r_'+R.id];o.f[R.id]=j>=0?toN(r[j]):NaN}
    D.rows.push(o)});
  // percent-type ratios given as fractions
  for(const pc of [['pc27','pc28','pc29'],['ptt1920','ptt21','ptt23']])if(pc.every(k=>D.rows.some(o=>isFinite(o.f[k])))){const s=D.rows.map(o=>pc.reduce((a,k)=>a+o.f[k],0)).filter(isFinite);if(s.length&&s.filter(v=>v>0.9&&v<1.1).length>s.length/2)for(const o of D.rows)for(const k of pc)o.f[k]*=100}
  let nd=0,nf=0,nc=0;
  for(const R of RAT){for(const o of D.rows){let c=NaN;if(!R.dep||isFinite(o.r[R.dep]))c=R.calc(o);const f=o.f[R.id];
      if(isFinite(f)){o.r[R.id]=f;o.src[R.id]='file';nf++;if(isFinite(c)&&Math.abs(f-c)>0.05*Math.abs(c)+1e-9){nd++;(o.diff=o.diff||[]).push(R.id)}}
      else if(isFinite(c)){o.r[R.id]=c;o.src[R.id]='calc';nc++}}}
  D.groups=[...new Set(D.rows.map(o=>o.group).filter(g=>g))];D.avail=RAT.filter(R=>D.rows.some(o=>isFinite(o.r[R.id])));
  const ds=D.rows.map(o=>o.depth).filter(isFinite);D.dr=ds.length?[Math.min(...ds),Math.max(...ds)]:null;
  const m=$('dataMsg');m.className='msg';m.textContent=`${D.rows.length} samples · ${D.avail.length} ratio(s) available (${nf} values read from the file, ${nc} computed from peaks)${nd?` · ${nd} file value(s) differ by more than 5 % from the value recomputed from the peaks`:''}`;
  if(!D.avail.length){m.textContent+=' · no ratio can be formed: map the ratio or peak columns in section 2';m.className='msg err'}
  buildSel();refresh()}
// ---- colours
const colorOf=o=>{if($('colby').value==='depth'&&D.dr&&isFinite(o.depth)){const t=(o.depth-D.dr[0])/((D.dr[1]-D.dr[0])||1),a=[74,90,78],b=[168,98,58];return`rgb(${a.map((v,i)=>Math.round(v+(b[i]-v)*t))})`}
  return D.groups.length?PAL[Math.max(0,D.groups.indexOf(o.group))%PAL.length]:'#4a5a4e'};
function legend(){let h='';if($('colby').value==='depth'&&D.dr)h=`<span><i style="background:#4a5a4e"></i>${fmt(D.dr[0])}</span><span>→</span><span><i style="background:#a8623a"></i>${fmt(D.dr[1])} (depth)</span>`;else if(D.groups.length)h=D.groups.map((g,i)=>`<span><i style="background:${PAL[i%PAL.length]}"></i>${esc(g)}</span>`).join('');$('legend').innerHTML=h}
const lab=id=>RAT.find(r=>r.id===id).label;
const info=o=>`<b>${esc(o.id)}</b>${o.group?' · '+esc(o.group):''}${isFinite(o.depth)?'<br>depth '+fmt(o.depth):''}`+D.avail.map(R=>isFinite(o.r[R.id])?`<br>${esc(R.label.split(' (')[0].split(' =')[0])} ${fmt(o.r[R.id])}`:'').join('');
const mk=(fx,fy)=>{const out=[];for(const o of D.rows){const x=fx(o),y=fy(o);if(isFinite(x)&&isFinite(y))out.push({x,y,c:colorOf(o),info:info(o)})}return out};
const has=(...ids)=>ids.every(i=>D.rows.some(o=>isFinite(o.r[i])));
// ---- ternary
function ternary(cv,cfg){const dpr=window.devicePixelRatio||1,W=cv.clientWidth||500,H=cv.clientHeight||340;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.fillStyle='#fff';x.fillRect(0,0,W,H);cv._hits=[];
  const s=Math.min(W-90,(H-70)*2/Math.sqrt(3)),h=s*Math.sqrt(3)/2,x0=(W-s)/2,y0=H-34,N=cfg.names;       // N[0] bottom-left, N[1] top, N[2] bottom-right
  const P=(a,b,c)=>{const t=a+b+c;a/=t;b/=t;c/=t;return[x0+s*(c+b/2),y0-h*b]};
  x.strokeStyle='#ece9df';x.lineWidth=1;x.font='10px Inter,sans-serif';x.fillStyle='#8a8678';
  for(let k=1;k<5;k++){const f=k/5;for(const [p,q] of [[P(1-f,f,0),P(0,f,1-f)],[P(f,0,1-f),P(f,1-f,0)],[P(1-f,0,f),P(0,1-f,f)]]){x.beginPath();x.moveTo(...p);x.lineTo(...q);x.stroke()}
    x.textAlign='right';x.fillText(Math.round(f*100),...P(1-f,f,0).map((v,i)=>i?v+3:v-4));x.textAlign='center';x.fillText(Math.round(f*100),x0+s*f,y0+12)}
  x.strokeStyle='#8a8678';x.beginPath();x.moveTo(...P(1,0,0));x.lineTo(...P(0,1,0));x.lineTo(...P(0,0,1));x.closePath();x.stroke();
  x.fillStyle='#232220';x.font='600 12px Inter,sans-serif';x.textAlign='right';x.fillText('% '+N[0],x0-8,y0+4);x.textAlign='left';x.fillText('% '+N[2],x0+s+8,y0+4);x.textAlign='center';x.fillText('% '+N[1],x0+s/2,y0-h-10);
  x.font='10px Inter,sans-serif';x.fillStyle='#5c5a52';x.fillText('ticks: bottom = % '+N[2]+', left = % '+N[1],x0+s/2,y0+26);
  if($('abq').checked&&cfg.draw)cfg.draw(x,P,{s,h,x0,y0,xy:(X,Y)=>[x0+s*X,y0-s*Y],note:(i,t,c)=>{x.save();x.font='10px Inter,sans-serif';x.fillStyle=c||'#8a8678';x.textAlign='left';x.fillText(t,6,12+12*i);x.restore()}});
  for(const o of D.rows){const[a,b,c]=cfg.pt(o);if(![a,b,c].every(isFinite)||a+b+c<=0)continue;const [px,py]=P(a,b,c);x.beginPath();x.arc(px,py,4.5,0,7);x.fillStyle=colorOf(o);x.fill();x.lineWidth=1;x.strokeStyle='#232220';x.stroke();cv._hits.push({x:px,y:py,i:info(o)})}
  if(!cv._tip){cv._tip=true;cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;let best=null,bd=100;for(const q of cv._hits||[]){const d=(q.x-mx)**2+(q.y-my)**2;if(d<bd){bd=d;best=q}}const t=tipEl();if(best){t.innerHTML=best.i;t.style.display='block';t.style.left=Math.min(innerWidth-310,e.clientX+14)+'px';t.style.top=e.clientY+14+'px'}else t.style.display='none'});cv.addEventListener('mouseleave',()=>{tipEl().style.display='none'})}}
// sterane ternary: Huang & Meinschein (1979) labels (memory, schematic) and/or the fields digitised from Fig. 13 of the review (Ogbesejana et al. 2023)
const sterCfg=()=>({names:['C27','C28','C29'],pt:o=>[o.r.pc27,o.r.pc28,o.r.pc29],draw:(x,P,G)=>{const m=$('sfs').value;let n=0;
  if(m!=='paper'){x.font='italic 11px Inter,sans-serif';x.fillStyle='#8a8678';x.textAlign='center';
    for(const [a,b,c,t] of [[72,10,18,'Plankton / marine'],[45,8,47,'Estuarine / bay'],[18,10,72,'Higher plants'],[30,48,22,'Lacustrine algae']])x.fillText(t,...P(a,b,c));
    G.note(n++,'grey: Huang & Meinschein (1979), schematic')}
  if(m!=='hm'){x.save();x.strokeStyle='#3b6ea5';x.lineWidth=1.4;for(const E of BM.STER.fields){x.beginPath();BM.ellipsePts(E,90).forEach(([X,Y],i)=>{const q=G.xy(X,Y);i?x.lineTo(...q):x.moveTo(...q)});x.stroke()}
    x.fillStyle='#3b6ea5';x.textAlign='center';x.font='10px Inter,sans-serif';for(const l of BM.STER.labels){const q=G.xy(l.x,l.y);x.save();x.translate(...q);if(l.rot)x.rotate(l.rot*Math.PI/180);x.fillText(l.t,0,0);x.restore()}x.restore();
    G.note(n++,'blue: Ogbesejana et al. (2023), Fig. 13','#3b6ea5')}}});

const ttCfg=()=>({names:BM.TT.names,pt:o=>[o.r.ptt1920,o.r.ptt21,o.r.ptt23],draw:(x,P,G)=>{x.save();x.lineWidth=1.6;x.setLineDash([7,4]);

  for(const z of BM.TT.zones){x.strokeStyle=z.col;x.beginPath();z.pts.forEach((p,i)=>i?x.lineTo(...P(...p)):x.moveTo(...P(...p)));x.closePath();x.stroke()}
  x.setLineDash([]);x.font='10px Inter,sans-serif';x.textAlign='center';for(const z of BM.TT.zones){const l=LB[z.id],q=P(...l.p);x.fillStyle=z.col;l.t.forEach((t,i)=>x.fillText(t,q[0],q[1]+(i-(l.t.length-1)/2)*11))}x.restore();

({"what":"Runs entirely in your browser: nothing you load leaves your machine. Biomarker ratios from GC and GC-MS peaks (or ready-made ratios), crossplots, ternary diagrams (steranes, tricyclic terpanes), triaromatic steroid and maturity indicators, and depth profiles.","method":["Input: ready-made ratios, peak areas or heights, or both. A ratio found in the file is used as such, otherwise it is recomputed from the peaks. All peaks of one kind must be in the same unit.","Ratios: Pr/Ph, Pr/n-C17, Ph/n-C18, Ts/Tm, Ts/(Ts + Tm), C29/C30 hopane, gammacerane/C30 hopane, oleanane/C30 hopane, homohopane index C35/ΣC31–C35, C31 and C32 hopane 22S/(22S + 22R), C29 sterane 20S/(20S + 20R) and ββ/(ββ + αα), %C27, %C28, %C29 steranes, DBT/P, MPI-1 = 1.5(2-MP + 3-MP)/(P + 1-MP + 9-MP), Rc = 0.6·MPI-1 + 0.4 (%, below Ro ≈ 1.35), C26/C28 20S and 20R triaromatic steroids (TAS), and %C19-20 TT, %C21 TT, %C23 TT (C19 + C20 tricyclic terpanes, C21 and C23 tricyclic terpanes; peaks TT19 and TT20 are summed when no combined column is given).","Interpretation charts (switch in Display): Pr/n-C17 vs Ph/n-C18 with the four diagonal lines, three arrows (maturation, oxidizing, reducing) and labels of Fig. 10 of the Ogbesejana et al. (2023) review; Pr/Ph vs DBT/P with zones 1A, 1B, 2–3 and 4; sterane ternary with the fields of Fig. 13 of that review (I terrestrial, II lacustrine, IV open marine, transitional; III is only a label there) and/or the older schematic Huang & Meinschein labels (selector in Display); C29 sterane maturity with both equilibrium lines and maturity stages; C29/C30 hopane = 1 between shale and carbonate sources with the gammacerane trend; MPI-1 vs Rc with the calibration line, the oil-window start and the 1.35 % reversal; C26/C28 20R vs 20S TAS with ellipses A, B, C; C19-20 / C21 / C23 tricyclic terpane ternary with zones 1 to 4. A chart appears only when its columns are available.","Plots: Pr/Ph against DBT/P, sterane ternary, Ts/(Ts + Tm) and Ts/Tm against C32 22S/(22S + 22R) with the ‘~equilibrium’ line at 0.6, gammacerane index, MPI-1 against Rc, depth profiles.","The review's fields were read off the images by pixel positions: outline pixels of the ellipses were fitted by least squares (axis-aligned within about 1°), dashed polygon sides were fitted as constant-percentage lines of the ternary and intersected, the diagonal lines of Fig. 10 were fitted on their pixels, and the axes were calibrated on the tick marks or on the triangle outline. Precision: about ±1 % in the ternaries (±2 % for the lower side of TT zone 2, hidden under the data symbols of the original), ±0.01 in the TAS ratios, about ±0.02 decade in the log-log plot. The classification helpers (point in ellipse or polygon, region of the Pr/n-C17 plot) are in the page's bm-core script and tested."],"sources":[["Ratio definitions, MPI-1 and Rc","Standard geochemical practice; the formulas are those written on the page","classical (references to add)"],["‘~equilibrium’ lines: 0.6 for hopane 22S/(22S + 22R), 0.55 for C29 sterane 20S/(20S + 20R)","A 2025 article in Frontiers in Earth Science (doi 10.3389/feart.2025.1536268) quotes about 60 % for homohopanes (Peters &amp; Moldowan 1993) and 0.52–0.55 for the C29 sterane ratio (Seifert &amp; Moldowan 1978); the originals were not read. The same article quotes 0.57–0.62 for ββ/(ββ + αα) (Peters &amp; Cassa 1994): no line is drawn on that axis","published (second hand)"],["Rc = 0.6·MPI-1 + 0.4","Written in secondary articles, one attributing it to Radke (1988); MPI-1 itself is from Radke &amp; Welte (1983). The branch for Ro above about 1.35 % was not found","published (second hand; second branch not found)"],["Review used for four of the charts","Ogbesejana A. B., Liu B., Gao Y., Akinyemi S. A., Bello O. M., Song Y. (2023) Applying biomarkers as paleoenvironmental indicators to reveal the organic matter enrichment of shale during deep energy exploration: a review. RSC Advances 13(36), 25635–25659, doi 10.1039/d3ra04435a (open access, PMC10464518). Text, captions and reference list read; the figures were supplied as images.","published (review)"],["Pr/n-C17 vs Ph/n-C18: four diagonal lines, three arrows, labels (terrestrial (coals), mixed organic matter / transitional, algal marine / reducing, biodegradation)","Fig. 10 of the review, whose caption cites its refs 18 (Ogbesejana, Bello &amp; Okunola 2021, Heliyon 7(3) e06616) and 141 (Shanmugam 1985, AAPG Bulletin 69(8) 1241–1254). Values read off the figure in the review, not from the original publications, which were not read. The lines are hand-drawn: their log-log slopes (0.95 to 1.09) are not exactly 1 and they are not labelled with Pr/Ph values, so the Pr/Ph 0.6 / 1 / 3 lines of the previous version were dropped.","figure (review)"],["Sterane ternary, second set of fields: I terrestrial (higher plant), II lacustrine (algae), IV open marine (phytoplankton, zooplankton), transitional; III estuarine / bay","Fig. 13 of the review, caption refs 18 and 192 (192 = Huang &amp; Meinschein 1979, Geochim. Cosmochim. Acta 43(5) 739–745, not read). Five ellipses read off the figure; III has a label but no drawn boundary. Qualitative fields drawn by the review's authors over their Niger Delta samples.","figure (review)"],["C19-20 / C21 / C23 tricyclic terpane ternary: zone 1 marine / saline lacustrine, 2 freshwater lacustrine, 3 swamp, 4 fluvial / deltaic","Fig. 12 of the review, caption refs 169 (Xiao et al. 2018, Energy &amp; Fuels 32(7) 7393–7403) and 170 (Ogbesejana &amp; Bello 2020, Acta Geochim. 39(6) 973–987); the text also cites its refs 173 and 174 (Xiao et al. 2019, Org. Geochem. 138, 103929; Geochimica 48(2) 161–170) for the four environments. Polygons read off the figure; none of these originals was read.","figure (review)"],["C26/C28 20R vs 20S TAS: ellipses A freshwater lacustrine oils, B freshwater / saline / brackish lacustrine oils, C saline / brackish lacustrine oils","Triaromatic steroid cross plot of the review (Fig. 15 in its text, caption refs 215 and 217: Ogbesejana 2018, J. Sci. Ind. Res. 2(1) 55–70; Li et al. 2012, Appl. Geochem. 27(8) 1643–1654; not read). The axes of the image read C26/C28 20R and C26/C28 20S, whereas the caption and the text of the review say C27/C28 20R: the page follows the axes of the image. The review states that C28-TAS is common in freshwater and C26-TAS in saline and brackish settings (its refs 213–216).","figure (review)"],["Digitisation of the four figures","Own work on the supplied images (method in the Method section); precision stated there. The data columns and example values for these charts are fictitious.","derived"],["Pr/Ph vs DBT/P zones 1A, 1B, 2–3, 4 with limits Pr/Ph 1 and 3, DBT/P 1","Hughes, Holba &amp; Dzou (1995), Geochimica et Cosmochimica Acta 59; zones 2 and 3 are merged here because their DBT/P limit was not recalled reliably","memory (not re-checked)"],["Sterane ternary: grey labels (plankton, estuarine, higher plants, lacustrine algae)","Huang &amp; Meinschein (1979), Geochimica et Cosmochimica Acta 43; the original was not available, positions are schematic. The review's Fig. 13 (above) is offered as a second set in the Display panel.","memory (schematic)"],["C29/C30 hopane above 1 for carbonate / marl sources; high gammacerane for a stratified, saline water column","Common practice (Peters, Walters &amp; Moldowan 2005, The Biomarker Guide)","memory"]],"validation":["scripts/biomarkers_test.mjs checks the pure logic against the digitised values: ternary transform on the vertices and the centroid, round trip of all field vertices, classification of the centre of every field (and of the printed labels), TAS ellipse extents and the Fig. 10 line end points against the pixel positions read in the images. It is a transcription and self-consistency check, not a validation against the original publications.","No validation against an independent implementation is recorded for the ratio calculations of this page."],"limits":["Interpretation charts are screening guides: fields and limits come from memory, second-hand quotes or digitised figures of a review (see sources) and are not calibrated envelopes; switch them off in Display to see the data alone.","The fields of the four digitised charts were drawn by the review's authors over their own Niger Delta data: they are qualitative guides, not calibrated limits, and the originals behind them were not read.","TT zones overlap (2 with 4, 1 with 2): a point can fall in two zones. The lower side of zone 2 is hidden by data symbols in the original and was read from a short visible segment.","Fig. 10 lines are extended by their equation when data fall outside the frame 0.1–10 × 0.1–100; the extension is not in the original.","Rc = 0.6·MPI-1 + 0.4 holds only below Ro ≈ 1.35 %: MPI-1 reverses beyond, and the page applies the same line to every value.","The Pr/Ph vs DBT/P zones (Hughes et al. 1995) and the Huang & Meinschein labels remain from memory and schematic."],"date":"26 November 2026"});
